<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket</title>
<meta name="description" content="A single-file mobile web app for Vikunja. Drop it on any static host.">
<meta name="theme-color" content="#EEF1EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1513" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pocket">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#EEF1EF; --surface:#FFFFFF; --sunk:#E3E8E5; --ink:#17201C; --muted:#5B6863; --line:#D6DDD9;
  --accent:#1D6B52; --accent-ink:#FFFFFF; --accent-soft:#D8EBE3;
  --overdue:#A82339; --today:#9A6414; --danger:#A82339;
  --r-row:14px; --r-sheet:22px; --r-chip:999px;
  --pad:16px; --tab-h:58px; --cap-h:64px;
  --shadow:0 -1px 0 var(--line), 0 -12px 30px rgba(23,32,28,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F1513; --surface:#18201D; --sunk:#111816; --ink:#E7EDEA; --muted:#93A29C; --line:#26312D;
  --accent:#4FB08D; --accent-ink:#06120D; --accent-soft:#1B3A2F;
  --overdue:#F07A8B; --today:#E0A94A; --danger:#F07A8B;
  --shadow:0 -1px 0 var(--line), 0 -12px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- login ---------- */
#login{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:calc(env(safe-area-inset-top) + 32px) 24px calc(env(safe-area-inset-bottom) + 32px);max-width:440px;margin:0 auto}
#login h1{font-size:40px;line-height:1.05;letter-spacing:-.02em;margin:0 0 8px;font-weight:800}
#login p.lead{color:var(--muted);margin:0 0 28px}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);outline:none;font-size:17px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:650;font-size:17px}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--line)}
.btn[disabled]{opacity:.55}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;margin-bottom:16px}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:9px;font-size:15px;color:var(--muted);font-weight:600}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.note{font-size:14px;color:var(--muted);margin:10px 0 0}
.err{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger);border-radius:12px;padding:12px 14px;font-size:15px;margin:0 0 16px;white-space:pre-line}
.err code{font-size:13px;background:rgba(0,0,0,.06);padding:1px 4px;border-radius:4px;white-space:nowrap}

/* ---------- shell ---------- */
#app{min-height:100%}
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);padding:calc(env(safe-area-inset-top) + 10px) var(--pad) 10px;display:flex;align-items:flex-end;gap:10px}
header.top .t{flex:1;min-width:0}
header.top .kicker{color:var(--muted);font-size:15px;font-weight:600}
header.top h2{margin:0;font-size:32px;line-height:1.1;letter-spacing:-.02em;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:40px;height:40px;border-radius:20px;border:0;background:var(--surface);display:grid;place-items:center;color:var(--ink);flex:none}
.icon-btn.plain{background:transparent}
main{padding:4px var(--pad) calc(var(--tab-h) + var(--cap-h) + env(safe-area-inset-bottom) + 28px)}

.sec{margin:18px 0 6px;display:flex;align-items:baseline;gap:8px;font-weight:700;font-size:15px}
.sec .n{color:var(--muted);font-weight:600}
.sec.overdue{color:var(--overdue)} .sec.today{color:var(--today)}
.list{background:var(--surface);border-radius:var(--r-row);overflow:hidden}
.row{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-height:56px;position:relative}
.row:first-child{border-top:0}
.row .body{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:2px 0}
.row .title{font-size:16.5px;overflow-wrap:anywhere}
.row.done .title{color:var(--muted);text-decoration:line-through}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:3px;font-size:13.5px;color:var(--muted)}
.meta .due.overdue{color:var(--overdue);font-weight:600}
.meta .due.today{color:var(--today);font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px;background:var(--muted)}
.prio{font-weight:800;color:var(--overdue);letter-spacing:-.05em}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);background:transparent;flex:none;margin-top:1px;display:grid;place-items:center;padding:0;transition:background .15s,border-color .15s}
.check svg{width:15px;height:15px;stroke:var(--accent-ink);stroke-width:3;opacity:0}
.check.p3,.check.p4,.check.p5{border-color:var(--overdue)}
.row.done .check,.check.on{background:var(--accent);border-color:var(--accent)}
.row.done .check svg,.check.on svg{opacity:1}
.empty{text-align:center;color:var(--muted);padding:48px 12px}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
.loading{padding:40px 0;text-align:center;color:var(--muted)}

.tree .row{align-items:center;padding-top:14px;padding-bottom:14px}
.tree .row .body{display:flex;align-items:center;gap:10px}
.tree .chev{color:var(--muted)}
.toggle-done{margin:14px 0 0;width:100%}

/* ---------- capture bar ---------- */
#capture{position:fixed;left:0;right:0;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom));z-index:6;padding:10px var(--pad) 8px;background:var(--bg)}
#capture::before{content:"";position:absolute;left:0;right:0;top:-18px;height:18px;background:linear-gradient(to bottom,transparent,var(--bg));pointer-events:none}
#capture form{display:flex;gap:8px;align-items:center;background:var(--surface);border:2px solid var(--accent);border-radius:16px;padding:4px 4px 4px 14px}
#capture input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:17px;padding:10px 0}
#capture input::placeholder{color:var(--muted)}
#capture .go{width:42px;height:42px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
#capture .go[disabled]{opacity:.35}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:13.5px;padding:5px 10px;border-radius:var(--r-chip);background:var(--accent-soft);color:var(--ink);border:0;white-space:nowrap}
.chip.warn{background:color-mix(in srgb,var(--today) 20%,transparent)}
.chip .x{font-weight:700;opacity:.6;margin-left:2px}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;height:calc(var(--tab-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--surface);box-shadow:var(--shadow);display:flex}
nav.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);text-decoration:none;font-size:12px;font-weight:600}
nav.tabs a[aria-current=page]{color:var(--accent)}

/* ---------- sheet ---------- */
#scrim{position:fixed;inset:0;background:rgba(10,16,13,.42);z-index:20;opacity:0;transition:opacity .2s}
#scrim.show{opacity:1}
#sheet{position:fixed;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top) + 28px);z-index:21;background:var(--bg);border-radius:var(--r-sheet) var(--r-sheet) 0 0;display:flex;flex-direction:column;transform:translateY(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-width:720px;margin:0 auto}
#sheet.show{transform:none}
@media (prefers-reduced-motion:reduce){#sheet,#scrim{transition:none}}
#sheet .bar{display:flex;align-items:center;gap:8px;padding:12px 12px 6px}
#sheet .bar .grab{flex:1;display:flex;justify-content:center}
#sheet .bar .grab i{width:40px;height:5px;border-radius:3px;background:var(--line)}
#sheet .scroll{flex:1;overflow:auto;padding:4px var(--pad) calc(env(safe-area-inset-bottom) + 32px);-webkit-overflow-scrolling:touch}
.d-title{display:flex;gap:12px;align-items:flex-start;margin:4px 0 18px}
.d-title textarea{flex:1;border:0;background:transparent;font-size:24px;font-weight:750;line-height:1.2;letter-spacing:-.01em;resize:none;outline:0;padding:0;min-height:30px}
.d-title .check{width:30px;height:30px;margin-top:0}
.card{background:var(--surface);border-radius:var(--r-row);margin-bottom:14px}
.prop{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line);min-height:52px}
.prop:first-child{border-top:0}
.prop .k{width:72px;flex:none;color:var(--muted);font-size:15px}
.prop .v{flex:1;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prop select,.prop input[type=datetime-local]{flex:1;min-width:0;border:0;background:transparent;font-size:16px;padding:6px 0;outline:0}
.prop.stack{flex-direction:column;align-items:stretch;gap:8px;padding-top:12px;padding-bottom:12px}
.prop.stack .k{width:auto}
.prios{display:flex;gap:4px;flex:1}
.prios button{flex:1;border:0;border-radius:8px;background:var(--sunk);padding:9px 0;font-size:14px;font-weight:650;color:var(--muted)}
.prios button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.prios button.hot[aria-pressed=true]{background:var(--overdue);color:#fff}
.label-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 6px 5px 10px;border-radius:var(--r-chip);background:var(--sunk);font-size:14px;border:0}
.label-chip .x{width:24px;height:24px;border-radius:12px;display:grid;place-items:center;color:var(--muted);border:0;background:transparent;padding:0}
.add-label{border:1.5px dashed var(--line);background:transparent;color:var(--muted);border-radius:var(--r-chip);padding:4px 12px;font-size:14px}
.desc{padding:14px;font-size:16px;line-height:1.5;overflow-wrap:anywhere}
.desc :first-child{margin-top:0} .desc :last-child{margin-bottom:0}
.desc a{color:var(--accent)}
.desc ul[data-type=taskList]{list-style:none;padding-left:4px}
.desc li[data-checked]::before{content:"○ ";color:var(--muted)}
.desc li[data-checked=true]::before{content:"● ";color:var(--accent)}
.desc li[data-checked] p{display:inline}
.desc .ph{color:var(--muted)}
.desc-edit{padding:10px}
.desc-edit textarea{width:100%;min-height:140px;border:1.5px solid var(--accent);border-radius:10px;padding:10px;background:var(--bg);font-size:16px;line-height:1.45;outline:0;resize:vertical}
.row-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.h3{font-size:15px;font-weight:700;margin:22px 2px 8px;display:flex;align-items:baseline;gap:8px}
.h3 .n{color:var(--muted);font-weight:600}
.comment{padding:12px 14px;border-top:1px solid var(--line)}
.comment:first-child{border-top:0}
.comment .who{font-size:13.5px;color:var(--muted);margin-bottom:3px}
.comment .who b{color:var(--ink);font-weight:650}
.comment-form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.comment-form:first-child{border-top:0}
.comment-form textarea{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--bg);font-size:16px;resize:none;min-height:42px;outline:0}
.comment-form textarea:focus{border-color:var(--accent)}
.att{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line);width:100%;border-left:0;border-right:0;border-bottom:0;background:transparent;text-align:left}
.att:first-child{border-top:0}
.att .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att .sz{color:var(--muted);font-size:13px}
.danger-zone{margin-top:28px}
.picker{padding:6px 0}
.picker button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:12px 14px;text-align:left;border-top:1px solid var(--line)}
.picker button:first-child{border-top:0}
.picker input{margin:10px 14px;width:calc(100% - 28px);padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);outline:0}
.saved{font-size:13px;color:var(--muted);text-align:right;min-height:18px;margin-top:-8px;margin-bottom:6px}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + var(--cap-h) + env(safe-area-inset-bottom) + 22px);transform:translate(-50%,20px);z-index:30;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;max-width:calc(100% - 32px);box-shadow:0 8px 28px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{border:0;background:transparent;color:var(--accent-soft);font-weight:700;padding:6px 8px}
@media (prefers-color-scheme:dark){#toast button{color:var(--accent)}}
body.sheet-open #toast{bottom:calc(env(safe-area-inset-bottom) + 20px)}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8M4 4v4h4M4 13a8 8 0 0 0 14.3 4.9L20 16M20 20v-4h-4"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
  <symbol id="i-clip" viewBox="0 0 24 24"><path d="M21 11.5l-8.6 8.6a5 5 0 0 1-7.1-7.1l8.6-8.6a3.3 3.3 0 0 1 4.7 4.7l-8.6 8.6a1.7 1.7 0 0 1-2.4-2.4l7.9-7.9"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></symbol>
</svg>

<!-- ============ LOGIN ============ -->
<section id="login" hidden>
  <h1>Pocket</h1>
  <p class="lead">Today's tasks and quick capture for your Vikunja.</p>
  <div id="login-err" class="err" hidden></div>

  <form id="f-server">
    <label class="field"><span>Vikunja address</span>
      <input id="in-server" type="url" inputmode="url" autocomplete="url" placeholder="https://tasks.example.com" required autocapitalize="off" spellcheck="false"></label>
    <button class="btn block" type="submit">Continue</button>
  </form>

  <div id="auth-step" hidden>
    <div class="seg" role="group" aria-label="Sign-in method">
      <button type="button" data-mode="session" aria-pressed="true">Password</button>
      <button type="button" data-mode="token" aria-pressed="false">API token</button>
    </div>
    <form id="f-pass">
      <label class="field"><span>Username or email</span><input id="in-user" autocomplete="username" autocapitalize="off" spellcheck="false" required></label>
      <label class="field"><span>Password</span><input id="in-pass" type="password" autocomplete="current-password" required></label>
      <label class="field" id="totp-field" hidden><span>Two-factor code</span><input id="in-totp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*"></label>
      <button class="btn block" type="submit">Sign in</button>
    </form>
    <form id="f-token" hidden>
      <label class="field"><span>API token</span><input id="in-token" autocapitalize="off" spellcheck="false" required placeholder="tk_…"></label>
      <button class="btn block" type="submit">Connect</button>
      <p class="note">Create one in Vikunja under Settings → API Tokens. Pick the “Task Management” preset, then also tick “User” under Other.</p>
    </form>
    <button id="btn-change-server" class="btn ghost block" type="button" style="margin-top:12px">Use a different address</button>
  </div>
</section>

<!-- ============ APP ============ -->
<div id="app" hidden>
  <header class="top">
    <button id="btn-back" class="icon-btn plain" aria-label="Back" hidden><svg class="i"><use href="#i-back"/></svg></button>
    <div class="t"><div class="kicker" id="kicker"></div><h2 id="heading">Today</h2></div>
    <button id="btn-refresh" class="icon-btn" aria-label="Refresh"><svg class="i"><use href="#i-refresh"/></svg></button>
    <button id="btn-account" class="icon-btn" aria-label="Account"><svg class="i"><use href="#i-user"/></svg></button>
  </header>
  <main id="view" aria-live="polite"></main>

  <div id="capture">
    <form id="f-capture" autocomplete="off">
      <input id="in-capture" placeholder="Add a task" aria-label="New task" enterkeyhint="send">
      <button class="go" type="submit" aria-label="Add task" disabled><svg class="i"><use href="#i-up"/></svg></button>
    </form>
    <div class="chips" id="cap-chips"></div>
  </div>

  <nav class="tabs">
    <a href="#/today" data-tab="today"><svg class="i"><use href="#i-sun"/></svg>Today</a>
    <a href="#/projects" data-tab="projects"><svg class="i"><use href="#i-folder"/></svg>Projects</a>
  </nav>
</div>

<div id="scrim" hidden></div>
<section id="sheet" role="dialog" aria-modal="true" aria-label="Task" hidden>
  <div class="bar">
    <span style="width:40px"></span>
    <div class="grab"><i></i></div>
    <button class="icon-btn" id="btn-sheet-close" aria-label="Close"><svg class="i"><use href="#i-close"/></svg></button>
  </div>
  <div class="scroll" id="sheet-body"></div>
</section>

<div id="toast" role="status"><span id="toast-msg"></span><button id="toast-act" hidden></button></div>

<script>
'use strict';
/* =============== storage & state =============== */
const store = {
  get(k){ try{ return localStorage.getItem('pocket.'+k) }catch{ return null } },
  set(k,v){ try{ localStorage.setItem('pocket.'+k,v) }catch{} },
  del(k){ try{ localStorage.removeItem('pocket.'+k) }catch{} },
};
const S = {
  server: store.get('server') || '',
  token: store.get('token') || '',
  mode: store.get('mode') || 'token',       // 'session' (password, refreshable) | 'token' (API token)
  info: null, user: null,
  projects: [], projById: new Map(),
  labels: [], labelsLoaded: false,
  cache: new Map(),                          // task id -> task
};
const TZ = Intl.DateTimeFormat().resolvedOptions().timeZone;
const ZERO = '0001-01-01T00:00:00Z';
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon = (id, cls='i', style='') => `<svg class="${cls}"${style ? ` style="${style}"` : ''}><use href="#i-${id}"/></svg>`;

/* =============== API =============== */
class ApiError extends Error { constructor(status, msg, code){ super(msg); this.status=status; this.code=code; } }
class NetError extends Error {}

function normServer(u){
  u = (u||'').trim();
  if (u && !/^https?:\/\//i.test(u)) u = 'https://' + u;
  return u.replace(/\/+$/,'').replace(/\/api\/v1$/,'').replace(/\/+$/,'');
}

let refreshing = null;
async function refreshSession(){
  if (!refreshing) refreshing = (async () => {
    try {
      const r = await fetch(S.server + '/api/v1/user/token/refresh', {method:'POST', credentials:'include'});
      if (!r.ok) return false;
      const j = await r.json(); S.token = j.token; store.set('token', j.token); return true;
    } catch { return false } finally { setTimeout(() => refreshing = null, 0) }
  })();
  return refreshing;
}

async function api(path, {method='GET', body, raw=false, auth=true, retry=true} = {}){
  const headers = {};
  if (auth && S.token) headers.Authorization = 'Bearer ' + S.token;
  if (body !== undefined) headers['Content-Type'] = 'application/json';
  let res;
  try {
    res = await fetch(S.server + '/api/v1' + path, {
      method, headers, body: body === undefined ? undefined : JSON.stringify(body),
      credentials: S.mode === 'session' ? 'include' : 'omit',
    });
  } catch (e) { throw new NetError(e.message) }
  if (res.status === 401 && auth && retry && S.mode === 'session') {
    if (await refreshSession()) return api(path, {method, body, raw, auth, retry:false});
  }
  if (res.status === 401 && auth) { signOut('Your session ended. Sign in again.'); throw new ApiError(401, 'Signed out'); }
  if (!res.ok) {
    let j = {}; try { j = await res.json() } catch {}
    throw new ApiError(res.status, j.message || res.statusText || ('HTTP ' + res.status), j.code);
  }
  if (raw) return res;
  if (res.status === 204) return null;
  const t = await res.text(); return t ? JSON.parse(t) : null;
}

async function allPages(path){
  const out = [];
  for (let page = 1; page <= 40; page++) {
    const res = await api(path + (path.includes('?') ? '&' : '?') + 'page=' + page + '&per_page=50', {raw:true});
    const data = await res.json();
    if (Array.isArray(data)) out.push(...data);
    const total = parseInt(res.headers.get('x-pagination-total-pages') || '1', 10);
    if (!Array.isArray(data) || data.length === 0 || page >= total) break;
  }
  return out;
}

function netHelp(){
  const origin = location.origin === 'null' ? 'this page\'s address' : location.origin;
  return `Can't reach ${S.server || 'that address'}.\n\nIf Vikunja opens fine in your browser, it isn't allowing requests from ${esc(origin)}. Add it to <code>cors.origins</code> in Vikunja's config and restart the app.`;
}
function errText(e){
  if (e instanceof NetError) return netHelp();
  return esc(e.message || String(e));
}

/* =============== dates =============== */
const isSet = d => d && !String(d).startsWith('0001');
const startOfDay = (d=new Date()) => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const fmtTime = d => d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
function dueInfo(due){
  if (!isSet(due)) return null;
  const d = new Date(due), today = startOfDay(), dd = startOfDay(d);
  const diff = Math.round((dd - today) / 864e5);
  const hasTime = !(d.getHours() === 0 && d.getMinutes() === 0) && !(d.getHours() === 12 && d.getMinutes() === 0);
  let label;
  if (diff === 0) label = 'Today';
  else if (diff === 1) label = 'Tomorrow';
  else if (diff === -1) label = 'Yesterday';
  else if (diff < -1 && diff > -7) label = diff * -1 + ' days ago';
  else if (diff > 1 && diff < 7) label = d.toLocaleDateString([], {weekday:'long'});
  else label = d.toLocaleDateString([], {day:'numeric', month:'short', year: d.getFullYear() !== today.getFullYear() ? 'numeric' : undefined});
  if (hasTime && Math.abs(diff) < 7) label += ' ' + fmtTime(d);
  return {label, cls: diff < 0 ? 'overdue' : diff === 0 ? 'today' : '', diff};
}
const toLocalInput = iso => { if (!isSet(iso)) return ''; const d = new Date(iso); const p = n => String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; };
const fromLocalInput = v => v ? new Date(v).toISOString() : ZERO;

/* =============== HTML description helpers =============== */
const ALLOWED = new Set(['P','BR','B','STRONG','I','EM','U','S','DEL','UL','OL','LI','A','CODE','PRE','BLOCKQUOTE','H1','H2','H3','H4','H5','H6','SPAN','DIV','MARK','HR','TABLE','THEAD','TBODY','TR','TD','TH']);
function sanitize(html){
  const doc = new DOMParser().parseFromString('<div>' + (html || '') + '</div>', 'text/html');
  const root = doc.body.firstChild;
  (function walk(el){
    for (const n of [...el.childNodes]) {
      if (n.nodeType === 8) { n.remove(); continue; }
      if (n.nodeType !== 1) continue;
      if (!ALLOWED.has(n.tagName)) {
        if (['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','SVG','MATH','TEMPLATE','FORM'].includes(n.tagName)) { n.remove(); continue; }
        if (n.tagName === 'IMG') { n.replaceWith(doc.createTextNode('[image]')); continue; }
        if (n.tagName === 'INPUT' || n.tagName === 'LABEL') { n.remove(); continue; }
        const frag = doc.createDocumentFragment(); while (n.firstChild) frag.appendChild(n.firstChild);
        n.replaceWith(frag); walk(el); return;
      }
      for (const a of [...n.attributes]) {
        const keep = (n.tagName === 'A' && a.name === 'href' && /^(https?:|mailto:)/i.test(a.value.trim()))
          || (a.name === 'data-type' && a.value === 'taskList') || a.name === 'data-checked';
        if (!keep) n.removeAttribute(a.name);
      }
      if (n.tagName === 'A') { n.setAttribute('target','_blank'); n.setAttribute('rel','noopener noreferrer'); }
      walk(n);
    }
  })(root);
  return root.innerHTML;
}
function htmlToText(html){
  const doc = new DOMParser().parseFromString('<div>' + (html||'') + '</div>', 'text/html');
  const root = doc.body.firstChild; let out = '';
  (function walk(el, depth){
    for (const n of el.childNodes) {
      if (n.nodeType === 3) { out += n.nodeValue; continue; }
      if (n.nodeType !== 1) continue;
      const t = n.tagName;
      if (/^(SCRIPT|STYLE|TEMPLATE|IFRAME|OBJECT|SVG)$/.test(t)) continue;
      if (t === 'BR') { out += '\n'; continue; }
      if (t === 'LI') { out += '- ' + (n.getAttribute('data-checked') === 'true' ? '[x] ' : n.hasAttribute('data-checked') ? '[ ] ' : ''); walk(n, depth+1); out = out.replace(/\n*$/,'') + '\n'; continue; }
      walk(n, depth+1);
      if (/^(P|DIV|H[1-6]|BLOCKQUOTE|PRE|UL|OL|TR)$/.test(t)) out = out.replace(/\n*$/,'') + '\n\n';
    }
  })(root, 0);
  return out.replace(/ /g,' ').replace(/\n{3,}/g,'\n\n').trim();
}
const RICH = /<(ul|ol|a |table|pre|code|h[1-6]|blockquote|img|strong|em|b>|i>)/i;
function textToHtml(text){
  return text.trim().split(/\n{2,}/).map(p => '<p>' + esc(p).replace(/\n/g,'<br>') + '</p>').join('');
}

/* =============== toast =============== */
let toastTimer;
function toast(msg, action){
  const t = $('#toast'), b = $('#toast-act');
  $('#toast-msg').textContent = msg;
  b.hidden = !action;
  if (action) { b.textContent = action.label; b.onclick = () => { hideToast(); action.fn(); }; }
  t.classList.add('show'); clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, action ? 5000 : 2600);
}
function hideToast(){ $('#toast').classList.remove('show'); }

async function loadProjects(){
  const list = await allPages('/projects?is_archived=false');
  S.projects = list.filter(p => p.id > 0 && !p.is_archived).sort((a,b) => (a.position||0) - (b.position||0) || a.title.localeCompare(b.title));
  S.projById = new Map(S.projects.map(p => [p.id, p]));
}
async function loadLabels(force){
  if (S.labelsLoaded && !force) return S.labels;
  S.labels = await allPages('/labels'); S.labelsLoaded = true; return S.labels;
}
const remember = tasks => { for (const t of tasks) S.cache.set(t.id, t); return tasks; };
function defaultProjectId(){
  const route = currentRoute();
  if (route.name === 'project' && S.projById.has(route.id)) return route.id;
  const d = S.user?.settings?.default_project_id;
  if (d && S.projById.has(d)) return d;
  return S.projects[0]?.id;

const colorOf = hex => hex ? '#' + String(hex).replace('#','') : 'var(--muted)';

/* =============== routing =============== */
function currentRoute(){
  const h = location.hash.replace(/^#\/?/, '');
  const [path, q] = h.split('?');
  const parts = path.split('/').filter(Boolean);
  const params = new URLSearchParams(q || '');
  if (parts[0] === 'projects') return {name:'projects'};
  if (parts[0] === 'project' && parts[1]) return {name:'project', id: +parts[1], showDone: params.get('done') === '1'};
  if (parts[0] === 'add') return {name:'add', text: params.get('text') || params.get('title') || ''};
  return {name:'today'};
}
let renderSeq = 0;
async function render(){
  const r = currentRoute();
  if (r.name === 'add') {                         // deep link: #/add?text=Buy+milk+tomorrow
    history.replaceState(null, '', '#/today');
    await render();
    const inp = $('#in-capture'); inp.value = r.text; onCaptureInput(); inp.focus();
    return;
  }
  for (const a of document.querySelectorAll('nav.tabs a')) {
    const on = a.dataset.tab === r.name || (a.dataset.tab === 'projects' && r.name === 'project');
    if (on) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current');
  }
  $('#btn-back').hidden = r.name !== 'project';
  const seq = ++renderSeq;
  const view = $('#view');
  if (!view.children.length || view.dataset.route !== location.hash) view.innerHTML = '<div class="loading">Loading…</div>';
  view.dataset.route = location.hash;
  try {
    if (r.name === 'today') await renderToday(seq);
    else if (r.name === 'projects') await renderProjects(seq);
    else if (r.name === 'project') await renderProject(seq, r);
  } catch (e) {
    if (seq !== renderSeq) return;
    if (e instanceof ApiError && e.status === 401) return;
    view.innerHTML = `<div class="err" style="margin-top:16px">${errText(e)}</div><button class="btn ghost block" onclick="render()">Try again</button>`;
  }
  onCaptureInput();
}
window.addEventListener('hashchange', () => { if (!S.token) return; closeSheet(true); render(); });
$('#btn-back').onclick = () => { location.hash = '#/projects'; };
$('#btn-refresh').onclick = async () => { const b = $('#btn-refresh'); b.disabled = true; try { await loadProjects(); await render(); } catch(e){ toast(e.message) } finally { b.disabled = false; } };
document.addEventListener('visibilitychange', () => {

});

/* =============== task rows =============== */
function taskRow(t, {showProject=true} = {}){
  const due = dueInfo(t.due_date);
  const p = S.projById.get(t.project_id);
  const meta = [];
  if (due) meta.push(`<span class="due num ${due.cls}">${esc(due.label)}</span>`);
  if (showProject && p) meta.push(`<span><i class="dot" style="background:${colorOf(p.hex_color)}"></i>${esc(p.title)}</span>`);
  for (const l of (t.labels || []).slice(0,3)) meta.push(`<span><i class="dot" style="background:${colorOf(l.hex_color)}"></i>${esc(l.title)}</span>`);
  if (t.repeat_after || t.repeat_mode === 1) meta.push('<span aria-label="Repeats">↻</span>');
  const prio = t.priority >= 3 ? `<span class="prio" aria-label="Priority ${t.priority}">${'!'.repeat(Math.min(t.priority-1,3))}</span> ` : '';
  return `<div class="row${t.done ? ' done' : ''}" data-id="${t.id}">
    <button class="check p${t.priority||0}" data-act="toggle" aria-label="${t.done ? 'Mark not done' : 'Mark done'}: ${esc(t.title)}">${icon('check')}</button>
    <button class="body" data-act="open"><div class="title">${prio}${esc(t.title)}</div>${meta.length ? `<div class="meta">${meta.join('')}</div>` : ''}</button>
  </div>`;
}
document.addEventListener('click', e => {
  const btn = e.target.closest('[data-act]'); if (!btn) return;
  const row = btn.closest('[data-id]'); const id = row && +row.dataset.id;
  if (btn.dataset.act === 'toggle' && id) toggleDone(id, row);
  if (btn.dataset.act === 'open' && id) openTask(id);
  if (btn.dataset.act === 'project') location.hash = '#/project/' + btn.dataset.pid;
});

async function toggleDone(id, row){
  const t = S.cache.get(id); if (!t) return;
  const was = t.done;
  row?.classList.toggle('done', !was);
  try {
    const saved = await api('/tasks/' + id, {method:'POST', body: {...t, done: !was}});
    S.cache.set(id, saved);
    if (!was && !saved.done) {                  // repeating task rolled forward
      const d = dueInfo(saved.due_date);
      toast(d ? 'Repeats · next ' + d.label : 'Done — repeats');
      render(); return;
    }
    if (!was) toast('Done', {label:'Undo', fn: () => toggleDone(id, document.querySelector(`.row[data-id="${id}"]`))});
    setTimeout(() => { if (!document.body.classList.contains('sheet-open')) render(); }, was ? 0 : 900);
  } catch (e) {
    row?.classList.toggle('done', was);
    toast(e instanceof NetError ? 'Offline — not saved' : 'Not saved: ' + e.message);
  }
}

/* =============== views =============== */
async function renderToday(seq){
  const now = new Date();
  setHeader(now.toLocaleDateString([], {month:'long', day:'numeric'}), now.toLocaleDateString([], {weekday:'long'}));
  const end = addDays(startOfDay(), 8);
  const q = new URLSearchParams({filter: `done = false && due_date < '${end.toISOString()}'`, filter_timezone: TZ, sort_by: 'due_date', order_by: 'asc'});
  const tasks = remember(await allPages('/tasks?' + q));
  if (seq !== renderSeq) return;
  const t0 = startOfDay(), t1 = addDays(t0, 1);
  const groups = [['overdue','Overdue',[]],['today','Today',[]],['','Next 7 days',[]]];
  for (const t of tasks) {
    if (!isSet(t.due_date)) continue;
    const d = new Date(t.due_date);
    groups[d < t0 ? 0 : d < t1 ? 1 : 2][2].push(t);
  }
  groups[0][2].sort((a,b) => (b.priority||0) - (a.priority||0) || new Date(a.due_date) - new Date(b.due_date));
  const html = groups.filter(g => g[2].length).map(([cls,title,list]) =>
    `<div class="sec ${cls}">${title}<span class="n num">${list.length}</span></div><div class="list">${list.map(t => taskRow(t)).join('')}</div>`).join('');
  $('#view').innerHTML = html || `<div class="empty"><b>Nothing due this week.</b>Add a task below — try “Call Ana tomorrow !3”.</div>`;
}

function projectTree(){
  const kids = new Map();
  for (const p of S.projects) { const k = p.parent_project_id && S.projById.has(p.parent_project_id) ? p.parent_project_id : 0; if (!kids.has(k)) kids.set(k, []); kids.get(k).push(p); }
  const out = [];
  (function walk(pid, depth){ for (const p of kids.get(pid) || []) { out.push([p, depth]); walk(p.id, depth+1); } })(0, 0);
  return out;
}
async function renderProjects(seq){
  setHeader(S.user ? '@' + S.user.username : '', 'Projects');
  if (!S.projects.length) await loadProjects();
  if (seq !== renderSeq) return;
  const rows = projectTree();
  if (!rows.length) { $('#view').innerHTML = `<div class="empty"><b>No projects yet.</b>Create one in Vikunja on the web.</div>`; return; }
  const favs = S.projects.filter(p => p.is_favorite);
  const item = ([p, depth]) => `<div class="row"><button class="body" data-act="project" data-pid="${p.id}" style="padding-left:${depth*18}px"><i class="dot" style="background:${colorOf(p.hex_color)};width:10px;height:10px;margin:0"></i><span style="flex:1">${esc(p.title)}</span>${icon('chev','i chev')}</button></div>`;
  $('#view').innerHTML =
    (favs.length ? `<div class="sec">Favorites</div><div class="list tree">${favs.map(p => item([p,0])).join('')}</div>` : '') +
    `<div class="sec">All projects</div><div class="list tree">${rows.map(item).join('')}</div>`;
}
async function renderProject(seq, r){
  if (!S.projById.has(r.id)) await loadProjects();
  const p = S.projById.get(r.id);
  if (!p) { $('#view').innerHTML = '<div class="empty"><b>Project not found.</b>It may be archived or you lost access.</div>'; setHeader('', 'Project'); return; }
  const parent = S.projById.get(p.parent_project_id);
  setHeader(parent ? parent.title : 'Project', p.title);
  const q = new URLSearchParams({sort_by: 'due_date', order_by: 'asc', filter_include_nulls: 'true', filter_timezone: TZ});
  q.set('filter', r.showDone ? 'done = true' : 'done = false');
  const tasks = remember(await allPages(`/projects/${p.id}/tasks?` + q));
  if (seq !== renderSeq) return;
  // dated first (soonest first), then undated newest first
  const dated = tasks.filter(t => isSet(t.due_date)).sort((a,b) => new Date(a.due_date) - new Date(b.due_date));
  const undated = tasks.filter(t => !isSet(t.due_date)).sort((a,b) => (b.priority||0) - (a.priority||0) || b.id - a.id);
  const list = r.showDone ? tasks.sort((a,b) => new Date(b.done_at) - new Date(a.done_at)) : [...dated, ...undated];
  const toggle = `<a class="btn ghost toggle-done" href="#/project/${p.id}${r.showDone ? '' : '?done=1'}">${r.showDone ? 'Show open tasks' : 'Show done tasks'}</a>`;
  $('#view').innerHTML = (list.length
    ? `<div class="sec">${r.showDone ? 'Done' : 'Open'}<span class="n num">${list.length}</span></div><div class="list">${list.map(t => taskRow(t, {showProject:false})).join('')}</div>`
    : `<div class="empty"><b>${r.showDone ? 'Nothing done here yet.' : 'All clear.'}</b>${r.showDone ? '' : 'New tasks you add now land in this project.'}</div>`) + toggle;
}

/* =============== quick-add magic =============== */
const WEEKDAYS = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
function tokenRe(prefix){ return new RegExp(`(^|\\s)\\${prefix}(?:"([^"]+)"|'([^']+)'|(\\S+))`, 'g'); }
function parseCapture(text){
  const out = {title: text, project: null, projectMiss: null, labels: [], priority: 0, due: null, dueLabel: ''};
  // project +name
  out.title = out.title.replace(tokenRe('+'), (m, sp, a, b, c) => {
    const name = (a || b || c).replace(/[_-]/g, ' ').toLowerCase();
    const hit = S.projects.find(p => p.title.toLowerCase() === name) || S.projects.find(p => p.title.toLowerCase().startsWith(name));
    if (hit) out.project = hit; else out.projectMiss = a || b || c;
    return sp;
  });
  // labels *name
  out.title = out.title.replace(tokenRe('*'), (m, sp, a, b, c) => { out.labels.push(a || b || c); return sp; });
  // priority !1..!5
  out.title = out.title.replace(/(^|\s)!([1-5])(?=\s|$)/, (m, sp, n) => { out.priority = +n; return sp; });
  // dates
  let date = null, label = '';
  const take = (re, fn) => { if (date) return; const m = out.title.match(re); if (m) { const r = fn(m); if (r) { date = r[0]; label = r[1]; out.title = out.title.replace(m[0], m[1] || ''); } } };
  take(/(^|\s)(today)\b/i, () => [startOfDay(), 'Today']);
  take(/(^|\s)(tonight)\b/i, () => { const d = startOfDay(); d.setHours(21); return [d, 'Tonight']; });
  take(/(^|\s)(tomorrow)\b/i, () => [addDays(startOfDay(), 1), 'Tomorrow']);
  take(/(^|\s)(next week)\b/i, () => [addDays(startOfDay(), 7), 'Next week']);
  take(/(^|\s)in (\d{1,3}) (days?|weeks?)\b/i, m => { const n = +m[2] * (/^w/i.test(m[3]) ? 7 : 1); return [addDays(startOfDay(), n), `In ${n} day${n === 1 ? '' : 's'}`]; });
  take(new RegExp(`(^|\\s)(?:next |on )?(${WEEKDAYS.join('|')}|${WEEKDAYS.map(w => w.slice(0,3)).join('|')})\\b`, 'i'), m => {
    const want = WEEKDAYS.findIndex(w => w.startsWith(m[2].toLowerCase().slice(0,3)));
    let n = (want - new Date().getDay() + 7) % 7; if (n === 0) n = 7;
    const d = addDays(startOfDay(), n); return [d, d.toLocaleDateString([], {weekday:'long'})];
  });
  if (date) {
    const tm = out.title.match(/(^|\s)at (\d{1,2})(?::(\d{2}))?\s*(am|pm)?\b/i);
    if (tm) {
      let h = +tm[2]; const min = +(tm[3] || 0); const ap = (tm[4] || '').toLowerCase();
      if (ap === 'pm' && h < 12) h += 12; if (ap === 'am' && h === 12) h = 0;
      if (h < 24 && min < 60) { date.setHours(h, min, 0, 0); label += ' ' + fmtTime(date); out.title = out.title.replace(tm[0], tm[1]); }
    } else if (date.getHours() === 0) date.setHours(12, 0, 0, 0);
    out.due = date; out.dueLabel = label;
  }
  out.title = out.title.replace(/\s{2,}/g, ' ').trim();
  return out;
}
function onCaptureInput(){
  const v = $('#in-capture').value;
  const parsed = parseCapture(v);
  $('#f-capture .go').disabled = !parsed.title;
  const pid = parsed.project?.id || defaultProjectId();
  const p = S.projById.get(pid);
  const chips = [];
  if (v.trim()) {
    if (p) chips.push(`<span class="chip"><i class="dot" style="background:${colorOf(p.hex_color)}"></i>${esc(p.title)}</span>`);
    if (parsed.projectMiss) chips.push(`<span class="chip warn">No project “${esc(parsed.projectMiss)}”</span>`);
    if (parsed.due) chips.push(`<span class="chip num">${esc(parsed.dueLabel)}</span>`);
    if (parsed.priority) chips.push(`<span class="chip">Priority ${parsed.priority}</span>`);
    for (const l of parsed.labels) chips.push(`<span class="chip">*${esc(l)}</span>`);
  }
  $('#cap-chips').innerHTML = chips.join('');
  const pad = v.trim() && chips.length ? 36 : 0;
  document.documentElement.style.setProperty('--cap-h', (64 + pad) + 'px');
}
$('#in-capture').addEventListener('input', onCaptureInput);
$('#in-capture').addEventListener('focus', () => { if (!$('#in-capture').value) $('#cap-chips').innerHTML = '<span class="hint">+project  *label  !1–5  today · tomorrow · friday · in 3 days · at 5pm</span>'; });
$('#in-capture').addEventListener('blur', () => setTimeout(onCaptureInput, 150));

$('#f-capture').addEventListener('submit', async e => {
  e.preventDefault();
  const inp = $('#in-capture'); const raw = inp.value; const parsed = parseCapture(raw);
  if (!parsed.title) return;
  const pid = parsed.project?.id || defaultProjectId();
  if (!pid) { toast('Create a project in Vikunja first'); return; }
  const btn = $('#f-capture .go'); btn.disabled = true;
  inp.value = ''; onCaptureInput();
  try {
    const body = {title: parsed.title};
    if (parsed.due) body.due_date = parsed.due.toISOString();
    if (parsed.priority) body.priority = parsed.priority;
    const t = await api(`/projects/${pid}/tasks`, {method:'PUT', body});
    if (parsed.labels.length) {
      const all = await loadLabels();
      for (const name of parsed.labels) {
        let l = all.find(x => x.title.toLowerCase() === name.toLowerCase());
        if (!l) { l = await api('/labels', {method:'PUT', body:{title:name}}); all.push(l); }
        await api(`/tasks/${t.id}/labels`, {method:'PUT', body:{label_id:l.id}});
      }
    }
    const p = S.projById.get(pid);
    toast('Added to ' + (p ? p.title : 'project'), {label:'Open', fn: () => openTask(t.id)});
    render();
  } catch (err) {
    inp.value = raw; onCaptureInput();
    toast(err instanceof NetError ? 'Offline — task kept in the box' : 'Not added: ' + err.message);
  } finally { btn.disabled = !$('#in-capture').value.trim(); }
});

/* =============== sheet: task detail =============== */
let sheetTask = null, lastFocus = null;
function openSheet(){
  lastFocus = document.activeElement;
  const sh = $('#sheet'), sc = $('#scrim');
  sh.hidden = false; sc.hidden = false; document.body.classList.add('sheet-open');
  requestAnimationFrame(() => { sh.classList.add('show'); sc.classList.add('show'); });
}
function closeSheet(instant){
  const sh = $('#sheet'), sc = $('#scrim');
  if (sh.hidden) return;
  sh.classList.remove('show'); sc.classList.remove('show'); document.body.classList.remove('sheet-open');
  const done = () => { sh.hidden = true; sc.hidden = true; $('#sheet-body').innerHTML = ''; };
  if (instant) done(); else setTimeout(done, 260);
  const changed = sheetTask?._dirty; sheetTask = null;
  if (changed && !instant) render();
  lastFocus?.focus?.();
}
$('#btn-sheet-close').onclick = () => closeSheet();
$('#scrim').onclick = () => closeSheet();
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });
// swipe down to close
(() => { let y0 = null; const sh = $('#sheet');
  sh.addEventListener('touchstart', e => { const sc = $('#sheet .scroll'); y0 = (sc.scrollTop <= 0 || e.target.closest('.bar')) ? e.touches[0].clientY : null; }, {passive:true});
  sh.addEventListener('touchmove', e => { if (y0 === null) return; const dy = e.touches[0].clientY - y0; if (dy > 0) sh.style.transform = `translateY(${dy}px)`; }, {passive:true});
  sh.addEventListener('touchend', e => { if (y0 === null) return; const dy = e.changedTouches[0].clientY - y0; sh.style.transform = ''; y0 = null; if (dy > 110) closeSheet(); });
})();

async function openTask(id){
  openSheet();
  const body = $('#sheet-body');
  const cached = S.cache.get(id);
  body.innerHTML = cached ? '' : '<div class="loading">Loading…</div>';
  if (cached) { sheetTask = {...cached}; drawTask(); }
  try {
    const t = await api('/tasks/' + id);
    if ($('#sheet').hidden) return;
    S.cache.set(id, t); sheetTask = {...t, _dirty: sheetTask?._dirty}; drawTask();
    loadComments(id);
  } catch (e) { if (!cached) body.innerHTML = `<div class="err">${errText(e)}</div>`; }
}

const PRIOS = [[0,'None'],[1,'Low'],[2,'Med'],[3,'High'],[4,'Urgent'],[5,'Now']];
function drawTask(){
  const t = sheetTask; if (!t) return;
  const body = $('#sheet-body');
  const projOpts = projectTree().map(([p, d]) => `<option value="${p.id}"${p.id === t.project_id ? ' selected' : ''}>${' '.repeat(d)}${esc(p.title)}</option>`).join('');
  const labels = (t.labels || []).map(l => `<span class="label-chip"><i class="dot" style="background:${colorOf(l.hex_color)};margin:0"></i>${esc(l.title)}<button class="x" data-rm-label="${l.id}" aria-label="Remove label ${esc(l.title)}">${icon('close','i','width:14px;height:14px')}</button></span>`).join('');
  const desc = t.description && t.description.replace(/<p>\s*<\/p>/g,'').trim();
  const atts = t.attachments || [];
  body.innerHTML = `
    <div class="d-title">
      <button class="check p${t.priority||0}${t.done ? ' on' : ''}" id="d-done" aria-label="${t.done ? 'Mark not done' : 'Mark done'}">${icon('check')}</button>
      <textarea id="d-title" rows="1" aria-label="Title" enterkeyhint="done">${esc(t.title)}</textarea>
    </div>
    <div class="saved" id="d-saved"></div>
    <div class="card">
      <div class="prop"><span class="k">Due</span><span class="v">
        <input type="datetime-local" id="d-due" value="${toLocalInput(t.due_date)}" aria-label="Due date">
        ${isSet(t.due_date) ? `<button class="icon-btn plain" id="d-due-clear" aria-label="Clear due date">${icon('close')}</button>` : ''}
      </span></div>
      <div class="prop"><span class="k">Project</span><span class="v"><select id="d-proj" aria-label="Project">${projOpts}</select></span></div>
      <div class="prop stack"><span class="k">Priority</span><span class="v"><div class="prios" role="group" aria-label="Priority">${PRIOS.map(([n,l]) => `<button type="button" data-prio="${n}" class="${n>=3?'hot':''}" aria-pressed="${(t.priority||0) === n}">${l}</button>`).join('')}</div></span></div>
      <div class="prop"><span class="k">Labels</span><span class="v">${labels}<button class="add-label" id="d-add-label">Add</button></span></div>
      ${t.identifier ? `<div class="prop"><span class="k">ID</span><span class="v num" style="color:var(--muted)">${esc(t.identifier)}</span></div>` : ''}
    </div>
    <div id="d-label-picker"></div>

    <div class="h3">Notes</div>
    <div class="card" id="d-desc-card">
      <div class="desc" id="d-desc" role="button" tabindex="0" aria-label="Edit notes">${desc ? sanitize(desc) : '<span class="ph">Add notes</span>'}</div>
    </div>

    ${atts.length ? `<div class="h3">Attachments<span class="n num">${atts.length}</span></div><div class="card">${atts.map(a => `<button class="att" data-att="${a.id}">${icon('clip')}<span class="nm">${esc(a.file?.name || 'file')}</span><span class="sz num">${fmtSize(a.file?.size)}</span></button>`).join('')}</div>` : ''}

    <div class="h3">Comments<span class="n num" id="d-ccount"></span></div>
    <div class="card" id="d-comments"><div class="loading" style="padding:16px">Loading…</div></div>

    <div class="danger-zone"><button class="btn danger block" id="d-delete">Delete task</button></div>
  `;
  const ta = $('#d-title'); const grow = () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }; grow();
  ta.addEventListener('input', grow);
  ta.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); ta.blur(); } });
  ta.addEventListener('change', () => { const v = ta.value.trim(); if (v && v !== t.title) save({title: v}); else ta.value = t.title; });
  $('#d-done').onclick = async () => { await save({done: !t.done}); };
  $('#d-due').addEventListener('change', e => save({due_date: fromLocalInput(e.target.value)}));
  $('#d-due-clear')?.addEventListener('click', () => save({due_date: ZERO}));
  $('#d-proj').addEventListener('change', e => save({project_id: +e.target.value}));
  for (const b of body.querySelectorAll('[data-prio]')) b.onclick = () => save({priority: +b.dataset.prio});
  for (const b of body.querySelectorAll('[data-rm-label]')) b.onclick = () => removeLabel(+b.dataset.rmLabel);
  $('#d-add-label').onclick = showLabelPicker;
  const d = $('#d-desc'); d.onclick = e => { if (e.target.closest('a')) return; editDesc(); }; d.onkeydown = e => { if (e.key === 'Enter') editDesc(); };
  for (const b of body.querySelectorAll('[data-att]')) b.onclick = () => openAttachment(+b.dataset.att);
  $('#d-delete').onclick = deleteTask;
  drawComments(t.id);
}
const fmtSize = n => !n ? '' : n < 1024 ? n + ' B' : n < 1048576 ? (n/1024).toFixed(0) + ' KB' : (n/1048576).toFixed(1) + ' MB';

let saveChain = Promise.resolve();
function save(patch){
  const id = sheetTask?.id; if (!id) return;
  const flash = $('#d-saved'); if (flash) flash.textContent = 'Saving…';
  saveChain = saveChain.then(async () => {
    const base = S.cache.get(id) || sheetTask;
    try {
      const saved = await api('/tasks/' + id, {method:'POST', body: {...base, ...patch}});
      S.cache.set(id, saved);
      if (sheetTask?.id === id) {
        const repeated = patch.done === true && !saved.done;
        sheetTask = {...saved, _dirty: true}; drawTask();
        const f = $('#d-saved'); if (f) f.textContent = repeated ? 'Repeats — moved to next date' : 'Saved';
        setTimeout(() => { const f2 = $('#d-saved'); if (f2 && f2.textContent === 'Saved') f2.textContent = ''; }, 1500);
      }
    } catch (e) {
      const f = $('#d-saved'); if (f) f.textContent = '';
      toast(e instanceof NetError ? 'Offline — not saved' : 'Not saved: ' + e.message);
      if (sheetTask?.id === id) drawTask();
    }
  });
  return saveChain;
}

function editDesc(){
  const t = sheetTask; const card = $('#d-desc-card');
  const rich = RICH.test(t.description || '');
  card.innerHTML = `<div class="desc-edit"><textarea id="d-desc-in" aria-label="Notes">${esc(htmlToText(t.description))}</textarea>
    ${rich ? '<p class="note" style="margin:6px 2px">These notes have formatting. Saving here keeps the text but drops links and lists.</p>' : ''}
    <div class="row-actions"><button class="btn ghost" id="d-desc-cancel">Cancel</button><button class="btn" id="d-desc-save">Save notes</button></div></div>`;
  const inp = $('#d-desc-in'); inp.focus();
  $('#d-desc-cancel').onclick = drawTask;
  $('#d-desc-save').onclick = () => save({description: inp.value.trim() ? textToHtml(inp.value) : ''});
}

async function showLabelPicker(){
  const box = $('#d-label-picker');
  if (box.innerHTML) { box.innerHTML = ''; return; }
  box.innerHTML = '<div class="card"><div class="loading" style="padding:16px">Loading labels…</div></div>';
  let all; try { all = await loadLabels(); } catch (e) { box.innerHTML = `<div class="err">${errText(e)}</div>`; return; }
  const have = new Set((sheetTask.labels || []).map(l => l.id));
  const draw = (q='') => {
    const ql = q.trim().toLowerCase();
    const list = all.filter(l => !have.has(l.id) && (!ql || l.title.toLowerCase().includes(ql))).slice(0, 30);
    const exact = all.some(l => l.title.toLowerCase() === ql);
    $('#lp-list').innerHTML = list.map(l => `<button data-pick="${l.id}"><i class="dot" style="background:${colorOf(l.hex_color)};margin:0"></i>${esc(l.title)}</button>`).join('')
      + (ql && !exact ? `<button data-new="1">Create “${esc(q.trim())}”</button>` : '')
      + (!list.length && !ql ? '<p class="note" style="padding:0 14px 10px">No other labels. Type to create one.</p>' : '');
  };
  box.innerHTML = `<div class="card picker"><input id="lp-q" placeholder="Find or create a label" aria-label="Label"><div id="lp-list"></div></div>`;
  draw();
  const q = $('#lp-q'); q.focus(); q.oninput = () => draw(q.value);
  $('#lp-list').onclick = async e => {
    const b = e.target.closest('button'); if (!b) return;
    try {
      let l;
      if (b.dataset.new) { l = await api('/labels', {method:'PUT', body:{title: q.value.trim()}}); all.push(l); }
      else l = all.find(x => x.id === +b.dataset.pick);
      await api(`/tasks/${sheetTask.id}/labels`, {method:'PUT', body:{label_id: l.id}});
      sheetTask.labels = [...(sheetTask.labels || []), l]; sheetTask._dirty = true;
      const c = S.cache.get(sheetTask.id); if (c) c.labels = sheetTask.labels;
      drawTask();
    } catch (err) { toast('Label not added: ' + err.message); }
  };
}
async function removeLabel(lid){
  try {
    await api(`/tasks/${sheetTask.id}/labels/${lid}`, {method:'DELETE'});
    sheetTask.labels = (sheetTask.labels || []).filter(l => l.id !== lid); sheetTask._dirty = true;
    const c = S.cache.get(sheetTask.id); if (c) c.labels = sheetTask.labels;
    drawTask();
  } catch (e) { toast('Label not removed: ' + e.message); }
}

const commentCache = new Map();
async function loadComments(id){
  const box = $('#d-comments'); if (!box) return;
  if (S.info && S.info.task_comments_enabled === false) { box.innerHTML = '<p class="note" style="padding:12px 14px;margin:0">Comments are turned off on this server.</p>'; return; }
  let list;
  try { list = await api(`/tasks/${id}/comments`) || []; } catch (e) { box.innerHTML = `<p class="note" style="padding:12px 14px;margin:0">${errText(e)}</p>`; return; }
  commentCache.set(id, list);
  drawComments(id);
}
function drawComments(id){
  const list = commentCache.get(id);
  if (!list || sheetTask?.id !== id || !$('#d-comments')) return;
  const draft = $('#d-cin')?.value || '';
  $('#d-ccount').textContent = list.length || '';
  $('#d-comments').innerHTML = list.map(c => `<div class="comment"><div class="who"><b>${esc(c.author?.name || c.author?.username || 'Someone')}</b> · <span class="num">${new Date(c.created).toLocaleString([], {dateStyle:'medium', timeStyle:'short'})}</span></div><div class="desc" style="padding:0">${sanitize(c.comment)}</div></div>`).join('')
    + `<form class="comment-form" id="d-cform"><textarea id="d-cin" rows="1" placeholder="Write a comment" aria-label="Comment"></textarea><button class="go btn" style="width:44px;padding:0" aria-label="Post comment">${icon('send')}</button></form>`;
  $('#d-cform').onsubmit = async e => {
    e.preventDefault(); const v = $('#d-cin').value.trim(); if (!v) return;
    const b = e.target.querySelector('button'); b.disabled = true;
    try { await api(`/tasks/${id}/comments`, {method:'PUT', body:{comment: textToHtml(v)}}); $('#d-cin').value = ''; await loadComments(id); }
    catch (err) { toast('Comment not posted: ' + err.message); b.disabled = false; }
  };
  if (draft) $('#d-cin').value = draft;
}

async function openAttachment(aid){
  const w = window.open('', '_blank');           // open synchronously so iOS doesn't block it
  try {
    const res = await api(`/tasks/${sheetTask.id}/attachments/${aid}`, {raw:true});
    const url = URL.createObjectURL(await res.blob());
    if (w) w.location = url; else location.href = url;
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (e) { w?.close(); toast('Couldn\'t open: ' + e.message); }
}

async function deleteTask(){
  const t = sheetTask;
  if (!confirm(`Delete “${t.title}”? This can't be undone here.`)) return;
  try { await api('/tasks/' + t.id, {method:'DELETE'}); S.cache.delete(t.id); sheetTask._dirty = true; closeSheet(); toast('Deleted'); }
  catch (e) { toast('Not deleted: ' + e.message); }
}

/* =============== account sheet =============== */
$('#btn-account').onclick = () => {
  openSheet(); sheetTask = null;
  const u = S.user || {};
  $('#sheet-body').innerHTML = `
    <div class="d-title"><h2 style="margin:0;font-size:24px">${esc(u.name || u.username || 'Account')}</h2></div>
    <div class="card">
      <div class="prop"><span class="k">User</span><span class="v">@${esc(u.username || '')}</span></div>
      <div class="prop"><span class="k">Server</span><span class="v" style="overflow-wrap:anywhere">${esc(S.server)}</span></div>
      <div class="prop"><span class="k">Version</span><span class="v num">${esc(S.info?.version || '')}</span></div>
      <div class="prop"><span class="k">Signed in</span><span class="v">${S.mode === 'session' ? 'With password' : 'With API token'}</span></div>
    </div>
    <div class="h3">Quick add from anywhere</div>
    <div class="card"><div class="desc" style="font-size:15px">Open <code style="overflow-wrap:anywhere">${esc(location.origin + location.pathname)}#/add?text=…</code> to start a task with text filled in — handy from an iOS Shortcut or a bookmark.</div></div>
    <a class="btn ghost block" href="${esc(S.server)}" target="_blank" rel="noopener" style="text-decoration:none;margin-top:6px">Open Vikunja on the web</a>
    <div class="danger-zone"><button class="btn danger block" id="btn-signout">Sign out</button></div>`;
  $('#btn-signout').onclick = () => signOut();
};

/* =============== boot =============== */
async function boot(){
  $('#login').hidden = true; $('#app').hidden = false;
  $('#view').innerHTML = '<div class="loading">Loading…</div>';
  try {
    const [user, info] = await Promise.all([api('/user'), S.info ? Promise.resolve(S.info) : api('/info', {auth:false}).catch(() => null)]);
    S.user = user; S.info = info;
    await loadProjects();
    render();
  } catch (e) {
    if (e instanceof ApiError && e.status === 401) return;
    $('#view').innerHTML = `<div class="err" style="margin-top:16px">${errText(e)}</div><button class="btn ghost block" onclick="boot()">Try again</button><button class="btn danger block" style="margin-top:8px" onclick="signOut()">Sign out</button>`;
  }
}

(function init(){
  const qs = new URLSearchParams(location.search);
  const qServer = qs.get('server');
  if (qServer && !S.token) S.server = normServer(qServer);
  if (S.server && S.token) boot();
  else {
    showLogin('');
    if (S.server) { $('#in-server').value = S.server; }
  }
})();
</script>
