<!-- The add box at the foot of a list: a sheet's subtasks, a template's steps, New template's steps
     (sheet/sub-list.html), and a checklist's steps on its screen (screens/run.html). `where` says which ('sheet' or
     'run', from the x-data around it), and footBox(where) describes the box there (app/sheet.js): its name as box() has
     it, its placeholder text, whether it is under a row, and what it can add.

     It is quick add's box. What it read is marked, with chips to undo each mark, and @ and * suggest people and labels.
     Each line adds a subtask or a step, on Enter or the button. A nudge on a row moves the box under that row
     (seatFoot), to add after it, and a dashed placeholder keeps its place at the foot. Tapping the placeholder brings
     the box back. Nudging the last row changes nothing: the box is under it already.

     On a checklist the box also has Repeat, shown as its symbol alone. Repeat adds a fresh copy of the step on the
     card, right after that step, wherever the box is (repeatCard, app/runs.js). -->
<template x-for="fb in [footBox(where)].filter(Boolean)" :key="fb.w"><div class="addbox sub foot-box" :id="fb.id">
  <!-- On a checklist, the message for what the box just did ("Repeated", with Undo) is shown in the box, so it is
       wherever the box is -->
  <template x-for="line in where === 'run' ? placeLines('cap') : []" :key="line.n">
    <!-- include markup/place-line.html -->
  </template>
  <form autocomplete="off" @submit.prevent="boxSend(fb.w)">
    <div class="cap-field">
      <div class="cap-marks" aria-hidden="true" x-html="marksHtml(fb.w)"></div>
      <textarea :id="fb.in" x-model="box(fb.w).text" x-box.lines="fb.w" rows="1" :placeholder="fb.says" :aria-label="fb.add" enterkeyhint="send"></textarea>
    </div>
    <template x-for="rep in fb.repeat ? [fb.repeat] : []" :key="0"><button type="button" class="rep" id="btn-repeat" :disabled="!rep.can" :aria-label="'Repeat “' + rep.title + '”'"
      :title="rep.can ? 'Add a fresh copy of “' + rep.title + '” right after it' : 'Repeat is available once the step is sent'"
      @mousedown.prevent @click="repeatCard()"><svg class="i"><use href="#i-repeat"/></svg></button></template>
    <button class="go" type="submit" :aria-label="fb.add" @mousedown.prevent :disabled="!fb.can"><svg class="i"><use href="#i-up"/></svg></button>
  </form>
  <!-- For a template's step: when it is due, read from its words, and a picker for the step it counts from
       (step-time.html) -->
  <template x-for="st in fb.steps ? [box(fb.w)] : []" :key="0"><div class="sub-box-time">
    <template x-for="d in draftShown(draft(stepWhich).info.get('+'))" :key="0">
      <!-- include markup/sheet/step-time.html -->
    </template>
  </div></template>
  <template x-for="bw in [fb.w]" :key="bw"><div class="chips" :id="fb.id + '-chips'" :hidden="!chips(bw).length && !(box(bw).focus && !box(bw).text)">
    <template x-if="box(bw).focus && !box(bw).text"><span class="hint" x-text="boxHint(bw)"></span></template>
    <!-- include markup/chips.html -->
  </div></template>
</div></template>
<!-- The dashed placeholder at the foot while the box is under a row. It shows the box's placeholder text, and tapping
     it brings the box back. -->
<template x-for="fb in [footBox(where)].filter(b => b?.under)" :key="0"><button type="button" class="sub-home" :id="fb.id + '-place'" :aria-label="fb.home" @click="footHome(where)"><span x-text="fb.rest"></span></button></template>
