<!-- One item in a list with cards (screens/lists.html: Today, search's open tasks, a project's open list), task `t` in
     the list `g`. A task with no open subtasks is a row (task-row.html). A task with open subtasks or steps is a
     stacked card (cardOf, app/cards.js): a group named by the parent's title, with the parent's ring and title as its
     header and its open subtasks as rows under it, each acting as any row does (c.g). A swipe right on the header
     springs back, as a parent has no progress of its own, unless it goes all the way, which does what the ring's tap
     does. A swipe left shows Delete (headGesture). On a project's list, holding the card moves it as a row moves, and
     it lights up while the add box adds subtasks to it (lit, quickadd.js). A screen reader hears the count, the
     progress and the project after the title (cardHead, worked out once per card).

     Collapsed, the card shows its top row only, with a slim tab (⌄, "More") that opens it in place. Open, it shows
     every open subtask, with ⌃ ("Show less") to collapse it; scrolling it off the screen collapses it too (watchCard).
     With one open subtask, and on a project's list, there is no footer. When every subtask is done (c.closes) the rows
     give way to "All subtasks done" and Close, since nothing closes behind your back. Done from its ring or Close, the
     card stays until the batch clears, its title struck through and its ring the undo. Deleted, it is a gap with
     Restore (gap.html), and a message about the task shows in its place, as a row's does. -->
<div class="item" :data-id="t.id">
  <template x-if="!cardOf(t, g)">
    <!-- include markup/task-row.html -->
  </template>
  <template x-for="[c, h] in [cardOf(t, g)].filter(Boolean).map(c => [c, cardHead(t, g)])" :key="0">
    <div class="day-card" role="group" :aria-label="h.title" :data-id="t.id" :data-gestures="rowGestures(g)"
         :class="{open: c.open, done: t.done, aimed: lit[t.id] && capW === 'under', leaving: !!leaving[t.id], deleted: leaving[t.id] === 'deleted', lined: !!lines[t.id], fresh: flashed.fresh[t.id], 'came-due': flashed.due[t.id], arrived: flashed.arrived[t.id]}"
         x-effect="c.open && c.folds && watchCard($el); lit[t.id] && watchCursor($el)"
         @click.capture="tapGap(t, g, $event)">
      <div class="card-head">
        <template x-for="r in [c.ring].filter(Boolean)" :key="0">
          <!-- include markup/ring.html -->
        </template>
        <button class="card-open" @click="openRow(t)"><span class="card-title" x-text="h.title"></span><span class="sr" x-text="h.said ? ', ' + h.said : ''"></span><template x-if="h.prio"><span class="bars" :class="'p' + h.prio" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span></template><template x-if="h.due"><span class="due num" :class="h.due.cls" aria-hidden="true" x-text="h.due.text"></span></template><template x-if="h.color"><i class="dot" aria-hidden="true" x-style="{background: h.color}"></i></template></button>
      </div>
      <!-- Every subtask done: the card waits for Close, which does what the ring's tap does. Nothing closes behind your
           back. -->
      <template x-if="c.closes"><div class="card-close"><span x-text="c.run ? 'All steps done' : 'All subtasks done'"></span><button type="button" class="close-btn" x-show="!t.done" :disabled="!canWrite(t.project_id)" :aria-label="c.ring?.label" @click="ringTap(t, $el.closest('.day-card'))">Close</button></div></template>
      <div class="card-rows">
        <template x-for="[t, g] in c.rows.map(s => [s, c.g])" :key="t.id">
          <!-- include markup/task-row.html -->
        </template>
      </div>
      <!-- The footer. Collapsed, a slim tab hangs under the last row, like the edge of a card stacked behind it, with ⌄
           in it ("More" to a screen reader), and a tap opens the card in place. Open, a plain ⌃ ("Show less") sits
           under the card. Either way the tap target is the card's width and 48px tall. It has no words, title or count:
           the ring says those. -->
      <template x-if="c.peek"><button type="button" class="card-more" aria-expanded="false" aria-label="More" @click="openCard(c)">
        <i class="tab" aria-hidden="true"><svg class="i"><use href="#i-chev"/></svg></i></button></template>
      <template x-if="c.open && c.folds"><button type="button" class="card-more" aria-expanded="true" aria-label="Show less" @click="foldCard(c.id)">
        <i class="tab" aria-hidden="true"><svg class="i"><use href="#i-chev"/></svg></i></button></template>
      <template x-for="line in lines[t.id] ? [lines[t.id]] : []" :key="0">
        <!-- include markup/row-line.html -->
      </template>
      <!-- include markup/gap.html -->
    </div>
  </template>
</div>
