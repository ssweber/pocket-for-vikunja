<!-- With no project for checklists yet: what they are, and Set up checklists, which makes a project called Checklists
     with an example template to try (setUpChecklists, app/checklists.js); what went wrong is said under the button.
     Under the projects (screens/lists.html), and on Checklists while it's empty (screens/checklists.html). -->
<div class="card cl-card setup-card" id="setup-checklists">
  <p><b>Checklists</b> are step-by-step lists people work through again and again, like opening up or a weekly clean: each one started is ticked off step by step, with who did what.</p>
  <button class="btn block" id="btn-setup-checklists" :disabled="settingUp" @click="setUpChecklists()" x-text="settingUp ? 'Setting up…' : 'Set up checklists'"></button>
  <template x-for="line in placeLines('setup')" :key="line.n">
    <!-- include markup/place-line.html -->
  </template>
  <p class="note" style="margin:8px 0 0">Makes a project called Checklists, with an example template to try. Or use a project of yours: its ⋯ has Use for checklists.</p>
</div>
