    <!-- The question before a parent's open subtasks are completed with it, asked when its ring is tapped or its header
         swiped right all the way (askComplete, app/cards.js). Bulk actions confirm. The subtasks are named in a
         sentence (completeAsk, messages.js), not listed as rows, which looked like boxes to pick from. For a checklist
         the question is whether to finish it: steps not done stay not done, since steps are ticked on the checklist's
         screen with who did each, or the checklist can be opened to work through them (not offered when asked from its
         own screen). Cancel goes back to where the question came from: the parent's sheet, the list or the checklist's
         screen. -->
    <template x-if="sheet.kind === 'complete' && sheet.complete"><div id="complete">
      <div class="d-title"><h2 x-text="sheet.complete.ask.head"></h2></div>
      <p class="note complete-note" id="complete-note" x-text="sheet.complete.ask.body"></p>
      <button class="btn block" id="complete-yes" @click="confirmComplete()" x-text="sheet.complete.ask.yes"></button>
      <template x-if="sheet.complete.run && !sheet.complete.screen"><button class="btn ghost block" id="complete-open-run" style="margin-top:10px" @click="openRun(sheet.complete.id)">Open the checklist</button></template>
      <button class="btn ghost block" id="complete-no" style="margin-top:10px" @click="cancelComplete()">Cancel</button>
    </div></template>
