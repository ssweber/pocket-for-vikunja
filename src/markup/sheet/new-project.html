    <!-- A new project. The user sets its name, its parent and whether it is for checklists. -->
    <template x-if="sheet.kind === 'newproj' && sheet.newProj"><div id="new-project">
      <div class="d-title"><h2>New project</h2></div>
      <label class="field" style="margin-top:12px"><span>Name</span><input id="np-name" x-model="sheet.newProj.name" autocomplete="off" enterkeyhint="done" @keydown.enter.prevent="makeProject()"></label>
      <template x-if="projects.length"><label class="field"><span>Parent project</span><select id="np-parent" x-model="sheet.newProj.parent">
        <option value="">None</option>
        <template x-for="r in tree" :key="r.p.id"><option :value="r.p.id" x-text="'\u00a0\u00a0\u00a0'.repeat(r.depth) + r.p.title"></option></template>
      </select></label></template>
      <div class="card switches"><label class="prop"><span class="v"><b>Use for checklists</b>
        <span class="note">Everyone the project is shared with sees its templates and checklists on the Checklists tab.</span></span>
        <input type="checkbox" class="switch" id="np-checklists" x-model="sheet.newProj.checklists"></label></div>
      <button class="btn block" id="np-create" style="margin-top:16px" :disabled="sheet.newProj.busy || !sheet.newProj.name.trim()" @click="makeProject()"
              x-text="sheet.newProj.busy ? 'Creating the project…' : 'Create project'"></button>
    </div></template>
