    <!-- A new project: its name, where it goes, and whether it's for checklists -->
    <template x-if="sheet.kind === 'newproj' && sheet.newProj"><div id="new-project">
      <div class="d-title"><h2>New project</h2></div>
      <label class="field" style="margin-top:12px"><span>Name</span><input id="np-name" x-model="sheet.newProj.name" autocomplete="off" enterkeyhint="done" @keydown.enter.prevent="makeProject()"></label>
      <template x-if="projects.length"><label class="field"><span>Inside</span><select id="np-parent" x-model="sheet.newProj.parent">
        <option value="">No other project</option>
        <template x-for="r in tree" :key="r.p.id"><option :value="r.p.id" x-text="'\u00a0\u00a0\u00a0'.repeat(r.depth) + r.p.title"></option></template>
      </select></label></template>
      <div class="card"><label class="prop" style="cursor:pointer"><span class="v" style="display:block"><b style="font-weight:600">Use for checklists</b>
        <span class="note" style="display:block;margin:2px 0 0">Its templates and runs show under a Checklists tab, for everyone it's shared with.</span></span>
        <input type="checkbox" id="np-checklists" x-model="sheet.newProj.checklists" style="width:22px;height:22px;accent-color:var(--accent)"></label></div>
      <button class="btn block" id="np-create" style="margin-top:16px" :disabled="sheet.newProj.busy || !sheet.newProj.name.trim()" @click="makeProject()"
              x-text="sheet.newProj.busy ? 'Making the project…' : 'Make project'"></button>
    </div></template>
