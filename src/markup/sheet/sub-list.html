<!-- A sheet's list and the add box at its foot: a task's subtasks, a template's steps, or the steps written so far in
     New template, which stay on the phone until Create template sends them. One piece for all three, so they can't
     drift apart. `subList` is its rows, `isStepList` whether they are steps, `subBoxW` its box.

     Each row is the shared task row as a sheet has it (g.sheet). A sheet is for managing, like a project's list, so a
     row can be swiped left to delete and held to move, whatever screen the sheet is over. A step (g.step) is the same
     row with its number where a task has its tick, its due time in a checklist and the first line of its notes under
     it. Tapping a step puts quick add's box in its place (step-edit.html).

     The box is quick add's (list-box.html). A nudge on a row moves the box under that row (nudgedSub, app/sheet.js). -->
<div class="h3"><span x-text="isStepList ? 'Steps' : 'Subtasks'"></span><span class="n num" id="d-subcount" x-text="isStepList ? subList.length || '' : subList.length ? subList.filter(s => s.done).length + '/' + subList.length : ''"></span></div>
<div class="card" id="d-subtasks" x-data="{where: 'sheet'}">
  <template x-for="g in [{depth: {}, sheet: true, delete: true, reorder: true, step: isStepList}]" :key="0"><template x-for="t in subList" :key="t.id">
    <!-- include markup/task-row.html step -->
  </template></template>
  <!-- Subtasks still waiting to be sent. One whose line was marked done is shown ticked. -->
  <template x-for="t in pendingSubtasks" :key="t.id"><div class="row pending" :class="{waits: t.waits, done: t.done}" :data-id="t.id">
    <button class="check" :class="{wait: t.waits}" disabled :aria-label="'Not sent yet: ' + t.title"><svg class="i"><use href="#i-check"/></svg></button>
    <div class="body"><div class="title"><span class="sr">Not sent yet: </span><span x-text="t.title"></span></div><div class="meta"><span x-text="offline ? 'Waiting for a connection' : 'Sending…'"></span></div></div>
    <button class="icon-btn plain" :aria-label="cancelLabel(t)" @click="cancelPending(t.entry, t.index)"><svg class="i"><use href="#i-close"/></svg></button>
  </div></template>
  <template x-for="line in placeLines('sheet:subtasks')" :key="line.n">
    <!-- include markup/place-line.html -->
  </template>
  <!-- Steps are added to a checklist on its screen, where they are marked as added to this checklist alone -->
  <template x-if="checklistRole === 'run' && canEdit"><p class="note" id="d-run-steps-note" style="padding:12px 14px;margin:0">Open the checklist. Add a step in the box under its steps. New steps are added to this checklist only.</p></template>
  <!-- include markup/list-box.html -->
</div>
