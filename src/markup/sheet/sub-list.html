<!-- A sheet's list with an add box at the bottom. It lists a task's subtasks, a template's steps, or the steps typed
     so far in New template, which stay on the phone until Create template sends them. One piece serves all three, so
     they can't drift apart. `subList` is the rows, `isStepList` says whether they are steps, and `subBoxW` is the
     box's name.

     Each row is the shared task row as a sheet has it (g.sheet). A sheet is for managing, like a project's list, so
     a row can be swiped left to delete and held to reorder, whatever screen the sheet is over. A step (g.step) is the
     same row with its number where a task has its tick, and under its title its due time in a checklist and the first
     line of its notes. Tapping a step replaces its row with a quick-add box (step-edit.html).

     The box is the quick-add box (list-box.html). Nudging a row moves the box under that row (nudgedSub,
     app/sheet.js). -->
<div class="h3"><span x-text="isStepList ? 'Steps' : 'Subtasks'"></span><span class="n num" id="d-subcount" x-text="isStepList ? subList.length || '' : subList.length ? subList.filter(s => s.done).length + '/' + subList.length : ''"></span></div>
<div class="card" id="d-subtasks" x-data="{where: 'sheet'}">
  <template x-for="g in [{depth: {}, sheet: true, delete: true, reorder: true, step: isStepList}]" :key="0"><template x-for="t in subList" :key="t.id">
    <!-- include markup/task-row.html sheet step -->
  </template></template>
  <!-- Subtasks still waiting to be sent. A subtask whose typed line was marked done is shown ticked. -->
  <template x-for="t in pendingSubtasks" :key="t.id"><div class="row pending" :class="{waits: t.waits, done: t.done}" :data-id="t.id">
    <button class="check" :class="{wait: t.waits}" disabled :aria-label="'Not sent yet: ' + t.title"><svg class="i"><use href="#i-check"/></svg></button>
    <div class="body"><div class="title"><span class="sr">Not sent yet: </span><span x-text="t.title"></span></div><div class="meta" x-show="waitNote(t.entry)"><span x-text="waitNote(t.entry)"></span></div></div>
    <template x-if="!t.sent"><button class="icon-btn plain" :aria-label="cancelLabel(t)" @click="cancelPending(t.entry)"><svg class="i"><use href="#i-close"/></svg></button></template>
  </div></template>
  <template x-for="line in placeLines('sheet:subtasks')" :key="line.n">
    <!-- include markup/place-line.html -->
  </template>
  <!-- Steps are added to a checklist on its screen, where they are marked as added to this checklist only -->
  <template x-if="checklistRole === 'run' && canEdit"><p class="note" id="d-run-steps-note" style="padding:12px 14px;margin:0">Open the checklist. Add a step in the box under its steps. New steps are added to this checklist only.</p></template>
  <!-- include markup/list-box.html -->
</div>
