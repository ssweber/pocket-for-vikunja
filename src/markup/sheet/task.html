    <template x-if="sheet.kind === 'task' && sheet.loading"><div class="loading">Loading…</div></template>
    <template x-if="sheet.kind === 'task' && sheet.error"><div class="err" x-html="sheet.error"></div></template>

    <template x-if="sheet.kind === 'task' && sheet.task"><div>
      <div class="d-head">
        <!-- Where the task lives: its project, and the task it's part of -->
        <div class="d-path" id="d-path">
          <i class="dot" :style="{background: colorOf(projById.get(sheet.task.project_id)?.hex_color)}"></i><button class="linkish" id="d-project-link" @click="goProject(sheet.task.project_id)" x-text="projById.get(sheet.task.project_id)?.title || 'Project'"></button>
          <template x-if="parentTask"><span class="d-parent"><span aria-hidden="true">›</span><button class="linkish" id="d-parent" @click="openTask(parentTask.id)" x-text="parentTask.title"></button></span></template>
        </div>
        <div class="d-title">
          <template x-if="checklistRole !== 'template' && canEdit"><button class="check" id="d-done" :class="'p' + (sheet.task.priority || 0) + (sheet.task.done ? ' on' : '')" :aria-label="sheet.task.done ? 'Mark not done' : 'Mark done'" @click="sheetDone()"><svg class="i"><use href="#i-check"/></svg></button></template>
          <textarea id="d-title" rows="1" aria-label="Title" enterkeyhint="done" :readonly="!canEdit" x-model="sheet.title"
                    x-effect="sheet.title; $nextTick(() => grow($el))"
                    @keydown.enter.prevent="$el.blur()" @change="saveTitle()"></textarea>
        </div>
        <!-- Progress, as in the list: hold the bar, or around the title, then slide (initSheetProgress). A run's is its steps done. -->
        <template x-if="checklistRole !== 'template' && canEdit"><div class="d-progress" id="d-progress" :role="isRunTask(sheet.task) ? 'progressbar' : 'slider'" tabindex="0" :aria-label="isRunTask(sheet.task) ? 'Steps done' : 'Progress'" aria-valuemin="0" aria-valuemax="100"
             :aria-valuenow="sheet.pct ?? shownPct(sheet.task)" :aria-valuetext="(sheet.pct ?? shownPct(sheet.task)) + '%'" :class="{setting: sheet.pct !== null}"
             :style="{'--pct': (sheet.pct ?? shownPct(sheet.task)) / 100}"
             @keydown.right.prevent="nudgeProgress(10)" @keydown.left.prevent="nudgeProgress(-10)">
          <span class="track"><i></i></span><span class="num" x-text="(sheet.pct ?? shownPct(sheet.task)) + '%'"></span>
        </div></template>
      </div>
      <div class="saved" id="d-saved" x-text="sheet.savedMsg"></div>

      <!-- In a checklist project: make the task a template, start a run from it, or go to the run it's part of -->
      <template x-if="checklistRole && checklistRole !== 'candidate'"><div class="card cl-card" id="d-checklist">
        <template x-if="checklistRole === 'template'"><div>
          <p>A template: every run gets its own copy of these steps. Tap a step to change it.</p>
          <button class="btn block" id="d-start" @click="openStart(sheet.task.id)">Start a run</button>
        </div></template>
        <template x-if="checklistRole === 'run' || checklistRole === 'step'"><button class="btn ghost block" id="d-open-run" @click="checklistRole === 'run' ? openRun(sheet.task.id) : openRun(parentTask.id, sheet.task.id)">Open the run</button></template>
      </div></template>

      <template x-if="!canEdit"><p class="ro-note" id="d-readonly">Shared with you to read only: you can see this task, but not change it.</p></template>
      <div class="card" x-show="checklistRole !== 'template'">
        <div class="prop"><span class="k">Due</span><span class="v">
          <input type="datetime-local" id="d-due" aria-label="Due date" :disabled="!canEdit" :value="toLocalInput(sheet.task.due_date)" @change="save({due_date: fromLocalInput($event.target.value)})">
          <template x-if="isSet(sheet.task.due_date) && canEdit"><button class="icon-btn plain" id="d-due-clear" aria-label="Clear due date" @click="save({due_date: ZERO})"><svg class="i"><use href="#i-close"/></svg></button></template>
        </span></div>
        <!-- Reminders, which Vikunja sends by email: counted back from the due date when there is one, or at a set time -->
        <div class="prop" id="d-reminders"><span class="k">Reminders</span><span class="v">
          <template x-for="(r, k) in sheet.task.reminders || []" :key="k + ':' + (r.relative_to ? r.relative_to + r.relative_period : r.reminder)"><span class="chip rem"><span x-text="'🔔 ' + reminderText(r)"></span>
            <template x-if="canEdit"><button class="chip-x" :aria-label="'Remove the reminder ' + reminderText(r)" @click="removeReminder(k)"><svg class="i"><use href="#i-close"/></svg></button></template></span></template>
          <template x-if="canEdit && !sheet.remindAt"><select id="d-remind-add" aria-label="Add a reminder" @change="addReminder($event.target.value); $event.target.value = ''">
            <option value="">Add a reminder</option><template x-for="o in reminderPresets" :key="o.value"><option :value="o.value" x-text="o.label"></option></template></select></template>
          <template x-if="sheet.remindAt"><span class="v"><input type="datetime-local" id="d-remind-at" aria-label="Remind me at" @change="addReminderAt($event.target.value)">
            <button class="icon-btn plain" aria-label="Don't add a reminder" @click="sheet.remindAt = false"><svg class="i"><use href="#i-close"/></svg></button></span></template>
        </span></div>
        <template x-if="remindersNote && (sheet.task.reminders || []).length"><p class="note prop-note" x-text="remindersNote"></p></template>
      </div>

      <div class="h3">Notes</div>
      <div class="card" id="d-desc-card">
        <template x-if="!sheet.editingDesc"><div class="desc" id="d-desc" role="button" tabindex="0" aria-label="Edit notes" x-html="descHtml" @click="$event.target.closest('a') || (canEdit && editDesc())" @keydown.enter="canEdit && editDesc()"></div></template>
        <template x-if="sheet.editingDesc"><div class="desc-edit">
          <textarea id="d-desc-in" aria-label="Notes" x-model="sheet.descDraft" x-init="$nextTick(() => $el.focus())"></textarea>
          <template x-if="sheet.descUnsaved"><p class="note" id="d-desc-unsaved" style="margin:6px 2px">Not saved yet: these notes are kept on this phone until they're saved.</p></template>
          <template x-if="sheet.descConflict !== null"><p class="note" id="d-desc-conflict" style="margin:6px 2px; white-space:pre-wrap">They were changed elsewhere while you wrote. The notes in Vikunja now:
<span x-text="sheet.descConflict || '(none)'"></span>
Save to replace them with yours, or Cancel to keep them.</p></template>
          <template x-if="RICH.test(sheet.task.description || '')"><p class="note" style="margin:6px 2px">These notes have formatting. Saving here keeps the text but drops links and lists.</p></template>
          <div class="row-actions"><button class="btn ghost" id="d-desc-cancel" @click="cancelDesc()">Cancel</button><button class="btn" id="d-desc-save" @click="saveDesc()">Save notes</button></div>
        </div></template>
      </div>

      <template x-if="attachmentsOn || (sheet.task.attachments || []).length"><div>
        <div class="h3">Attachments<span class="n num" x-text="(sheet.task.attachments || []).length + (waitingByTask.get(sheet.task.id) || []).length || ''"></span></div>
        <div class="card" id="d-attachments">
          <template x-for="a in sheet.task.attachments || []" :key="a.id">
            <button class="att" @click="openAttachment(a)"><svg class="i"><use href="#i-clip"/></svg><span class="nm" x-text="a.file?.name || 'file'"></span><span class="sz num" x-text="fmtSize(a.file?.size)"></span></button>
          </template>
          <!-- Added here or with the task, not in Vikunja yet: they wait on the phone while there's no connection -->
          <template x-for="f in waitingByTask.get(sheet.task.id) || []" :key="f.key">
            <div class="att uploading"><svg class="i"><use href="#i-clip"/></svg><span class="nm" x-text="f.name"></span><span class="sz" x-text="offline ? 'Waiting for a connection' : f.trouble ? 'Vikunja had a problem with it. Trying again.' : 'Uploading…'"></span>
              <button class="icon-btn plain" :aria-label="'Don\'t upload ' + f.name" @click="cancelFile(f.entry, f.key)"><svg class="i"><use href="#i-close"/></svg></button></div>
          </template>
          <!-- The phone offers its own choices here: a photo from the library, a new one, or a file -->
          <template x-if="attachmentsOn && canEdit"><label class="att add-att">
            <svg class="i"><use href="#i-plus"/></svg><span class="nm">Add a photo or file</span>
            <input type="file" id="d-file" class="sr" multiple aria-label="Add a photo or file" @change="addFiles($event.target.files); $event.target.value = ''">
          </label></template>
        </div>
      </div></template>

      <!-- A template's subtasks are its steps: in order, with when each is due in a run; changed, moved or removed here -->
      <div class="h3"><span x-text="checklistRole === 'template' ? 'Steps' : 'Subtasks'"></span><span class="n num" id="d-subcount" x-text="checklistRole === 'template' ? subtasks.length || '' : subtasks.length ? subtasks.filter(s => s.done).length + '/' + subtasks.length : ''"></span></div>
      <div class="card" id="d-subtasks">
        <template x-for="(st, i) in subtasks" :key="st.id">
          <div class="row" :class="{done: st.done && checklistRole !== 'template'}" :data-id="st.id">
            <template x-if="checklistRole !== 'template'"><button class="check" :class="'p' + (st.priority || 0)" :aria-label="(st.done ? 'Mark not done: ' : 'Mark done: ') + st.title" @click="toggleSubtask(st)"><svg class="i"><use href="#i-check"/></svg></button></template>
            <template x-if="checklistRole === 'template' && sheet.stepEdit?.id === st.id"><div class="body step-in">
              <textarea class="draft-in" rows="1" :id="'step-edit-' + st.id" x-model="sheet.stepEdit.text" :aria-label="'Change step ' + (i + 1)" enterkeyhint="done"
                        x-init="$nextTick(() => { $el.focus(); grow($el); })" x-effect="sheet.stepEdit?.text; $nextTick(() => grow($el))"
                        @keydown.enter.prevent="$el.blur()" @keydown.escape.stop="sheet.stepEdit = null" @blur="saveStepEdit(i)"></textarea>
              <div class="meta"><span x-text="'Write a time in words, like “in 10 min”, or as T#10m. ' + (stepEditInfo(i)?.problem || stepEditInfo(i)?.text || '')"></span></div>
            </div></template>
            <button class="body" x-show="!(checklistRole === 'template' && sheet.stepEdit?.id === st.id)" @click="checklistRole === 'run' ? openRun(sheet.task.id, st.id) : checklistRole === 'template' ? editStep(st) : openTask(st.id)"><div class="title" x-text="checklistRole === 'template' ? templateSteps[i]?.title : st.title"></div>
              <template x-if="checklistRole === 'template' && (templateSteps[i]?.text || templateSteps[i]?.problem)"><div class="meta"><span class="num" :class="{'due overdue': templateSteps[i].problem}" x-text="templateSteps[i].problem || templateSteps[i].text"></span></div></template>
              <template x-if="checklistRole !== 'template' && dueInfo(st.due_date)"><div class="meta"><span class="due num" :class="dueInfo(st.due_date).cls" x-text="dueInfo(st.due_date).label"></span></div></template></button>
            <!-- Who's doing it: "+ me" claims it, your picture lets it go, anyone else's just shows who -->
            <template x-if="subSlots[st.id]"><button class="claim" :class="{free: !subSlots[st.id].user, mine: subSlots[st.id].mine}" :aria-disabled="!subSlots[st.id].can" :aria-label="subSlots[st.id].label" @click="toggleClaim(st, subSlots[st.id], checklistRole === 'run' ? sheet.task.id : null)">
              <template x-if="subSlots[st.id].user"><span class="av"><span x-text="initials(subSlots[st.id].user)"></span><img x-show="avatarUrl(subSlots[st.id].user)" :src="avatarUrl(subSlots[st.id].user)" alt=""></span></template>
              <template x-if="!subSlots[st.id].user"><span class="me">+ me</span></template><template x-if="subSlots[st.id].more"><span class="more num" x-text="'+' + subSlots[st.id].more"></span></template></button></template>
            <template x-if="checklistRole === 'template'"><span class="step-edit">
              <button class="icon-btn" :aria-label="'Move up: ' + st.title" :disabled="i === 0 || sheet.checklistBusy" @click="moveStep(i, -1)"><svg class="i"><use href="#i-up"/></svg></button>
              <button class="icon-btn" :aria-label="'Move down: ' + st.title" :disabled="i === subtasks.length - 1 || sheet.checklistBusy" @click="moveStep(i, 1)"><svg class="i"><use href="#i-down"/></svg></button>
              <button class="icon-btn" :aria-label="'Remove step: ' + st.title" :disabled="sheet.checklistBusy" @click="removeStep(i)"><svg class="i"><use href="#i-close"/></svg></button>
            </span></template>
          </div>
        </template>
        <!-- Subtasks still waiting to be sent -->
        <template x-for="t in pendingSubtasks" :key="t.id"><div class="row pending" :data-id="t.id">
          <button class="check wait" disabled :aria-label="'Not sent yet: ' + t.title"><svg class="i"><use href="#i-check"/></svg></button>
          <div class="body"><div class="title"><span class="sr">Not sent yet: </span><span x-text="t.title"></span></div><div class="meta"><span x-text="offline ? 'Waiting for a connection' : 'Sending…'"></span></div></div>
          <button class="icon-btn plain" :aria-label="'Cancel ' + t.title" @click="cancelPending(t.entry, t.index)"><svg class="i"><use href="#i-close"/></svg></button>
        </div></template>
        <!-- The same box as quick add: what it read is marked, with chips to undo it, and @ and * suggest people and labels -->
        <template x-if="checklistRole !== 'template' && canEdit"><div class="addbox sub" id="d-subbox">
          <form id="d-subform" autocomplete="off" @submit.prevent="addSubtasks()">
            <div class="cap-field">
              <div class="cap-marks" aria-hidden="true" x-html="marksHtml('sub')"></div>
              <textarea id="d-subin" x-model="sheet.sub.text" rows="1" placeholder="Add subtasks, or paste a list" aria-label="Add subtasks" enterkeyhint="send"
                        x-effect="sheet.sub.text; $nextTick(() => grow($el))"
                        @keydown.enter="if (!$event.shiftKey && !$event.isComposing) { $event.preventDefault(); boxEnter('sub'); }"
                        @input="sheet.sub.caret = $el.selectionStart" @click="sheet.sub.caret = $el.selectionStart" @keyup="sheet.sub.caret = $el.selectionStart"
                        @scroll="$el.previousElementSibling.scrollTop = $el.scrollTop"
                        @focus="sheet.sub.focus = true" @blur="setTimeout(() => sheet.sub.focus = document.activeElement === $el, 150)"></textarea>
            </div>
            <button class="go" type="submit" aria-label="Add subtasks" @mousedown.prevent :disabled="sheet.sub.busy || !boxParsedLines('sub').some(p => p.title)"><svg class="i"><use href="#i-plus"/></svg></button>
          </form>
          <div class="chips" id="d-subchips" :hidden="!chips('sub').length && !(sheet.sub.focus && !sheet.sub.text && !Object.keys(boxBase('sub')).length)">
            <template x-if="sheet.sub.focus && !sheet.sub.text && !Object.keys(boxBase('sub')).length"><span class="hint" x-text="captureHint"></span></template>
            <template x-for="c in chips('sub')" :key="c.key"><button type="button" class="chip" :class="(c.cls || '') + (c.kind ? ' tap' : '') + (c.off ? ' off' : '')" :data-kind="c.kind || null" :aria-pressed="c.pressed === undefined ? null : String(c.pressed)"
              :tabindex="c.kind ? 0 : -1" :title="c.hint || (c.kind ? (c.off ? 'Tap to use this' : 'Tap to keep these words in the title') : null)"
              @mousedown.prevent @click="tapChip('sub', c)"><template x-if="c.color"><i class="dot" :style="{background: c.color}"></i></template><template x-if="c.icon"><svg class="i"><use :href="'#i-' + c.icon"/></svg></template><span x-text="c.text"></span></button></template>
          </div>
        </div></template>
        <!-- Under a template: new steps a row each, with their times, added together -->
        <template x-if="checklistRole === 'template'"><div class="draft" id="add-steps">
          <template x-for="(st, k) in draftRows('add')" :key="st.key"><div class="draft-step">
            <div class="draft-line">
              <template x-for="d in [draft('add').info.get(st.key)]" :key="0"><span class="num draft-no" x-text="d ? d.i + 1 : ''"></span></template>
              <textarea class="draft-in" rows="1" :id="'add-step-' + k" x-model="st.text" :placeholder="k ? 'Next step' : 'A step, like “Take the croissants out in 18 min”'" :aria-label="'Step ' + (k + 1)"
                     enterkeyhint="next" x-effect="st.text; $nextTick(() => grow($el))" @keydown.enter="if (!$event.isComposing) { $event.preventDefault(); addDraftRow('add', k + 1); }" @paste="pasteDraft('add', $event, k)"></textarea>
              <button type="button" class="icon-btn plain" :aria-label="'Move up: ' + (st.text || 'step ' + (k + 1))" :disabled="k === 0" @click="moveDraftRow('add', k, -1)"><svg class="i"><use href="#i-up"/></svg></button>
              <button type="button" class="icon-btn plain" :aria-label="'Move down: ' + (st.text || 'step ' + (k + 1))" :disabled="k === draftRows('add').length - 1" @click="moveDraftRow('add', k, 1)"><svg class="i"><use href="#i-down"/></svg></button>
              <button type="button" class="icon-btn plain" :aria-label="'Remove: ' + (st.text || 'step ' + (k + 1))" @click="dropDraftRow('add', k)"><svg class="i"><use href="#i-close"/></svg></button>
            </div>
            <template x-for="d in [draft('add').info.get(st.key)].filter(d => d && (d.problem || d.offset !== null || d.kept || d.name))" :key="0"><div class="draft-meta">
              <template x-if="d.problem"><span class="bad" x-text="d.problem"></span></template>
              <template x-if="d.offset !== null"><span class="chip draft-time"><svg class="i"><use href="#i-clock"/></svg><span x-text="durText(d.offset) + ' after'"></span>
                <template x-if="d.i === 0 && !d.lost"><span>the start</span></template>
                <template x-if="d.i > 0 || d.lost"><select :aria-label="'What “' + st.text + '” counts from'" @change="st.from = $event.target.value">
                  <template x-if="d.lost"><option value="?" disabled selected>pick one</option></template>
                  <option value="" :selected="!d.lost && d.from === ''" x-text="d.i ? 'the step before' : 'the start'"></option>
                  <template x-for="o in d.choices" :key="o.key"><option :value="o.key" :selected="d.from === o.key" x-text="o.title"></option></template>
                </select></template>
                <template x-if="d.phrase"><button type="button" class="chip-x" :aria-label="'Keep “' + d.phrase + '” as words'" @click="st.keep = true"><svg class="i"><use href="#i-close"/></svg></button></template>
              </span></template>
              <template x-if="d.kept"><button type="button" class="chip tap off" title="Tap to read it as a time" @click="st.keep = false"><svg class="i"><use href="#i-clock"/></svg><span x-text="d.phrase"></span></button></template>
              <template x-if="d.name"><span x-text="'Named “' + d.name + '”'"></span></template>
            </div></template>
          </div></template>
          <button type="button" class="draft-add" id="add-add-step" @click="addDraftRow('add')"><svg class="i"><use href="#i-plus"/></svg>Add a step</button>
          <template x-if="sheet.addRows.some(r => r.text.trim())"><div style="padding:0 14px 14px">
            <button class="btn block" id="add-steps-go" :disabled="sheet.subBusy || draft('add').problem" @click="addTemplateSteps()"
                    x-text="sheet.subBusy ? 'Adding…' : 'Add ' + draft('add').added.length + (draft('add').added.length === 1 ? ' step' : ' steps')"></button>
          </div></template>
        </div></template>
      </div>

      <div class="h3">Comments<span class="n num" id="d-ccount" x-text="(sheet.comments?.length || 0) + pendingComments.length || ''"></span></div>
      <div class="card" id="d-comments">
        <template x-if="sheet.commentsNote"><p class="note" style="padding:12px 14px;margin:0" x-html="sheet.commentsNote"></p></template>
        <template x-if="!sheet.comments && !sheet.commentsNote"><div class="loading" style="padding:16px">Loading…</div></template>
        <template x-for="c in sheet.comments || []" :key="c.id">
          <div class="comment"><div class="who"><b x-text="c.author?.name || c.author?.username || 'Someone'"></b> · <span class="num" x-text="new Date(c.created).toLocaleString([], {dateStyle: 'medium', timeStyle: 'short'})"></span></div><div class="desc" style="padding:0" x-html="sanitize(c.comment)"></div></div>
        </template>
        <template x-for="c in pendingComments" :key="c.id">
          <div class="comment waiting"><div class="who"><b x-text="user?.name || user?.username || 'You'"></b> · <span x-text="offline ? 'Waiting for a connection' : 'Sending…'"></span></div><div class="desc" style="padding:0" x-html="sanitize(c.html)"></div></div>
        </template>
        <template x-if="sheet.comments && canEdit"><form class="comment-form" id="d-cform" @submit.prevent="postComment()">
          <textarea id="d-cin" rows="1" placeholder="Write a comment" aria-label="Comment" x-model="sheet.commentDraft" x-effect="sheet.commentDraft; $nextTick(() => grow($el))"></textarea>
          <button class="go btn" style="width:44px;padding:0" aria-label="Post comment" @mousedown.prevent><svg class="i"><use href="#i-up"/></svg></button>
        </form></template>
      </div>

      <div class="h3">Details</div>
      <div class="card">
        <div class="prop"><span class="k">Project</span><span class="v">
          <select id="d-proj" aria-label="Project" :disabled="!canEdit" @change="moveTask(+$event.target.value)">
            <template x-for="r in tree" :key="r.p.id"><option :value="r.p.id" :selected="r.p.id === sheet.task.project_id" x-text="'  '.repeat(r.depth) + r.p.title"></option></template>
          </select>
        </span></div>
        <div class="prop"><span class="k">Labels</span><span class="v">
          <template x-for="l in sheet.task.labels || []" :key="l.id"><span class="label-chip"><i class="dot" style="margin:0" :style="{background: colorOf(l.hex_color)}"></i><span x-text="l.title"></span><button class="x" :aria-label="'Remove label ' + l.title" @click="removeLabel(l.id)"><svg class="i" style="width:14px;height:14px"><use href="#i-close"/></svg></button></span></template>
          <template x-if="canEdit"><button class="add-label" id="d-add-label" @click="toggleLabelPicker()">Add</button></template>
        </span></div>
        <div class="prop"><span class="k">Assigned</span><span class="v" id="d-assignees">
          <template x-for="u in sheet.task.assignees || []" :key="u.id"><span class="label-chip"><span x-text="u.name || u.username"></span><button class="x" :aria-label="'Unassign ' + (u.name || u.username)" @click="unassign(u.id)"><svg class="i" style="width:14px;height:14px"><use href="#i-close"/></svg></button></span></template>
          <template x-if="!sheet.assigning && canEdit"><button class="add-label" id="d-add-assignee" @click="sheet.assigning = true">Add</button></template>
          <template x-if="sheet.assigning"><div class="assign-pick">
            <form class="assign-form" @submit.prevent="assign()">
              <input id="d-assign-in" placeholder="Name or username" aria-label="Who to assign" autocapitalize="off" autocomplete="off" spellcheck="false" enterkeyhint="done"
                     x-model="sheet.assignName" x-init="$nextTick(() => $el.focus()); loadPeople().catch(() => {})" @keydown.escape.stop="sheet.assigning = false">
              <button type="button" class="btn ghost" id="d-assign-done" @click="sheet.assigning = false; sheet.assignName = ''">Done</button>
            </form>
            <div class="chips" id="d-assign-list"><template x-for="u in assignSuggestions" :key="u.id">
              <button type="button" class="chip tap" @mousedown.prevent @click="assign(u)" x-text="(u.name ? u.name + ' ' : '') + '@' + u.username"></button>
            </template></div>
          </div></template>
        </span></div>
        <div class="prop"><span class="k">Repeats</span><span class="v">
          <select id="d-repeat" aria-label="Repeats" :disabled="!canEdit" @change="setRepeat($event.target.value)">
            <template x-for="o in repeatOptions" :key="o.value"><option :value="o.value" :selected="o.value === repeatValue" x-text="o.label"></option></template>
          </select>
        </span></div>
      </div>
      <template x-if="picker.open"><div class="card picker">
        <template x-if="picker.loading"><div class="loading" style="padding:16px">Loading labels…</div></template>
        <template x-if="picker.error"><div class="err" x-html="picker.error"></div></template>
        <template x-if="!picker.loading && !picker.error"><div>
          <input id="lp-q" placeholder="Find or create a label" aria-label="Label" x-model="picker.q" x-init="$nextTick(() => $el.focus())" enterkeyhint="done"
                 @keydown.enter.prevent="labelEnter()" @keydown.escape.stop="picker.open = false">
          <div id="lp-list">
            <template x-for="l in pickerMatches" :key="l.id"><button @click="addLabel(l)"><i class="dot" style="margin:0" :style="{background: colorOf(l.hex_color)}"></i><span x-text="l.title"></span></button></template>
            <template x-if="pickerCanCreate"><button @click="addLabel(null)" x-text="'Create “' + picker.q.trim() + '”'"></button></template>
            <template x-if="!pickerMatches.length && !picker.q.trim()"><p class="note" style="padding:0 14px 10px">No other labels. Type to create one.</p></template>
          </div>
        </div></template>
      </div></template>

    </div></template>
