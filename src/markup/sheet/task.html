    <template x-if="sheet.kind === 'task' && sheet.loading"><div class="loading">Loading…</div></template>
    <template x-if="sheet.kind === 'task' && sheet.error"><div class="err" x-html="sheet.error"></div></template>

    <template x-if="sheet.kind === 'task' && sheet.task"><div>
      <div class="d-head">
        <!-- Where the task lives: its project, and the task it's part of -->
        <div class="d-path" id="d-path">
          <i class="dot" x-style="{background: colorOf(projById.get(sheet.task.project_id)?.hex_color)}"></i><button class="linkish" id="d-project-link" @click="goProject(sheet.task.project_id)" x-text="projById.get(sheet.task.project_id)?.title || 'Project'"></button>
          <template x-if="parentTask"><span class="d-parent"><span aria-hidden="true">›</span><button class="linkish" id="d-parent" @click="openTask(parentTask.id)" x-text="parentTitle"></button></span></template>
        </div>
        <!-- A template and its step have no row (they're never ticked, nor have progress): their name, as a heading over
             the card of their notes and files. A template's is changed here; a step's in the template. -->
        <template x-if="ofTemplate"><div class="d-title">
          <template x-if="checklistRole === 'template'"><textarea id="d-title" rows="1" aria-label="Title" enterkeyhint="done" :readonly="!canEdit" x-model="sheet.title"
                    x-effect="sheet.title; $nextTick(() => grow($el))"
                    @keydown.enter.prevent="$el.blur()" @change="saveTitle()"></textarea></template>
          <!-- A template's step: its name without its time, which is changed in the template, with the steps it can count from -->
          <template x-if="checklistRole === 'tplstep'"><h2 class="d-step-title" id="d-step-title" x-text="tplStep?.title || sheet.task.title"></h2></template>
        </div></template>
        <template x-if="checklistRole === 'tplstep' && tplStep"><div class="meta d-step-when num" id="d-step-when">
          <span x-text="'Step ' + tplStep.no + ' of ' + tplStep.of"></span><template x-if="tplStep.problem || tplStep.text"><span :class="{'due overdue': tplStep.problem}" x-text="tplStep.problem || tplStep.text"></span></template>
        </div></template>
        <!-- Saving…, Saved: at the right of the path's line, so the card stays right under it -->
        <div class="saved" id="d-saved" x-text="sheet.savedMsg"></div>
      </div>
      <!-- include markup/sheet/task-card.html -->

      <!-- In a checklist project: make the task a template, start a run from it, or go to the run it's part of -->
      <template x-if="checklistRole && checklistRole !== 'candidate'"><div class="card cl-card" id="d-checklist">
        <template x-if="checklistRole === 'template'"><div>
          <p>A template: every run gets its own copy of these steps. Tap a step to change or remove it, or to add notes and photos to it. Hold a step, then move it up or down, to move it.</p>
          <button class="btn block" id="d-start" @click="openStart(sheet.task.id)">Start a run</button>
        </div></template>
        <template x-if="checklistRole === 'tplstep'"><div>
          <p>A step of a template: every run gets its own copy of it, with these notes. Its name and when it's due are changed in the template.</p>
          <button class="btn ghost block" id="d-open-template" @click="openTask(parentTask.id)">Back to the template</button>
        </div></template>
        <template x-if="checklistRole === 'run' || checklistRole === 'step'"><button class="btn ghost block" id="d-open-run" @click="checklistRole === 'run' ? openRun(sheet.task.id) : openRun(parentTask.id, sheet.task.id)">Open the run</button></template>
      </div></template>

      <template x-if="!canEdit"><p class="ro-note" id="d-readonly">Shared with you to read only: you can see this task, but not change it.</p></template>
      <!-- What a sheet has or not by its kind is x-if, never x-show: x-show changes a frame later, so a template's step
           opened from its template would show for a frame with the template's date and steps under its own name -->
      <!-- A template's: when it comes round, as Vikunja's repeating task, and the reminders Vikunja emails before then -->
      <template x-if="checklistRole === 'template'"><div class="h3">When it's due</div></template>
      <!-- A row takes a tap anywhere (propTap): its date's picker, the list of its select, or its Add; a row with only a
           select has it over the whole row (.prop.sel), so the phone opens it where showPicker can't -->
      <template x-if="!ofTemplate || checklistRole === 'template'"><div class="card" id="d-due-card">
        <div class="prop" @click="propTap($event)"><span class="k" x-text="checklistRole === 'template' ? 'Next due' : 'Due'"></span><span class="v">
          <input type="datetime-local" id="d-due" data-tap :aria-label="checklistRole === 'template' ? 'Next due' : 'Due date'" :disabled="!canEdit" :value="toLocalInput(dueShown)" @change="setDue(fromLocalInput($event.target.value))">
          <template x-if="isSet(dueShown) && canEdit"><button class="icon-btn plain" id="d-due-clear" aria-label="Clear due date" @click="setDue(ZERO)"><svg class="i"><use href="#i-close"/></svg></button></template>
        </span></div>
        <template x-if="checklistRole === 'template'"><div class="prop sel"><span class="k">Repeats</span><span class="v">
          <select id="d-repeat" aria-label="Repeats" :disabled="!canEdit" @change="setRepeat($event.target.value)">
            <template x-for="o in repeatOptions" :key="o.value"><option :value="o.value" :selected="o.value === repeatValue" x-text="o.label"></option></template>
          </select>
        </span></div></template>
        <!-- Reminders, which Vikunja sends by email: counted back from the due date when there is one, or at a set time.
             Only while a task isn't done, so a template's only while it comes round. -->
        <template x-if="checklistRole !== 'template' || isSet(dueShown)"><div class="prop" id="d-reminders" @click="propTap($event)"><span class="k">Reminders</span><span class="v">
          <template x-for="(r, k) in sheet.task.reminders || []" :key="k + ':' + (r.relative_to ? r.relative_to + r.relative_period : r.reminder)"><span class="chip rem"><span x-text="'🔔 ' + reminderText(r)"></span>
            <template x-if="canEdit"><button class="chip-x" :aria-label="'Remove the reminder ' + reminderText(r)" @click="removeReminder(k)"><svg class="i"><use href="#i-close"/></svg></button></template></span></template>
          <template x-if="canEdit && !sheet.remindAt"><select id="d-remind-add" data-tap aria-label="Add a reminder" @change="addReminder($event.target.value); $event.target.value = ''">
            <option value="">Add a reminder</option><template x-for="o in reminderPresets" :key="o.value"><option :value="o.value" x-text="o.label"></option></template></select></template>
          <template x-if="sheet.remindAt"><span class="v"><input type="datetime-local" id="d-remind-at" data-tap aria-label="Remind me at" @change="addReminderAt($event.target.value)">
            <button class="icon-btn plain" aria-label="Don't add a reminder" @click="sheet.remindAt = false"><svg class="i"><use href="#i-close"/></svg></button></span></template>
        </span></div></template>
        <template x-if="remindersNote && (sheet.task.reminders || []).length && (checklistRole !== 'template' || isSet(dueShown))"><p class="note prop-note" x-text="remindersNote"></p></template>
        <template x-for="line in placeLines('sheet:due')" :key="line.n">
          <!-- include markup/place-line.html -->
        </template>
      </div></template>
      <template x-if="checklistRole === 'template'"><p class="note" id="d-comes-round" x-text="comesRoundNote"></p></template>

      <!-- A template's subtasks are its steps: in order, with when each is due in a run; tapped, changed, moved or removed -->
      <template x-if="checklistRole !== 'tplstep'"><div class="h3"><span x-text="checklistRole === 'template' ? 'Steps' : 'Subtasks'"></span><span class="n num" id="d-subcount" x-text="checklistRole === 'template' ? subtasks.length || '' : subtasks.length ? subtasks.filter(s => s.done).length + '/' + subtasks.length : ''"></span></div></template>
      <template x-if="checklistRole !== 'tplstep'"><div class="card" id="d-subtasks">
        <!-- A subtask: the same row as in a list, as a sheet has it (g.sheet); a sheet is for managing, as a project is, so
             it's swiped to its Delete and held to move it, whatever screen the sheet is over -->
        <template x-for="g in [{depth: {}, sheet: true, delete: true, reorder: true}]" :key="0"><template x-for="t in checklistRole === 'template' ? [] : subtasks" :key="t.id">
          <!-- include markup/task-row.html -->
        </template></template>
        <!-- A template's step has a row of its own, not the task row: its number, plain (a square box is a step you tick,
             in a run), where a task has its tick, when it's due in
             a run and its notes' first line under it, and, tapped, quick add's box in its place, with × and ⋯ (Move up,
             Move down). It's moved by holding it and moving it up or down, or with Alt+↑ ↓. Who's doing it is the same
             slot as on a subtask. -->
        <template x-for="(st, i) in checklistRole === 'template' ? subtasks : []" :key="st.id">
          <!-- A step being changed is saved once the focus leaves its row: its time chip and buttons are part of it -->
          <div class="row" :class="{editing: sheet.stepEdit?.id === st.id}" :data-id="st.id"
               @focusout="sheet.stepEdit?.id === st.id && setTimeout(() => $el.contains(document.activeElement) || saveStepEdit(i))">
            <span class="check step-n num" aria-hidden="true" x-text="i + 1"></span>
            <template x-if="sheet.stepEdit?.id === st.id"><div class="body step-in" x-data="{bw: 'edit'}">
              <!-- Quick add's box ('edit'): @people assign the step, *labels label it, as when it was written -->
              <div class="step-box"><div class="cap-field"><div class="cap-marks" aria-hidden="true" x-html="marksHtml('edit')"></div><textarea class="draft-in" rows="1" :id="'step-edit-' + st.id" x-model="sheet.stepEdit.text" :aria-label="'Change step ' + (i + 1)" enterkeyhint="done"
                        x-init="$nextTick(() => { passFocus($el, t => { sheet.stepEdit.text += t; }, true); grow($el); })" x-effect="sheet.stepEdit?.text; $nextTick(() => grow($el))"
                        @keydown.enter="if (!$event.isComposing) { $event.preventDefault(); boxEnter('edit'); }" @keydown.escape.stop="sheet.stepEdit = null"
                        @keydown.alt.up.prevent="moveStep(i, -1)" @keydown.alt.down.prevent="moveStep(i, 1)"
                        @input="sheet.stepEdit.caret = $el.selectionStart" @click="sheet.stepEdit.caret = $el.selectionStart" @keyup="sheet.stepEdit.caret = $el.selectionStart"
           @scroll="$el.previousElementSibling.scrollTop = $el.scrollTop" @focus="sheet.stepEdit.focus = true; loadPeople().catch(() => {}); loadLabels().catch(() => {})" @blur="setTimeout(() => { if (sheet.stepEdit) sheet.stepEdit.focus = document.activeElement === $el; }, 150)"></textarea></div></div>
              <template x-for="st in [sheet.stepEdit]" :key="0"><div>
                <template x-for="d in draftShown(stepEditDraft(i))" :key="0">
                  <!-- include markup/sheet/step-time.html -->
                </template>
              </div></template>
              <!-- include markup/sheet/box-chips.html -->
              <!-- Under the box, so it has the row's width: its own sheet, ⋯ and ×, which keep the keyboard up -->
              <div class="step-in-foot" x-data="{more: false}">
                <button type="button" class="linkish step-notes" :id="'step-notes-' + st.id" @mousedown.prevent @click="openStep(i)">Notes and photos ›</button>
                <span class="step-edit">
                  <button class="icon-btn" :aria-label="'More for step: ' + st.title" :aria-expanded="String(more)" @mousedown.prevent @click="more = !more"><svg class="i"><use href="#i-more"/></svg></button>
                  <button class="icon-btn" :aria-label="'Remove step: ' + st.title" :disabled="sheet.checklistBusy" @mousedown.prevent @click="removeStep(i)"><svg class="i"><use href="#i-close"/></svg></button>
                </span>
                <!-- Moving it for a keyboard or a screen reader, as holding it and moving it up or down does -->
                <template x-if="more"><div class="menu step-menu" role="menu" @keydown.escape.stop="more = false">
                  <button role="menuitem" :disabled="i === 0 || sheet.checklistBusy" @mousedown.prevent @click="more = false; moveStep(i, -1)">Move up</button>
                  <button role="menuitem" :disabled="i === subtasks.length - 1 || sheet.checklistBusy" @mousedown.prevent @click="more = false; moveStep(i, 1)">Move down</button>
                </div></template>
              </div>
            </div></template>
            <button class="body" x-show="sheet.stepEdit?.id !== st.id" @click="editStep(st)"><div class="title" x-text="templateSteps[i]?.title"></div>
              <template x-if="templateSteps[i]?.text || templateSteps[i]?.problem"><div class="meta"><span class="num" :class="{'due overdue': templateSteps[i].problem}" x-text="templateSteps[i].problem || templateSteps[i].text"></span></div></template>
              <template x-if="stepNote(st)"><div class="step-note" x-text="stepNote(st)"></div></template></button>
            <template x-for="slot in subSlots[st.id] && sheet.stepEdit?.id !== st.id ? [subSlots[st.id]] : []" :key="0">
              <!-- include markup/claim-slot.html -->
            </template>
          </div>
        </template>
        <!-- Subtasks still waiting to be sent -->
        <template x-for="t in pendingSubtasks" :key="t.id"><div class="row pending" :class="{waits: t.waits}" :data-id="t.id">
          <button class="check" :class="{wait: t.waits}" disabled :aria-label="'Not sent yet: ' + t.title"><svg class="i"><use href="#i-check"/></svg></button>
          <div class="body"><div class="title"><span class="sr">Not sent yet: </span><span x-text="t.title"></span></div><div class="meta"><span x-text="offline ? 'Waiting for a connection' : 'Sending…'"></span></div></div>
          <button class="icon-btn plain" :aria-label="'Cancel ' + t.title" @click="cancelPending(t.entry, t.index)"><svg class="i"><use href="#i-close"/></svg></button>
        </div></template>
        <template x-for="line in placeLines('sheet:subtasks')" :key="line.n">
          <!-- include markup/place-line.html -->
        </template>
        <!-- The same box as quick add: what it read is marked, with chips to undo it, and @ and * suggest people and labels -->
        <!-- A run's steps are inserted on its screen, so they're marked as added during the run -->
        <template x-if="checklistRole === 'run' && canEdit"><p class="note" id="d-run-steps-note" style="padding:12px 14px;margin:0">To add a step, use the box at the bottom of the run's screen: it's marked as added during the run.</p></template>
        <template x-if="checklistRole !== 'template' && checklistRole !== 'run' && canEdit"><div class="addbox sub" id="d-subbox">
          <form id="d-subform" autocomplete="off" @submit.prevent="addSubtasks()">
            <div class="cap-field">
              <div class="cap-marks" aria-hidden="true" x-html="marksHtml('sub')"></div>
              <textarea id="d-subin" x-model="sheet.sub.text" rows="1" placeholder="Add subtasks, or paste a list" aria-label="Add subtasks" enterkeyhint="send"
                        x-effect="sheet.sub.text; $nextTick(() => grow($el))"
                        @keydown.enter="if (!$event.shiftKey && !$event.isComposing) { $event.preventDefault(); boxEnter('sub'); }"
                        @input="sheet.sub.caret = $el.selectionStart" @click="sheet.sub.caret = $el.selectionStart" @keyup="sheet.sub.caret = $el.selectionStart"
                        @scroll="$el.previousElementSibling.scrollTop = $el.scrollTop"
                        @focus="sheet.sub.focus = true" @blur="setTimeout(() => sheet.sub.focus = document.activeElement === $el, 150)"></textarea>
            </div>
            <button class="go" type="submit" aria-label="Add subtasks" @mousedown.prevent :disabled="!boxParsedLines('sub').some(p => p.title)"><svg class="i"><use href="#i-plus"/></svg></button>
          </form>
          <div class="chips" id="d-subchips" :hidden="!chips('sub').length && !(sheet.sub.focus && !sheet.sub.text)">
            <template x-if="sheet.sub.focus && !sheet.sub.text"><span class="hint" id="d-subhint" x-text="boxHint('sub')"></span></template>
            <template x-for="c in chips('sub')" :key="c.key"><button type="button" class="chip" :class="(c.cls || '') + (c.kind ? ' tap' : '') + (c.off ? ' off' : '')" :data-kind="c.kind || null" :aria-pressed="c.pressed === undefined ? null : String(c.pressed)"
              :tabindex="c.kind ? 0 : -1" :title="c.hint || (c.kind ? (c.off ? 'Tap to use this' : 'Tap to keep these words in the title') : null)"
              @mousedown.prevent @click="tapChip('sub', c)"><template x-if="c.color"><i class="dot" x-style="{background: c.color}"></i></template><template x-if="c.icon"><svg class="i"><use :href="'#i-' + c.icon"/></svg></template><span x-text="c.text"></span></button></template>
          </div>
        </div></template>
        <!-- Under a template: new steps a row each, with their times, added together -->
        <template x-if="checklistRole === 'template'"><div class="draft" id="add-steps" x-data="{which: 'add'}">
          <!-- include markup/sheet/draft-steps.html -->
          <button type="button" class="draft-add" id="add-add-step" @click="addDraftRow('add')"><svg class="i"><use href="#i-plus"/></svg>Add a step</button>
          <template x-if="sheet.addRows.some(r => r.text.trim())"><div style="padding:0 14px 14px">
            <button class="btn block" id="add-steps-go" :disabled="sheet.subBusy || draft('add').problem" @click="addTemplateSteps()"
                    x-text="sheet.subBusy ? 'Adding…' : 'Add ' + draft('add').added.length + (draft('add').added.length === 1 ? ' step' : ' steps')"></button>
          </div></template>
        </div></template>
      </div></template>

      <!-- Not on a template or its step: a run is a copy of them made by Vikunja, which copies their notes, photos,
           labels and people but not their comments, so nothing written there reaches a run -->
      <template x-if="!ofTemplate"><div>
      <div class="h3">Comments<span class="n num" id="d-ccount" x-text="(sheet.comments?.length || 0) + pendingComments.length || ''"></span></div>
      <div class="card" id="d-comments">
        <template x-if="sheet.commentsNote"><p class="note" style="padding:12px 14px;margin:0" x-html="sheet.commentsNote"></p></template>
        <template x-if="!sheet.comments && !sheet.commentsNote"><div class="loading" style="padding:16px">Loading…</div></template>
        <template x-for="c in sheet.comments || []" :key="c.id">
          <div class="comment"><div class="who"><b x-text="c.author?.name || c.author?.username || 'Someone'"></b> · <span class="num" x-text="new Date(c.created).toLocaleString([], {dateStyle: 'medium', timeStyle: 'short'})"></span></div><div class="desc" style="padding:0" x-html="sanitize(c.comment)"></div>
            <button class="icon-btn plain copy-btn" aria-label="Copy this comment" @click="copyComment(c)"><svg class="i"><use href="#i-copy"/></svg></button></div>
        </template>
        <template x-for="c in pendingComments" :key="c.id">
          <div class="comment waiting"><div class="who"><b x-text="user?.name || user?.username || 'You'"></b> · <span x-text="offline ? 'Waiting for a connection' : 'Sending…'"></span></div><div class="desc" style="padding:0" x-html="sanitize(c.html)"></div></div>
        </template>
        <template x-for="line in placeLines('sheet:comments')" :key="line.n">
          <!-- include markup/place-line.html -->
        </template>
        <template x-if="sheet.comments && canEdit"><form class="comment-form" id="d-cform" @submit.prevent="postComment()">
          <textarea id="d-cin" rows="1" placeholder="Write a comment" aria-label="Comment" x-model="sheet.commentDraft" x-effect="sheet.commentDraft; $nextTick(() => grow($el))"></textarea>
          <button class="go btn" style="width:44px;padding:0" aria-label="Post comment" @mousedown.prevent><svg class="i"><use href="#i-up"/></svg></button>
        </form></template>
      </div>
      </div></template>

      <div class="h3">Details</div>
      <div class="card">
        <div class="prop sel"><span class="k">Project</span><span class="v">
          <select id="d-proj" aria-label="Project" :disabled="!canEdit" @change="moveTask(+$event.target.value)">
            <template x-for="r in tree" :key="r.p.id"><option :value="r.p.id" :selected="r.p.id === sheet.task.project_id" x-text="'  '.repeat(r.depth) + r.p.title"></option></template>
          </select>
        </span></div>
        <div class="prop" @click="propTap($event)"><span class="k">Labels</span><span class="v">
          <template x-for="l in sheet.task.labels || []" :key="l.id"><span class="label-chip"><i class="dot" style="margin:0" x-style="{background: colorOf(l.hex_color)}"></i><span x-text="l.title"></span><template x-if="!keepsLabel(l)"><button class="x" :aria-label="'Remove label ' + l.title" @click="removeLabel(l.id)"><svg class="i" style="width:14px;height:14px"><use href="#i-close"/></svg></button></template></span></template>
          <template x-if="checklistRole === 'template'"><span class="note" id="d-template-label" style="display:block;width:100%;margin:4px 0 0">Its runs get its labels, all but “template”, which is what makes it a template.</span></template>
          <template x-if="canEdit"><button class="add-label" id="d-add-label" data-tap @click="toggleLabelPicker()">Add</button></template>
        </span></div>
        <div class="prop" @click="propTap($event)"><span class="k">Assigned</span><span class="v" id="d-assignees">
          <template x-for="u in peopleOf(sheet.task.id, sheet.task.assignees)" :key="u.id"><span class="label-chip"><span x-text="u.name || u.username"></span><button class="x" :aria-label="'Unassign ' + (u.name || u.username)" @click="unassign(u.id)"><svg class="i" style="width:14px;height:14px"><use href="#i-close"/></svg></button></span></template>
          <template x-if="!sheet.assigning && canEdit"><button class="add-label" id="d-add-assignee" data-tap @click="sheet.assigning = true">Add</button></template>
          <template x-if="sheet.assigning"><div class="assign-pick">
            <form class="assign-form" @submit.prevent="assign()">
              <input id="d-assign-in" placeholder="Name or username" aria-label="Who to assign" autocapitalize="off" autocomplete="off" spellcheck="false" enterkeyhint="done"
                     x-model="sheet.assignName" x-init="$nextTick(() => $el.focus()); loadPeople().catch(() => {})" @keydown.escape.stop="sheet.assigning = false">
              <button type="button" class="btn ghost" id="d-assign-done" @click="sheet.assigning = false; sheet.assignName = ''">Done</button>
            </form>
            <div class="chips" id="d-assign-list"><template x-for="u in assignSuggestions" :key="u.id">
              <button type="button" class="chip tap" @mousedown.prevent @click="assign(u)" x-text="(u.name ? u.name + ' ' : '') + '@' + u.username"></button>
            </template></div>
          </div></template>
        </span></div>
        <!-- Priority as a level, 1 to 5 bars, and its word; the phone's own picker lies over the whole row (.prop.sel), as
             Safari can't open a select from code. Not a template's. -->
        <template x-if="!ofTemplate"><div class="prop sel prio"><span class="k">Priority</span><span class="v">
          <span class="bars" :class="'p' + (sheet.task.priority || 0)" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
          <span x-text="PRIOS[sheet.task.priority || 0].label"></span>
          <svg class="i prio-chev" aria-hidden="true"><use href="#i-chev"/></svg>
          <select id="d-prio" aria-label="Priority" :disabled="!canEdit" @change="save({priority: +$event.target.value})">
            <template x-for="p in PRIOS" :key="p.n"><option :value="p.n" :selected="(sheet.task.priority || 0) === p.n" x-text="p.label"></option></template>
          </select>
        </span></div></template>
        <!-- Progress, the tap path for a swipe on the row (design rule 3): the quarters, the one it's at pressed (none for
             progress set elsewhere, 30% say, nor for a done task, which a quarter opens again at). Done is the tick. Not
             a parent's (a run's too): its progress is worked out from its subtasks (rule 5). Claims it as a swipe does
             (setSheetProgress). -->
        <template x-if="!ofTemplate && !sheetRing && canEdit"><div class="prop"><span class="k">Progress</span><span class="v d-quarters" id="d-progress" role="group" aria-label="Progress">
          <template x-for="q in QUARTERS" :key="q"><button type="button" class="chip toggle tap" :aria-pressed="String(quarterOn(sheet.task) === q)" :aria-label="q + '% done'" @click="setSheetProgress(q)" x-text="q + '%'"></button></template>
        </span></div></template>
        <!-- Not for a step: a template's steps and a run's are copied, not repeated -->
        <template x-if="!['template', 'tplstep', 'step'].includes(checklistRole)"><div class="prop sel"><span class="k">Repeats</span><span class="v">
          <select id="d-repeat" aria-label="Repeats" :disabled="!canEdit" @change="setRepeat($event.target.value)">
            <template x-for="o in repeatOptions" :key="o.value"><option :value="o.value" :selected="o.value === repeatValue" x-text="o.label"></option></template>
          </select>
        </span></div></template>
        <template x-for="line in placeLines('sheet:props')" :key="line.n">
          <!-- include markup/place-line.html -->
        </template>
      </div>
      <template x-if="picker.open"><div class="card picker">
        <template x-if="picker.loading"><div class="loading" style="padding:16px">Loading labels…</div></template>
        <template x-if="picker.error"><div class="err" x-html="picker.error"></div></template>
        <template x-if="!picker.loading && !picker.error"><div>
          <input id="lp-q" placeholder="Find or create a label" aria-label="Label" x-model="picker.q" x-init="$nextTick(() => $el.focus())" enterkeyhint="done"
                 @keydown.enter.prevent="labelEnter()" @keydown.escape.stop="picker.open = false">
          <div id="lp-list">
            <template x-for="l in pickerMatches" :key="l.id"><button @click="addLabel(l)"><i class="dot" style="margin:0" x-style="{background: colorOf(l.hex_color)}"></i><span x-text="l.title"></span></button></template>
            <template x-if="pickerCanCreate"><button @click="addLabel(null)" x-text="'Create “' + picker.q.trim() + '”'"></button></template>
            <template x-if="!pickerMatches.length && !picker.q.trim()"><p class="note" style="padding:0 14px 10px">No other labels. Type to create one.</p></template>
          </div>
        </div></template>
      </div></template>

    </div></template>
