<!-- The chips under a template's box (`bw` is the box's name in box()). They show the people, labels and priority
     quick add read, which a tap removes, or the suggestions for @ and * (chips.html). While the box is empty and
     focused, a hint shows what it reads. -->
<div class="chips box-chips" x-show="chips(bw).length || (box(bw).focus && !box(bw).text.trim())"><template x-if="box(bw).focus && !box(bw).text.trim()"><span class="hint" x-text="boxHint(bw)"></span></template>
  <!-- include markup/chips.html -->
</div>
