<!-- What quick add read in a template's box (`bw`, its name in box()): people, labels and priority, as chips to tap off,
     or what @ and * suggest (chips.html, the chips of every add box); while it's empty and focused, what it reads. -->
<div class="chips box-chips" x-show="chips(bw).length || (box(bw).focus && !box(bw).text.trim())"><template x-if="box(bw).focus && !box(bw).text.trim()"><span class="hint" x-text="boxHint(bw)"></span></template>
  <!-- include markup/chips.html -->
</div>
