    <template x-if="sheet.kind === 'account'"><div>
      <div class="d-title"><h2 x-text="user?.name || user?.username || 'Account'"></h2></div>
      <div class="card">
        <div class="prop"><span class="k">User</span><span class="v" x-text="'@' + (user?.username || '')"></span></div>
        <div class="prop"><span class="k">Server</span><span class="v" style="overflow-wrap:anywhere" x-text="server"></span></div>
        <div class="prop"><span class="k">Version</span><span class="v num" x-text="info?.version || ''"></span></div>
        <div class="prop"><span class="k">Signed in</span><span class="v">Same as Vikunja on this device</span></div>
      </div>
      <div class="h3">Quick add from anywhere</div>
      <div class="card"><div class="desc" style="font-size:15px">Open <code style="overflow-wrap:anywhere" x-text="location.origin + location.pathname + '#/add?text=…'"></code> to start a task with the text filled in. Handy from an iOS Shortcut or a bookmark.</div></div>
      <a class="btn ghost block" :href="server" target="_blank" rel="noopener" style="text-decoration:none;margin-top:6px">Open Vikunja's web app</a>
      <div class="danger-zone"><button class="btn danger block" id="btn-signout" @click="signOut()">Sign out</button>
        <p class="note">This also signs you out of Vikunja on this device.</p></div>
    </div></template>
