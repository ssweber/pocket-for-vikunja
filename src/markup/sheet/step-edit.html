<!-- The editor for a template's step `t`, shown in place of its row (task-row.html, g.step). It is a quick-add box
     ('edit', x-box), so @user assigns the step and *label labels it, as when the step was first typed. Under the box
     are the time chip, the chips for what quick add read, and a link to the step's notes, photos and asks. The step is saved
     when focus leaves the row. The chips and the link count as part of the row, so tapping them keeps the keyboard up.
     Escape cancels the edit. The editor has no buttons to move or delete the step. Hold the row to reorder it and
     swipe left to delete it (stepReorder, app/progress.js). -->
<div class="body step-in" x-data="{bw: 'edit'}" @focusout="setTimeout(() => $el.closest('.row')?.contains(document.activeElement) || saveStepEdit(stepAt(t)))">
  <div class="step-box"><div class="cap-field"><div class="cap-marks" aria-hidden="true" x-html="marksHtml('edit')"></div><textarea class="draft-in" rows="1" :id="'step-edit-' + t.id" x-model="sheet.stepEdit.text" x-box="bw" :aria-label="'Change step ' + (stepAt(t) + 1)" enterkeyhint="done"
            x-init="$nextTick(() => { passFocus($el, typed => { sheet.stepEdit.text += typed; }, true); grow($el); })"
            @keydown.escape.stop="sheet.stepEdit = null"></textarea></div></div>
  <template x-for="st in [sheet.stepEdit]" :key="0"><div>
    <template x-for="d in draftShown(stepEditDraft(stepAt(t)))" :key="0">
      <!-- include markup/sheet/step-time.html -->
    </template>
  </div></template>
  <!-- include markup/sheet/box-chips.html -->
  <!-- Not shown in New template, because a step has no notes until the template is created. -->
  <template x-if="!t.key"><div class="step-in-foot">
    <button type="button" class="linkish step-notes" :id="'step-notes-' + t.id" @mousedown.prevent @click="openStep(stepAt(t))">Notes, photos and asks ›</button>
  </div></template>
</div>
