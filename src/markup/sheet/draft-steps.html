<!-- Steps being written, a row each, for `which`, numbered after the steps there already (inline-add-box-plan, parts 5
     and 6). 'new', in New template, whose steps are sent together: a row written, and not being typed in, is its words
     as a row (draftIsRow): tapped, its box again; held, moved up or down; swiped left, its Delete (draftGesture,
     app/progress.js); nudged, the empty row is under it, to write the next there (nudgedDraft). 'add', under a
     template: one box at the foot, or under the step nudged (seatSub, app/sheet.js), and Enter, or its button, adds its
     step at once (addTemplateSteps). The row being typed in is quick add's box ('new:<key>', 'add:<key>': x-box), with
     its time chip and what quick add read under it. Its ⋯ (Move up, Move down, as Alt+↑ ↓) and × keep the keyboard up,
     the box being typed in keeping the focus (placeDraftRow, dropDraftRow). Enter in New template opens the next row;
     a pasted list makes a row a line (pasteDraft). -->
<template x-for="(st, k) in draftRows(which)" :key="st.key"><div class="draft-step" :class="{shown: draftIsRow(st, which)}" :data-key="st.key" x-data="{bw: which + ':' + st.key, more: false}">
  <div class="draft-line">
    <template x-for="d in [draft(which).info.get(st.key)]" :key="0"><span class="check step-n num" aria-hidden="true" x-text="d ? d.i + 1 : ''"></span></template>
    <button type="button" class="body draft-body" x-show="draftIsRow(st, which)" :aria-label="'Change step ' + (k + 1) + ': ' + st.text" @click="editDraftRow(which, st.key)"><span class="title" x-text="st.text"></span></button>
    <div class="step-box" x-show="!draftIsRow(st, which)"><div class="cap-field"><div class="cap-marks" aria-hidden="true" x-html="marksHtml(bw)"></div><textarea class="draft-in" rows="1" :id="which + '-step-' + k" x-model="st.text" :placeholder="which === 'add' ? 'Step' : k ? 'Next step' : 'e.g. Take the croissants out in 18 min'" :aria-label="'Step ' + (k + 1)"
           :enterkeyhint="which === 'add' ? 'send' : 'next'" x-box="bw" @paste="pasteDraft(which, $event, k)"
           @keydown.alt.up.prevent="placeDraftRow(which, k, k - 1)" @keydown.alt.down.prevent="placeDraftRow(which, k, k + 1)"></textarea></div></div>
    <template x-if="which === 'new' && !draftIsRow(st, which) && draftRows(which).length > 1"><button type="button" class="icon-btn" :aria-label="'More for step ' + (k + 1)" :aria-expanded="String(more)" @mousedown.prevent @click="more = !more"><svg class="i"><use href="#i-more"/></svg></button></template>
    <!-- Under a step of a template, the box's × takes it back to the foot; any other row's × takes the row out -->
    <template x-if="!draftIsRow(st, which) && (which === 'new' || draftRows(which).length > 1 || sheet.subAt != null)"><button type="button" class="icon-btn" :aria-label="which === 'add' && draftRows(which).length === 1 ? 'Add after the last step instead' : 'Remove: ' + (st.text || 'step ' + (k + 1))" @mousedown.prevent
      @click="which === 'add' && draftRows(which).length === 1 ? subHome() : dropDraftRow(which, k)"><svg class="i"><use href="#i-close"/></svg></button></template>
    <template x-if="which === 'add'"><button type="button" class="go" id="add-steps-go" :aria-label="draft('add').added.length > 1 ? 'Add ' + draft('add').added.length + ' steps' : 'Add step'" :disabled="sheet.subBusy || !draft('add').added.length || draft('add').problem" @mousedown.prevent @click="addTemplateSteps()"><svg class="i"><use href="#i-up"/></svg></button></template>
  </div>
  <!-- Moving it for a keyboard or a screen reader, as holding its row and moving it up or down does -->
  <template x-if="more && !draftIsRow(st, which)"><div class="menu step-menu draft-menu" role="menu">
    <button role="menuitem" :disabled="k === 0" @mousedown.prevent @click="more = false; placeDraftRow(which, k, k - 1)">Move up</button>
    <button role="menuitem" :disabled="k === draftRows(which).length - 1" @mousedown.prevent @click="more = false; placeDraftRow(which, k, k + 1)">Move down</button>
  </div></template>
  <template x-for="d in draftShown(draft(which).info.get(st.key))" :key="0">
    <!-- include markup/sheet/step-time.html -->
  </template>
  <div x-show="!draftIsRow(st, which)">
    <!-- include markup/sheet/box-chips.html -->
  </div>
</div></template>
