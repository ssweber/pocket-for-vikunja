<!-- One thing on Today (screens/lists.html), task `t` in Today's list `g`: its row (task-row.html), or, with open subtasks
     or steps, its card (app/cards.js). A card is a group named by its title, which is a heading that opens the task (no
     tick: it's closed in its sheet, or on Projects), with its due date, priority and project under it; then its strip,
     how to get round its steps: ‹, its task's line, a segment per subtask, the step showing marked on it, ›, and its
     count, "3 of 5", the step's place among all its subtasks, done ones too (a screen reader hears it on the step line
     instead). Drawn thin, its controls take taps 48px tall: the arrows, 48px wide, there with more than one open step
     (their places kept without, so the line doesn't stretch; they stay put as the step changes, so the one tapped keeps
     the focus), and an open step's segment, which shows that step (tapSegment; a pointer's shortcut, not a stop for
     each step). Then one line for a step, the shared row with the card's own options (c.g: paging, no Delete, no moving
     it), a plain row like any other.
     Deleted from its ⋯, a gap at its height with Restore, and a message about its task in its place, as a row's are. -->
<div class="item">
  <template x-if="!cardOf(t, g)">
    <!-- include markup/task-row.html -->
  </template>
  <template x-for="c in [cardOf(t, g)].filter(Boolean)" :key="0">
    <div class="day-card" role="group" :aria-label="rowTitle(t)" :data-id="t.id"
         :class="{leaving: !!leaving[t.id], deleted: leaving[t.id] === 'deleted', lined: !!lines[t.id], fresh: flashed.fresh.includes(t.id), 'came-due': flashed.due.includes(t.id), arrived: flashed.arrived.includes(t.id)}"
         @click.capture="if (leaving[t.id] === 'deleted') { $event.stopPropagation(); $event.preventDefault(); restoreRow(t.id) }">
      <button class="card-head" @click="openRow(t)"><span class="card-title" x-text="rowTitle(t)"></span>
        <span class="meta" x-show="cardMeta(t).length"><template x-for="m in cardMeta(t)" :key="m.key"><span :class="m.cls" :aria-label="m.label"><template x-if="m.color"><i class="dot" x-style="{background: m.color}"></i></template><template x-if="m.icon"><svg class="i"><use :href="'#i-' + m.icon"/></svg></template><template x-if="m.prio"><span class="bars" :class="'p' + m.prio"><i></i><i></i><i></i><i></i><i></i></span></template><span x-text="m.text"></span></span></template></span></button>
      <div class="card-strip">
        <template x-if="c.n > 1"><button class="pg prev" aria-label="Show the step before" @click="pageCard(c, -1)"><svg class="i"><use href="#i-chev"/></svg></button></template>
        <div class="card-track" :class="{'many-steps': c.line.many, jumps: c.n > 1 && !c.line.many}" x-style="{'--segs': c.line.segs, '--done': c.line.done, '--fill': c.line.fill, '--at': c.at}" @click="tapSegment(c, $event.clientX, $el.querySelector('.card-line'))">
          <div class="card-line" :class="{'many-steps': c.line.many}" role="img" :aria-label="c.lineText"></div><i class="card-mark" aria-hidden="true"></i></div>
        <template x-if="c.n > 1"><button class="pg next" aria-label="Show the step after" @click="pageCard(c, 1)"><svg class="i"><use href="#i-chev"/></svg></button></template>
        <template x-if="c.total > 1"><span class="card-n num" aria-hidden="true" x-text="(c.at + 1) + ' of ' + c.total"></span></template>
      </div>
      <template x-for="[t, g] in [[c.step, c.g]]" :key="t.id">
        <!-- include markup/task-row.html -->
      </template>
      <template x-for="line in lines[t.id] ? [lines[t.id]] : []" :key="0">
        <!-- include markup/row-line.html -->
      </template>
      <template x-if="leaving[t.id] === 'deleted'"><div class="del-gap"><span class="what">Deleted<span class="sr" x-text="': ' + t.title"></span></span><button class="claim restore" :aria-label="'Restore ' + t.title"><span class="me">Restore</span></button></div></template>
    </div>
  </template>
</div>
