<!-- One thing on Today (screens/lists.html), task `t` in Today's list `g`: its row (task-row.html), or, with open subtasks
     or steps, its card (app/cards.js). A card is a group named by its title, which is a heading that opens the task (no
     tick: it's closed in its sheet, or on Projects), on one line: its title (a run's without its day), its priority's bars and when it's due,
     short, its project too to a screen reader (cardHead, worked out once per card, as a row's slot is); then one line for a step, on one line as a row on Today is,
     its progress filling its segment of the strip and its tick, the shared row with the card's own options (c.g: no Delete, no moving it), a plain row like any other,
     swiped for its progress; then, as its footer, its strip (card-strip.html), how to get round its steps, the only way
     it pages. A plain swipe on the heading does nothing.
     Deleted from its ⋯, a gap at its height with Restore, and a message about its task in its place, as a row's are. -->
<div class="item">
  <template x-if="!cardOf(t, g)">
    <!-- include markup/task-row.html -->
  </template>
  <template x-for="[c, h] in [cardOf(t, g)].filter(Boolean).map(c => [c, cardHead(t, g)])" :key="0">
    <div class="day-card" role="group" :aria-label="h.title" :data-id="t.id"
         :class="{leaving: !!leaving[t.id], deleted: leaving[t.id] === 'deleted', lined: !!lines[t.id], fresh: flashed.fresh.includes(t.id), 'came-due': flashed.due.includes(t.id), arrived: flashed.arrived.includes(t.id)}"
         @click.capture="if (leaving[t.id] === 'deleted') { $event.stopPropagation(); $event.preventDefault(); restoreRow(t.id) }">
      <button class="card-head" @click="openRow(t)"><span class="card-title" x-text="h.title"></span><template x-if="h.said"><span class="sr" x-text="', ' + h.said"></span></template><template x-if="h.prio"><span class="bars" :class="'p' + h.prio" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span></template><template x-if="h.due"><span class="due num" :class="h.due.cls" aria-hidden="true" x-text="h.due.text"></span></template></button>
      <template x-for="[t, g] in [[c.step, c.g]]" :key="t.id">
        <!-- include markup/task-row.html -->
      </template>
      <!-- include markup/card-strip.html -->
      <template x-for="line in lines[t.id] ? [lines[t.id]] : []" :key="0">
        <!-- include markup/row-line.html -->
      </template>
      <template x-if="leaving[t.id] === 'deleted'"><div class="del-gap"><span class="what">Deleted<span class="sr" x-text="': ' + t.title"></span></span><button class="claim restore" :aria-label="'Restore ' + t.title"><span class="me">Restore</span></button></div></template>
    </div>
  </template>
</div>
