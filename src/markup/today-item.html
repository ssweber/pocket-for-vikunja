<!-- One thing on Today (screens/lists.html), task `t` in Today's list `g`: its row (task-row.html), or, with open subtasks
     or steps, its card (app/cards.js). A card is a group named by its title, which is a heading that opens the task (no
     tick: it's closed in its sheet, or on Projects), on one line: its title, its priority's bars and when it's due,
     short, its project too to a screen reader (cardWhen); then one line for a step, on one line as a row on Today is,
     with no bar of its own (its progress fills its segment of the strip), the shared row with the card's own options (c.g: no Delete, no moving it), a plain row like any other;
     then, as its footer, its strip, how to get round its steps: ‹, its task's line, a segment per subtask, each filled
     by whether its step is done, the step showing marked on it, ›, and its count, "3 of 5", the step's place among all
     its subtasks, done ones too (a screen reader hears it on the step line instead). The card pages on its strip only:
     dragged along it, the step under the finger (cardScrub, absolute, as a scrubber); a tap on an open step's segment
     (tapSegment; a pointer's shortcut, not a stop for each step); or its arrows, which stop at the first and last open
     step, dimmed there. Its controls take taps 48px tall, within the strip, clear of the step line's: the arrows, 48px
     wide, there with more than one open step (their places kept without, so the line doesn't stretch; they stay put as
     the step changes, so the one tapped keeps the focus). A plain swipe on the step line or the heading does nothing,
     as on any row on Today.
     Deleted from its ⋯, a gap at its height with Restore, and a message about its task in its place, as a row's are. -->
<div class="item">
  <template x-if="!cardOf(t, g)">
    <!-- include markup/task-row.html -->
  </template>
  <template x-for="c in [cardOf(t, g)].filter(Boolean)" :key="0">
    <div class="day-card" role="group" :aria-label="rowTitle(t)" :data-id="t.id"
         :class="{leaving: !!leaving[t.id], deleted: leaving[t.id] === 'deleted', lined: !!lines[t.id], fresh: flashed.fresh.includes(t.id), 'came-due': flashed.due.includes(t.id), arrived: flashed.arrived.includes(t.id)}"
         @click.capture="if (leaving[t.id] === 'deleted') { $event.stopPropagation(); $event.preventDefault(); restoreRow(t.id) }">
      <button class="card-head" @click="openRow(t)"><span class="card-title" x-text="rowTitle(t)"></span><template x-if="cardWhen(t).said"><span class="sr" x-text="', ' + cardWhen(t).said"></span></template><template x-if="cardWhen(t).prio"><span class="bars" :class="'p' + cardWhen(t).prio" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span></template><template x-if="cardWhen(t).due"><span class="due num" :class="cardWhen(t).due.cls" aria-hidden="true" x-text="cardWhen(t).due.text"></span></template></button>
      <template x-for="[t, g] in [[c.step, c.g]]" :key="t.id">
        <!-- include markup/task-row.html -->
      </template>
      <div class="card-strip">
        <template x-if="c.n > 1"><button class="pg prev" aria-label="Show the step before" :aria-disabled="String(c.i === 0)" @click="pageCard(c, -1)"><svg class="i"><use href="#i-chev"/></svg></button></template>
        <div class="card-track" :class="{'many-steps': c.line.many, jumps: c.n > 1 && !c.line.many}" x-style="{'--segs': c.line.segs, '--done': c.line.done, '--fill': c.line.fill, '--at': c.at}" @click="tapSegment(c, $event.clientX, $el.querySelector('.card-line'))">
          <div class="card-line" :class="{'many-steps': c.line.many}" role="img" :aria-label="c.lineText"></div><i class="card-mark" aria-hidden="true"></i></div>
        <template x-if="c.n > 1"><button class="pg next" aria-label="Show the step after" :aria-disabled="String(c.i === c.n - 1)" @click="pageCard(c, 1)"><svg class="i"><use href="#i-chev"/></svg></button></template>
        <template x-if="c.total > 1"><span class="card-n num" aria-hidden="true" x-text="(c.at + 1) + ' of ' + c.total"></span></template>
      </div>
      <template x-for="line in lines[t.id] ? [lines[t.id]] : []" :key="0">
        <!-- include markup/row-line.html -->
      </template>
      <template x-if="leaving[t.id] === 'deleted'"><div class="del-gap"><span class="what">Deleted<span class="sr" x-text="': ' + t.title"></span></span><button class="claim restore" :aria-label="'Restore ' + t.title"><span class="me">Restore</span></button></div></template>
    </div>
  </template>
</div>
