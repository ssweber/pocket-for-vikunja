<div id="scrim" :hidden="!sheet.open" :class="{show: sheet.show}" @click="closeSheet()" hidden></div>
<section id="sheet" x-ref="sheet" role="dialog" aria-modal="true" :aria-label="{account: 'Account', project: 'Project', runopts: 'Checklist', start: 'Start a checklist', newtpl: 'New template', newproj: 'New project', outbox: 'Waiting to send', complete: sheet.complete?.run ? 'Finish the checklist' : 'Complete subtasks'}[sheet.kind] || 'Task'" :hidden="!sheet.open" :class="{show: sheet.show}" hidden>
  <input id="focus-keeper" class="focus-keeper" aria-hidden="true" tabindex="-1" autocomplete="off">
  <div class="bar">
    <div class="bar-meta"><template x-if="sheet.kind === 'task' && sheet.task"><div class="bar-meta-in">
      <!-- The task's number in Vikunja, at the left, away from the grab handle, ⋯ and ×. A template, a checklist and a
           step show no number, because they are found by name. -->
      <template x-if="sheet.task.identifier && !checklistRole?.match(/template|tplstep|run|step/)"><span class="num task-id" id="d-id" x-text="sheet.task.identifier"></span></template>
    </div></template></div>
    <div class="grab"><i></i></div>
    <!-- Copies the progress text that Share as text in the ⋯ menu sends -->
    <template x-if="sheet.kind === 'task' && sheet.task"><button class="icon-btn" id="d-copy" aria-label="Copy progress" @click="copyProgress('task', 'sheet:top')"><svg class="i"><use href="#i-copy"/></svg></button></template>
    <!-- The ⋯ menu for the task as a whole. It can share the task's progress and open it in Vikunja. With write
         access it can also move the task to another project or up and down its list, turn a subtask into its own
         task, use the task as a checklist template, or delete it. -->
    <template x-if="sheet.kind === 'task' && sheet.task"><button class="icon-btn" id="d-more" aria-label="Task options" :aria-expanded="String(sheet.menu)" @click="sheet.menu = !sheet.menu"><svg class="i"><use href="#i-more"/></svg></button></template>
    <button class="icon-btn" id="btn-sheet-close" aria-label="Close" @click="closeSheet()"><svg class="i"><use href="#i-close"/></svg></button>
    <!-- Escape closes the menu before the sheet, wherever the focus is (escapeKey) -->
    <template x-if="sheet.menu && sheet.task"><div class="menu" id="d-menu" role="menu" x-init="$nextTick(() => $el.querySelector('[role=menuitem]')?.focus())" @click.outside="$event.target.closest('#d-more') || (sheet.menu = false)">
      <button role="menuitem" id="d-share-text" @click="sheet.menu = false; shareProgress('task')">Share as text</button>
      <!-- Not for a checklist opened as a task, which can only be shared as text (share.js) -->
      <template x-if="checklistRole !== 'run'"><button role="menuitem" id="d-copy-md" @click="sheet.menu = false; copyMarkdown('task')">Copy as a Markdown list</button></template>
      <a role="menuitem" id="d-open-vikunja" :href="vikunjaUrl('task')" target="_blank" rel="noopener" @click="sheet.menu = false">Open in Vikunja ↗</a>
      <!-- The task's subtasks move with it (moveTask). The select lies over the whole row, as a .prop.sel's does,
           because the phone can't open a select from code. -->
      <template x-if="canMove"><label id="d-move-to"><span>Move to another project</span>
        <template x-if="subtasks.length"><small x-text="subtasks.length === 1 ? 'Its subtask moves with it.' : 'Its subtasks move with it.'"></small></template>
        <select id="d-move-proj" @change="sheet.menu = false; moveTask(+$event.target.value, 'sheet:top')">
          <!-- include markup/sheet/project-options.html -->
        </select></label></template>
      <!-- Up one place and Down one place let keyboard and screen-reader users do what holding the row does. They
           don't say Move, which in Vikunja means moving to another project. -->
      <template x-for="m in canEdit && sheetMoves ? [sheetMoves] : []" :key="0"><div>
        <button role="menuitem" id="d-move-up" :disabled="!m.up" @click="moveBy(sheet.task, -1, 'own')"><span><span aria-hidden="true">↑</span> Up one place</span></button>
        <button role="menuitem" id="d-move-down" :disabled="!m.down" @click="moveBy(sheet.task, 1, 'own')"><span><span aria-hidden="true">↓</span> Down one place</span></button>
      </div></template>
      <!-- On a project's list, this moves the add box under the task's row to add a subtask, as nudging does -->
      <template x-if="canAddHere"><button role="menuitem" id="d-add-here" @click="sheet.menu = false; addSubtaskHere()">Add a subtask here</button></template>
      <!-- For a subtask. It becomes a separate task in the same project (ownTask). Not for a checklist's step or a
           template's step. -->
      <template x-if="canOwn"><button role="menuitem" id="d-own-task" @click="sheet.menu = false; ownTask()">Turn into its own task</button></template>
      <!-- Only the task's maker or a project admin can make it a template, since only they can change it then -->
      <template x-if="canEdit && checklistRole === 'candidate' && subtasks.length && ownsTemplate(sheet.task)"><button role="menuitem" id="d-make-template" :disabled="sheet.checklistBusy" @click="sheet.menu = false; makeTemplate()">
        <span>Use as checklist template</span><small>Its subtasks become the steps of every checklist started from it, in this order.</small></button></template>
      <template x-if="canEdit"><button role="menuitem" class="danger" id="d-delete" @click="sheet.menu = false; deleteTask()" x-text="deleteLabel"></button></template>
    </div></template>
  </div>
  <div class="scroll" id="sheet-body">
    <template x-for="line in placeLines('sheet:top')" :key="line.n">
      <!-- include markup/place-line.html -->
    </template>
    <!-- include markup/sheet/task.html -->
    <!-- include markup/sheet/checklist-options.html -->
    <!-- include markup/sheet/new-project.html -->
    <!-- include markup/sheet/new-template.html -->
    <!-- include markup/sheet/start.html -->
    <!-- include markup/sheet/account.html -->
    <!-- include markup/sheet/outbox.html -->
    <!-- include markup/sheet/complete.html -->
  </div>
</section>
