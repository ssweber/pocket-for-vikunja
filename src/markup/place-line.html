<!-- A message shown at a fixed place (`line`, from lines.js): under a list's heading, by the add box, in a sheet under
     what it is about, or on a checklist's step card. It says what happened and may have an action (Undo, Open, Try
     again). A screen reader reads it from #said. -->
<div class="place-line" :class="line.cls" :data-place="line.place"><span class="what" x-text="line.text"></span>
  <template x-if="line.action"><button class="line-act" @click="runPlaceAction(line)" x-text="line.action.label"></button></template></div>
