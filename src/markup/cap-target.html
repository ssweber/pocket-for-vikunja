<!-- Above the box on a run's screen (`target`, from capTarget in quickadd.js): the step a step goes after, the card's
     step or the last added from the box (runAim, runs.js), with no ×, as a step always goes after some step; and
     Repeat, a fresh copy of the card's step there, at once, with an Undo by the box (repeatCard). (On a project's
     list the box is in the list, under the row it adds after, and needs no line: seatBox, quickadd.js.) -->
<div class="cap-target" id="cap-target"><svg class="i"><use href="#i-checklist"/></svg>
  <span class="what">Add a step after “<b x-text="target.after"></b>”</span>
  <button type="button" class="rep" id="btn-repeat" :disabled="!target.canRepeat" :aria-label="'Repeat “' + target.repeat + '”'"
    :title="target.canRepeat ? 'A fresh copy of “' + target.repeat + '”, not done, after “' + target.after + '”' : 'It can be repeated once it\'s sent'"
    @mousedown.prevent @click="repeatCard()"><svg class="i"><use href="#i-repeat"/></svg><span>Repeat</span></button></div>
