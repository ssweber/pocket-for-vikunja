<!-- A task's row in a list, `t`, at its depth under the task above it (`g.depth`): Today, a project, search, and a run's row
     under Checklists, so a run looks the same, with its progress line, wherever it's listed. -->
<div class="row" :class="{done: t.done, pending: t.pending, fresh: fresh.includes(t.id), sub: g.depth[t.id], 'cl-run': isRunTask(t)}" :data-id="t.id" :style="{'--pct': t.done ? 0 : shownPct(t) / 100, '--depth': Math.min(g.depth[t.id], 3)}">
  <template x-if="canTick(t)"><button class="check" :class="'p' + (t.priority || 0) + (t.pending ? ' wait' : '')" :disabled="!!t.pending" :aria-label="(t.done ? 'Mark not done: ' : 'Mark done: ') + t.title" @click="toggleDone(t, $el.closest('.row'))"><svg class="i"><use href="#i-check"/></svg></button></template>
  <!-- A run is worked through, and finished, on its own screen; a template is never ticked -->
  <template x-if="!canTick(t)"><span class="check no-tick" :class="{ro: !canWrite(t.project_id)}" aria-hidden="true" :title="canWrite(t.project_id) ? null : 'Shared with you to read only'"><template x-if="canWrite(t.project_id)"><svg class="i"><use href="#i-checklist"/></svg></template></span></template>
  <button class="body" @click="t.pending || openRow(t)">
    <div class="title"><template x-if="t.pending"><span class="sr">Not sent yet: </span></template><template x-if="g.depth[t.id]"><span class="sr">Subtask: </span></template><span x-text="rowTitle(t)"></span><template x-if="!t.done && shownPct(t)"><span class="sr" x-text="', progress ' + shownPct(t) + '%'"></span></template></div>
    <div class="meta" x-show="rowMeta(t).length">
      <template x-for="m in rowMeta(t)" :key="m.key"><span :class="m.cls" :aria-label="m.label"><template x-if="m.color"><i class="dot" :style="{background: m.color}"></i></template><template x-if="m.icon"><svg class="i"><use :href="'#i-' + m.icon"/></svg></template><template x-if="m.prio"><span class="bars" :class="'p' + m.prio"><i></i><i></i><i></i><i></i><i></i></span></template><span x-text="m.text"></span></span></template>
    </div>
  </button>
  <template x-if="t.pending"><button class="icon-btn plain" :aria-label="'Cancel ' + t.title + (t.index === 0 && pendingNested(t.entry) ? ': the lines under it become tasks of their own' : '')" @click="cancelPending(t.entry, t.index)"><svg class="i"><use href="#i-close"/></svg></button></template>
</div>
