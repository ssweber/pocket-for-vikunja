<!-- The row for task `t` in every list. It is included wherever a task, a subtask, a checklist or a step is drawn.
     `g` holds the options of the list the row is in, and decides what the row shows: g.sheet (a subtask in its
     parent's sheet), g.own (the task's own row at the top of its sheet), g.top (a checklist's own row at the top of
     its screen), g.run (a step on a checklist's screen), g.step (a template's step in its sheet), g.card (a row on a
     stacked card) and g.depth (a subtask's depth).

     The gesture code cannot reach `g`, so the row writes the gestures it allows into data-gestures (rowGestures).
     The Delete layer is not in the row. It is drawn under the row when a swipe starts (swipeOf, progress.js).

     A ticked or deleted row stays in place until the batch clears (leaving[t.id], leaving.js). A deleted row
     becomes a gap with Restore (gap.html). A parent (a checklist, or a task with open subtasks on a card) has a ring
     in place of a tick and no progress of its own (ring.html). A full swipe right does what tapping the ring does.
     The rows of a finished checklist, or of one shared read only (g.locked), have no tick. -->
<!-- A collapsed card's top row (.step-line) doesn't fold with the batch. The next row slides up into its place
     (cardEntered). -->
<div class="row" :class="g.run ? {done: t.done, current: t.i === g.at} : g.step ? {step: true, editing: sheet.stepEdit?.id === t.id} : g.own || g.top ? {done: t.done, own: true} : {done: t.done, leaving: !!leaving[t.id], deleted: leaving[t.id] === 'deleted', pending: t.pending, waits: t.waits, fresh: !g.sheet && flashed.fresh[t.id], 'came-due': !g.sheet && flashed.due[t.id], arrived: !g.sheet && flashed.arrived[t.id], sub: g.depth[t.id], 'cl-run': isRunTask(t), lined: !!lines[t.id], aimed: !g.sheet && lit[t.id] && capW === 'under', 'step-line': !!g.card && !g.card.open && g.card.step.id === t.id, 'one-line': !!g.line}" :data-id="t.id" :data-gestures="rowGestures(g)"
     x-style="g.run ? {'--pct': t.done ? 0 : t.pct / 100} : {'--pct': t.done ? 0 : shownPct(t) / 100, '--depth': Math.min(g.depth[t.id] || 0, 3)}"
     x-effect="!g.sheet && !g.run && !g.own && !g.top && lit[t.id] && watchCursor($el)" x-init="g.card && cardEntered($el, g.card, t)"
     @click.capture="tapGap(t, g, $event)" @contextmenu="rowMenu(t, $event)" @keydown.shift.f10="rowMenu(t, $event)"
     @keydown.alt.up="rowBox(t, g, -1, $event)" @keydown.alt.down="rowBox(t, g, 1, $event)">
  <!-- A parent has a ring, not a tick (rowRing) -->
  <template x-for="r in [rowRing(t, g)].filter(Boolean)" :key="0">
    <!-- include markup/ring.html -->
  </template>
  <!-- A template's step (g.step) shows its number where a tick would be. A square box would suggest the step can be
       ticked, and a template's can't. This part and the editor below are only in the sheet's copy of the row
       (scripts/build.mjs), so the rows in other lists don't evaluate them. -->
  <!-- only step -->
  <template x-if="g.step"><span class="check step-n num" aria-hidden="true" x-text="stepNo(t)"></span></template>
  <!-- /only -->
  <template x-if="!g.top && !g.step && (g.run || g.sheet || canTick(t)) && !rowRing(t, g)"><button class="check" :class="g.run ? {wait: t.slow, skip: t.skipped, sq: true} : {wait: t.waits, sq: isStepRow(t, g)}" :disabled="g.run ? g.locked : !!t.pending" :aria-label="(t.done ? 'Mark not done: ' : 'Mark done: ') + t.title" @click="tickRow(t, g, $el.closest('.row'))"><svg class="i"><use :href="t.skipped ? '#i-skip' : '#i-check'"/></svg></button></template>
  <!-- A checklist is ticked and finished on its own screen, and a template is never ticked. Neither has a tick. -->
  <template x-if="!g.run && !g.sheet && !g.top && !canTick(t) && !rowRing(t, g)"><span class="check no-tick" :class="{ro: !canWrite(t.project_id)}" aria-hidden="true" :title="canWrite(t.project_id) ? null : 'Read only'"><template x-if="canWrite(t.project_id)"><svg class="i"><use href="#i-checklist"/></svg></template></span></template>
  <!-- Alt+↑ and Alt+↓ move the add box through the rows. Holding a row reorders it. -->
  <!-- On the sheet's own row, tapping the title replaces the body with a text box until it loses focus (saveTitle) -->
  <template x-if="g.own && sheet.titleEdit"><div class="body title-in"><textarea id="d-title" rows="1" aria-label="Title" enterkeyhint="done" x-model="sheet.title"
    x-init="$nextTick(() => { grow($el); $el.focus(); $el.setSelectionRange($el.value.length, $el.value.length); })" x-grow="sheet.title"
    @keydown.enter.prevent="$el.blur()" @keydown.escape.stop="sheet.title = rowTitle(t); $el.blur()" @blur="saveTitle(); sheet.titleEdit = false"></textarea></div></template>
  <!-- Tapping a template's step replaces its text with a quick-add box until it loses focus (editStep) -->
  <!-- only step -->
  <template x-if="g.step && sheet.stepEdit?.id === t.id">
    <!-- include markup/sheet/step-edit.html -->
  </template>
  <!-- /only -->
  <button class="body" x-show="g.step ? sheet.stepEdit?.id !== t.id : !g.own || !sheet.titleEdit" @click="tapRow(t, g)">
    <template x-if="g.sheet || g.run"><div class="title" x-text="g.step ? stepShown(t).title : t.title"></div></template>
    <!-- On a one-line row (g.line), rowWhen gives what is shown at the right of the title. It is calculated once per
         row, like the slot. -->
    <template x-for="w in !g.sheet && !g.run ? [g.line ? rowWhen(t, g) : null] : []" :key="0"><div class="title-line"><div class="title"><template x-if="t.pending"><span class="sr">Not sent yet: </span></template><template x-if="g.depth[t.id]"><span class="sr">Subtask: </span></template><span x-text="rowTitle(t)"></span><template x-if="!t.done && shownPct(t) && !rowRing(t, g)"><span class="sr" x-text="', progress ' + shownPct(t) + '%'"></span></template><template x-if="w?.said"><span class="sr" x-text="', ' + w.said"></span></template><template x-if="g.own && canEdit"><span class="sr">, tap to change the title</span></template></div>
      <!-- At the right of a one-line row's title: small priority bars, the short due date and the project's dot. A
           card's row has no dot, since the card's header has one, unless the row is in another project. With none of
           the three, nothing is drawn and the title gets the space. -->
      <template x-if="w && (w.prio || w.due || w.color)"><span class="when" aria-hidden="true"><template x-if="w.prio"><span class="bars" :class="'p' + w.prio"><i></i><i></i><i></i><i></i><i></i></span></template><template x-if="w.due"><span class="due num" :class="w.due.cls" x-text="w.due.text"></span></template><template x-if="w.color"><i class="dot" x-style="{background: w.color}"></i></template></span></template></div></template>
    <template x-if="!g.line"><div class="meta" x-show="rowMeta(t, g).length">
      <template x-for="m in rowMeta(t, g)" :key="m.key"><span :class="m.cls" :aria-label="m.label"><template x-if="m.color"><i class="dot" x-style="{background: m.color}"></i></template><template x-if="m.icon"><svg class="i"><use :href="'#i-' + m.icon"/></svg></template><template x-if="m.prio"><span class="bars" :class="'p' + m.prio"><i></i><i></i><i></i><i></i><i></i></span></template><span x-text="m.text"></span></span></template>
    </div></template>
    <!-- A step added after the checklist started shows its Added mark on a separate line in the checklist's sheet -->
    <template x-if="g.sheet && checklistRole === 'run' && addedText(t.description)"><div class="meta"><span x-text="addedText(t.description)"></span></div></template>
    <!-- The swipe hint appears once, on the first open row of a screen where a swipe sets progress (pickHint). A swipe
         or a tap on it fades it out. Its space stays while the user may be touching the list, then closes
         (closeHint). A screen reader reads it when the screen opens. -->
    <template x-if="hintOn(t, g)"><span class="slide-hint" :class="{gone: hint.done || !rowSlides(t)}" aria-hidden="true" @click.stop.prevent="hintSeen()">Swipe right to start working on it<svg class="i"><use href="#i-close"/></svg></span></template>
  </button>
  <!-- A done step shows who did it, with ✓ on their picture (⏭ for a skip), and who else it is assigned to -->
  <template x-if="g.run && t.done && t.slot"><span class="did" :class="{waiting: t.slow, skip: t.skipped}" role="img" :aria-label="t.whoText"><template x-for="slot in [t.slot]" :key="0"><span class="pics">
    <!-- include markup/pics.html -->
  </span></template></span></template>
  <template x-for="slot in [rowSlot(t, g)].filter(Boolean)" :key="0">
    <!-- include markup/claim-slot.html -->
  </template>
  <!-- include markup/gap.html -->
  <!-- An inserted step that is on the card and not done can be deleted with ×, because it is likely a mistake.
       Swiping left deletes it too (stepSlide). -->
  <template x-if="g.run && t.added && !t.done && t.i === g.at && !g.locked"><button class="icon-btn plain step-del" id="step-delete" :aria-label="'Delete this step: ' + t.title" @click="deleteAddedStep(t)"><svg class="i"><use href="#i-close"/></svg></button></template>
  <template x-if="!g.run && t.pending"><button class="icon-btn plain" :aria-label="cancelLabel(t)" @click="cancelPending(t.entry, t.index)"><svg class="i"><use href="#i-close"/></svg></button></template>
  <template x-for="line in !g.run && !g.own && !g.top && lines[t.id] ? [lines[t.id]] : []" :key="0">
    <!-- include markup/row-line.html -->
  </template>
</div>
