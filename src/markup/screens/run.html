    <!-- A run: the step it's on, the list of steps, notes, and the notes from the last run of the same template -->
    <template x-if="!view.loading && !view.error && route.name === 'run' && runView"><div id="run">
      <p class="run-for" id="run-for" x-text="runView.forText"></p>
      <template x-if="!canWrite(view.run.run.project_id)"><p class="ro-note" id="run-readonly">This run's project is shared with you to read only: you can follow it, but not tick its steps or add notes. Ask its owner for write access.</p></template>
      <div class="run-bar"><span class="track"><i :style="{'--pct': runView.total ? runView.doneCount / runView.total : 0}"></i></span><span class="num" id="run-count" x-text="runView.doneCount + ' of ' + runView.total + ' done'"></span></div>

      <template x-if="runView.finished"><div class="card finish-card"><h3>Finished</h3><p class="note" style="margin:0" x-text="runView.summary"></p></div></template>
      <template x-if="!runView.finished && runView.allDone"><div class="card finish-card" id="finish-card">
        <h3>All steps done</h3><p class="note" style="margin:0" x-text="runView.summary"></p>
        <button class="btn block" id="run-finish" style="margin-top:14px" @click="finishRun()">Finish run</button>
      </div></template>

      <!-- Countdowns running for other steps than the one shown, so none is missed -->
      <template x-if="runView.timers.length"><div class="card" id="run-timers">
        <template x-for="s in runView.timers" :key="s.id"><button class="timer" @click="showStep(s.i, true)"><span class="t" x-text="s.title"></span><span class="num" :class="{late: s.late}" x-text="s.countText"></span></button></template>
      </div></template>

      <template x-if="runView.step"><div class="card step-card" id="step-card" :data-id="runView.step.id">
        <div class="step-head">
          <button class="icon-btn plain" id="step-prev" aria-label="Previous step" :disabled="runView.at === 0" @click="showStep(runView.at - 1)"><svg class="i"><use href="#i-back"/></svg></button>
          <span class="step-no num" x-text="'Step ' + (runView.at + 1) + ' of ' + runView.total"></span>
          <button class="icon-btn plain" id="step-next" aria-label="Next step" :disabled="runView.at >= runView.total - 1" @click="showStep(runView.at + 1)"><svg class="i"><use href="#i-chev"/></svg></button>
        </div>
        <h3 id="step-title" x-text="runView.step.title"></h3>
        <template x-if="runView.step.added"><div class="step-added" id="step-added" x-text="runView.step.added + (runView.step.pending ? ' · waiting to send' : '')"></div></template>
        <template x-if="runView.step.dueText"><div class="step-due num" :class="{late: runView.step.late}" x-text="runView.step.dueText"></div></template>
        <template x-if="runView.step.description"><div class="desc" x-html="sanitize(runView.step.description)"></div></template>
        <template x-if="runView.step.done"><div class="step-who" id="step-who" :class="{waiting: runView.step.waiting}" x-text="runView.step.whoText"></div></template>
        <div class="step-acts" x-show="!runView.finished && canWrite(view.run.run.project_id)">
          <template x-if="!runView.step.done"><button class="btn go-on" id="step-done" @click="tickStep(runView.step, 'done')"><svg class="i"><use href="#i-check"/></svg><span x-text="(runDrafts[runView.step.id] || '').trim() ? 'Done, with the note' : 'Done'"></span></button></template>
          <template x-if="!runView.step.done"><button class="btn ghost" id="step-skip" @click="tickStep(runView.step, 'skip')" x-text="(runDrafts[runView.step.id] || '').trim() ? 'Skip with the note' : 'Skip'"></button></template>
          <template x-if="runView.step.done"><button class="btn ghost go-on" id="step-undo" @click="tickStep(runView.step, 'undone')">Not done</button></template>
        </div>
        <!-- Photos and notes for this step: photos wait on the phone without a connection, as everywhere in Pocket -->
        <div class="step-extra" id="step-extra">
          <template x-for="a in runView.step.attachments || []" :key="a.id">
            <button class="att" @click="openAttachment(a, runView.step.id)"><svg class="i"><use href="#i-clip"/></svg><span class="nm" x-text="a.file?.name || 'file'"></span><span class="sz num" x-text="fmtSize(a.file?.size)"></span></button>
          </template>
          <template x-for="f in waitingByTask.get(runView.step.id) || []" :key="f.key">
            <div class="att uploading"><svg class="i"><use href="#i-clip"/></svg><span class="nm" x-text="f.name"></span><span class="sz" x-text="offline ? 'Waiting for a connection' : f.trouble ? 'Vikunja had a problem with it. Trying again.' : 'Uploading…'"></span></div>
          </template>
          <template x-if="attachmentsOn && !runView.step.pending"><label class="att add-att">
            <svg class="i"><use href="#i-camera"/></svg><span class="nm">Add a photo</span>
            <input type="file" id="step-file" class="sr" accept="image/*" multiple aria-label="Add a photo to this step" @change="addFiles($event.target.files, runView.step); $event.target.value = ''">
          </label></template>
          <template x-for="c in runView.step.notes" :key="c.id">
            <div class="comment"><div class="who"><b x-text="c.author"></b> · <span class="num" x-text="c.when"></span></div><div class="desc" style="padding:0" x-html="sanitize(c.comment)"></div></div>
          </template>
          <form class="comment-form" id="step-note-form" x-show="canWrite(view.run.run.project_id)" @submit.prevent="addNote(runView.step.id)">
            <textarea id="step-note" rows="1" placeholder="Note on this step" aria-label="Note on this step" x-model="runDrafts[runView.step.id]"
                      x-effect="runDrafts[runView.step.id]; $nextTick(() => grow($el))"></textarea>
            <button class="go btn" style="width:44px;padding:0" aria-label="Save note" @mousedown.prevent><svg class="i"><use href="#i-up"/></svg></button>
          </form>
        </div>
      </div></template>

      <div class="h3">Steps</div>
      <div class="list" id="run-steps">
        <template x-for="(s, i) in runView.steps" :key="s.id"><div class="row" :class="{done: s.done, current: i === runView.at, 'ins-on': runView.insert?.at === i}" :data-id="s.id" :style="{order: i * 2, '--pct': s.done ? 0 : s.pct / 100}">
          <!-- › opens the box under this step, to insert a step after it or repeat it -->
          <template x-if="!runView.finished && canWrite(view.run.run.project_id)"><button class="ins-open" :aria-expanded="String(runView.insert?.at === i)" :aria-label="'Insert a step after “' + s.title + '”'" @click="openInsert(s)"><svg class="i"><use href="#i-chev"/></svg></button></template>
          <button class="check" :class="{wait: s.waiting, skip: s.skipped}" :disabled="runView.finished || !canWrite(view.run.run.project_id)" :aria-label="(s.done ? 'Mark not done: ' : 'Mark done: ') + s.title" @click="tickStep(s, s.done ? 'undone' : 'done')"><svg class="i"><use :href="s.skipped ? '#i-send' : '#i-check'"/></svg></button>
          <button class="body" @click="showStep(i, true)"><div class="title" x-text="s.title"></div>
            <div class="meta" x-show="(s.dueText && !s.done) || s.added"><template x-if="s.added"><span class="added" x-text="s.added"></span></template>
              <template x-if="s.dueText && !s.done"><span class="due num" :class="{overdue: s.late}" x-text="s.dueText"></span></template></div></button>
          <!-- Done: who did it, ✓ on their picture (⏭ for a skip), and who else it's assigned to -->
          <template x-if="s.done && s.slot"><span class="did" :class="{waiting: s.waiting, skip: s.skipped}" role="img" :aria-label="s.whoText"><template x-for="slot in [s.slot]" :key="0"><span class="pics">
            <!-- include markup/pics.html -->
          </span></template></span></template>
          <!-- Not done: who's doing it; "+ me" claims it, your picture lets it go -->
          <template x-if="!s.done && s.slot"><button class="claim" :class="{free: !s.slot.users.length, mine: s.slot.mine}" :aria-disabled="!s.slot.can" :aria-label="s.slot.label" @click="toggleClaim(s, s.slot, view.run.run.id)">
            <template x-if="!s.slot.users.length"><span class="me">+ me</span></template><template x-for="slot in [s.slot]" :key="0"><span class="pics">
              <!-- include markup/pics.html -->
            </span></template></button></template>
          <!-- A step added during the run, on screen and not done: likely a mistake, so it can go -->
          <template x-if="s.added && !s.done && i === runView.at && !runView.finished && canWrite(view.run.run.project_id)"><button class="icon-btn plain step-del" id="step-delete" :aria-label="'Delete this step: ' + s.title" @click="deleteAddedStep(s)"><svg class="i"><use href="#i-close"/></svg></button></template>
        </div></template>
        <!-- The box under the step whose › was tapped, for a step the template didn't have: 🔁 puts that step in the box, to do
             again; + adds what's in the box after it. Last in the page, put in its place by order, so it isn't a row. -->
        <template x-if="runView.insert && !runView.finished && canWrite(view.run.run.project_id)"><div class="step-gap" id="step-gap" :style="{order: runView.insert.at * 2 + 1}">
          <p class="gap-where" id="step-gap-where" x-text="'After “' + runView.insert.after.title + '”'"></p>
          <div class="addbox sub" id="step-insbox">
            <form id="step-insert-form" autocomplete="off" @submit.prevent="insertStep()">
              <div class="cap-field">
                <div class="cap-marks" aria-hidden="true" x-html="marksHtml('ins')"></div>
                <textarea id="step-insert-in" x-model="runInsert.text" rows="1" placeholder="Insert a step, or paste a list" :aria-label="'Steps to insert after “' + runView.insert.after.title + '”'" enterkeyhint="send"
                          x-effect="runInsert.text; $nextTick(() => grow($el))"
                          @keydown.enter="if (!$event.shiftKey && !$event.isComposing) { $event.preventDefault(); boxEnter('ins'); }" @keydown.escape.stop="closeInsert()"
                          @input="runInsert.caret = $el.selectionStart; if (runInsert.repeat && runInsert.text !== runInsert.repeat.title) runInsert.repeat = null"
                          @click="runInsert.caret = $el.selectionStart" @keyup="runInsert.caret = $el.selectionStart"
                          @scroll="$el.previousElementSibling.scrollTop = $el.scrollTop"
                          @focus="runInsert.focus = true; loadPeople()" @blur="setTimeout(() => runInsert.focus = document.activeElement === $el, 150)"></textarea>
              </div>
              <template x-if="runView.insert.repeatable"><button type="button" class="rep" id="step-repeat" :class="{on: runInsert.repeat}" :aria-pressed="String(!!runInsert.repeat)"
                :aria-label="'Repeat “' + runView.insert.repeatable.title + '”: put it in the box'" @mousedown.prevent @click="armRepeat(runView.insert.repeatable)"><svg class="i"><use href="#i-repeat"/></svg></button></template>
              <button class="go" type="submit" id="step-insert" :aria-label="runInsert.repeat ? 'Repeat the step' : 'Insert the steps'" @mousedown.prevent :disabled="runInsert.busy || !boxParsedLines('ins').some(p => p.title)"><svg class="i"><use href="#i-plus"/></svg></button>
            </form>
            <template x-if="runInsert.repeat"><p class="gap-note" id="step-repeat-note">A fresh copy of that step, not done. Change the words to insert a new step instead.</p></template>
            <div class="chips" id="step-inschips" :hidden="!chips('ins').length">
              <template x-for="c in chips('ins')" :key="c.key"><button type="button" class="chip" :class="(c.cls || '') + (c.kind ? ' tap' : '') + (c.off ? ' off' : '')" :data-kind="c.kind || null" :aria-pressed="c.pressed === undefined ? null : String(c.pressed)"
                :tabindex="c.kind ? 0 : -1" :title="c.hint || (c.kind ? (c.off ? 'Tap to use this' : 'Tap to keep these words in the title') : null)"
                @mousedown.prevent @click="tapChip('ins', c)"><template x-if="c.color"><i class="dot" :style="{background: c.color}"></i></template><template x-if="c.icon"><svg class="i"><use :href="'#i-' + c.icon"/></svg></template><span x-text="c.text"></span></button></template>
            </div>
          </div>
        </div></template>
      </div>

      <div class="h3">Notes on this run</div>
      <div class="card" id="run-notes">
        <template x-for="c in runView.notes" :key="c.id">
          <div class="comment"><div class="who"><b x-text="c.author"></b> · <span class="num" x-text="c.when"></span></div><div class="desc" style="padding:0" x-html="sanitize(c.comment)"></div></div>
        </template>
        <form class="comment-form" id="run-note-form" x-show="canWrite(view.run.run.project_id)" @submit.prevent="addNote(view.run.run.id)">
          <textarea id="run-note" rows="1" placeholder="Note for this run, and the next one" aria-label="Note on this run" x-model="runDrafts[view.run.run.id]"
                    x-effect="runDrafts[view.run.run.id]; $nextTick(() => grow($el))"></textarea>
          <button class="go btn" style="width:44px;padding:0" aria-label="Save note" @mousedown.prevent><svg class="i"><use href="#i-up"/></svg></button>
        </form>
      </div>

      <!-- What was noted on the last finished run of this template, as a handover -->
      <template x-if="view.run.last"><div>
        <div class="h3">Last time<button class="n linkish" id="run-last-open" @click="openRun(view.run.last.id)" x-text="view.run.last.title"></button></div>
        <div class="card" id="run-last">
          <template x-if="!view.run.last.notes"><div class="loading" style="padding:16px">Loading…</div></template>
          <template x-for="c in view.run.last.notes || []" :key="c.id">
            <div class="comment"><div class="who"><b x-text="c.step"></b> · <span x-text="c.author"></span> · <span class="num" x-text="c.when"></span></div><div class="desc" style="padding:0" x-html="sanitize(c.comment)"></div></div>
          </template>
          <template x-if="view.run.last.notes && !view.run.last.notes.length"><p class="note" style="padding:12px 14px;margin:0">No notes were left last time.</p></template>
        </div>
      </div></template>
    </div></template>
