    <!-- Checklists: each checklist project's templates, to start a run from, and its runs in progress -->
    <template x-if="!view.loading && !view.error && route.name === 'checklists'"><div id="checklists">
      <template x-if="!view.checklists.length"><div class="card cl-card setup-card" id="setup-checklists">
        <p><b>Checklists</b> are step-by-step lists people run again and again, like opening up or a weekly clean: each run is ticked off step by step, with who did what.</p>
        <button class="btn block" id="btn-setup-checklists" :disabled="settingUp" @click="setUpChecklists()" x-text="settingUp ? 'Setting up…' : 'Set up checklists'"></button>
        <p class="note" style="margin:8px 0 0">Makes a project called Checklists, with an example template to try. Or use a project of yours: its ⋯ has Use for checklists.</p>
      </div></template>
      <template x-for="cl in view.checklists" :key="cl.project.id"><div class="cl" :data-project="cl.project.id">
        <div class="sec"><span x-text="cl.project.title"></span><a class="sec-act" :href="'#/project/' + cl.project.id">Open project</a></div>
        <!-- For its owner, until hidden: what tripped everyone setting one up (docs/design/checklist-setup-plan.md) -->
        <template x-if="gettingStarted(cl.project.id)"><div class="card getting-started" :id="'getting-started-' + cl.project.id">
          <h3>Getting started</h3>
          <ol>
            <li><b>Share with your team.</b> In Vikunja, give them <i>Read &amp; write</i> so they can check off steps.
              <a class="gs-act" :href="shareUrl(cl.project.id)" target="_blank" rel="noopener">Share it in Vikunja ↗</a></li>
            <li><b>Create a checklist template.</b> One step per line. “@priya” assigns a step; “in 18 min” sets it due 18 minutes after the step before.
              <button type="button" class="linkish gs-act" @click="openNewTemplate(cl.project)">New template</button></li>
            <li><b>Make it recurring (optional).</b> Set a date and choose <i>Repeats</i>. It'll appear on Today when due.</li>
          </ol>
          <button type="button" class="linkish gs-hide" @click="hideGettingStarted(cl.project.id)">Hide this</button>
        </div></template>
        <div class="list">
          <template x-for="t in cl.templates" :key="t.id"><div class="row cl-tpl" :data-id="t.id">
            <button class="body" @click="openTask(t.id)"><svg class="i" style="color:var(--muted)"><use href="#i-checklist"/></svg>
              <div class="t"><div class="title" x-text="t.title"></div><div class="meta num"><span x-text="t.steps + (t.steps === 1 ? ' step' : ' steps')"></span><template x-if="scheduleText(t)"><span class="cl-when" x-text="scheduleText(t)"></span></template></div></div></button>
            <template x-if="canWrite(cl.project.id)"><button class="btn cl-start" :aria-label="'Start ' + t.title" @click="openStart(t.id)">Start</button></template>
          </div></template>
          <template x-if="!cl.templates.length"><p class="cl-hint">No templates here yet: a template is the checklist each run is copied from.</p></template>
          <template x-if="!canWrite(cl.project.id)"><p class="cl-hint">Shared with you to read only: you can see its runs, but not start or work on them.</p></template>
          <div class="row cl-new" x-show="canWrite(cl.project.id)"><button class="body" @click="openNewTemplate(cl.project)"><svg class="i"><use href="#i-plus"/></svg><span class="title">New template</span></button></div>
        </div>
        <template x-if="cl.runs.length || startingIn(cl.project.id).length"><div>
          <div class="cl-sub">In progress</div>
          <div class="list">
            <template x-for="e in startingIn(cl.project.id)" :key="e.id"><div class="row pending"><div class="body"><div class="title" x-text="'Starting ' + (e.name ? runTitle(e.template.title, e.name, new Date(e.at)) : e.template.title)"></div>
              <div class="meta"><span x-text="offline ? 'Waiting for a connection' : 'Setting up…'"></span><span x-text="forText({assignees: e.for})"></span></div></div>
              <button class="icon-btn plain" :aria-label="'Don\'t start ' + e.template.title" @click="cancelStart(e.id)"><svg class="i"><use href="#i-close"/></svg></button></div></template>
            <!-- The same row as on Today: its steps done, the next, its progress line -->
            <template x-for="g in [{depth: {}}]" :key="0"><template x-for="t in cl.runs" :key="t.id">
              <!-- include markup/task-row.html -->
            </template></template>
          </div>
        </div></template>
        <!-- The last few runs finished, to look back at, or reopen from their ⋯ -->
        <template x-if="cl.finished?.length"><div>
          <div class="cl-sub">Finished lately</div>
          <div class="list">
            <template x-for="r in cl.finished" :key="r.id"><div class="row cl-done" :data-id="r.id">
              <button class="body" @click="openRun(r.id)"><div class="title" x-text="r.title"></div>
                <div class="meta"><span class="num" x-text="'Finished ' + new Date(r.done_at).toLocaleString([], {weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'})"></span><template x-if="r.forText"><span x-text="r.forText"></span></template></div></button>
              <svg class="i chev" style="align-self:center;color:var(--muted)"><use href="#i-chev"/></svg>
            </div></template>
          </div>
        </div></template>
      </div></template>
    </div></template>
