    <!-- Today, a project and search share this markup. A project's done tasks are a separate section under the open
         ones. It is folded until tapped, and its tasks load then. Each project remembers whether its section is open.
         A long list's rows are drawn in batches, the first screenful first (drawn, views.js). -->
    <template x-if="!view.loading && !view.error && ['today', 'project', 'search'].includes(route.name)"><div x-effect="hint.pick && pickHint()">
      <!-- Today's project chips (todayChips), on one line. Tapping a chip shows only the user's own tasks from its
           project (todayShows), and the user's picture in place of the project's dot says so. -->
      <template x-if="todayChips.length"><div class="today-chips" role="group" aria-label="Projects on Today"><template x-for="c in todayChips" :key="c.id"><button type="button" class="chip tap" :class="{'only-mine': c.off}" :aria-pressed="String(c.off)" :aria-label="c.title + ', only your tasks'" @click="toggleTodayProject(c.id)"><template x-if="!c.off"><i class="dot" x-style="{background: colorOf(c.hex_color)}"></i></template><template x-if="c.off"><span class="pic mine"><span class="av"><span x-text="initials(user)"></span><img x-show="avatarUrl(user)" :src="avatarUrl(user)" alt=""></span></span></template><span class="t" x-text="c.title"></span></button></template></div></template>
      <!-- While Today is narrowed to a label (narrowToday), the bar above its first group says so, and Show all ends it -->
      <template x-if="route.name === 'today' && only"><div class="only-bar"><span class="only-rule">Only <span class="lab-pill" x-style="{'--lc': colorOf(only.hex_color)}"><i class="dot"></i><span x-text="'*' + only.title"></span></span></span><button type="button" class="only-clear" id="btn-show-all" @click="narrowToday(null)">Show all</button></div></template>
      <template x-for="g in shownGroups.filter(g => g.tasks.length || (g.fold && g.count !== 0) || placeLines(g.key).length)" :key="g.key"><div>
        <!-- When no tasks are open, the empty message is shown above the Done section -->
        <template x-if="g.fold && !listGroups.some(x => !x.fold && x.tasks.length)">
          <!-- include markup/empty.html -->
        </template>
        <template x-if="!g.fold"><div class="sec" :class="g.cls"><template x-if="g.project"><i class="dot sec-dot" x-style="{background: colorOf(projById.get(g.project)?.hex_color)}"></i></template><span x-text="g.title"></span><span class="n num" x-text="(g.count ?? g.tasks.length) ? (g.count ?? g.tasks.length).toLocaleString() : ''"></span>
          <template x-if="g.key === 'today'"><span class="sec-date" x-text="todayDate"></span></template>
          <template x-if="g.key === 'overdue' && overdueMovable && !only"><button type="button" class="sec-act" id="btn-overdue-today" :disabled="movingOverdue" @click="moveOverdueToToday()" x-text="movingOverdue ? 'Moving…' : 'Move all to today'"></button></template></div></template>
        <template x-if="g.fold"><div class="sec" :class="g.cls"><button type="button" class="sec-fold" :id="'sec-' + g.key" :aria-expanded="String(g.open)" @click="toggleDoneSection()">
          <span x-text="g.title + (typeof g.count === 'number' ? ' (' + g.count.toLocaleString() + ')' : '')"></span><svg class="i chev"><use href="#i-chev"/></svg></button>
          <!-- Copies what was done today as text, folded or not -->
          <template x-if="g.key === 'donetoday'"><button type="button" class="sec-act" id="btn-copy-done" @click="copyDoneToday()">Copy</button></template></div></template>
        <!-- Messages about the list as a whole, under its heading, such as what Move all to today did -->
        <template x-for="line in placeLines(g.key)" :key="line.n">
          <!-- include markup/place-line.html -->
        </template>
        <template x-if="g.fold && g.open && g.loading"><div class="loading">Loading…</div></template>
        <template x-if="g.fold && g.open && g.loaded && !g.tasks.length"><p class="note sec-note">Nothing done here yet.</p></template>
        <template x-if="!g.cards"><div class="list" x-show="!g.fold || (g.open && g.tasks.length)">
          <template x-for="t in drawn(g)" :key="t.id">
            <!-- include markup/task-row.html list -->
          </template>
          <!-- include markup/more-row.html -->
        </div></template>
        <template x-for="line in placeLines(g.key === 'done' ? 'more' : '')" :key="line.n">
          <!-- include markup/place-line.html -->
        </template>
        <!-- A list with cards (Today, search's open tasks, a project's open list). Each task is a row, or a stacked
             card holding its open subtasks or steps (list-item.html). -->
        <template x-if="g.cards"><div class="list">
          <template x-for="t in drawn(g)" :key="t.id">
            <!-- include markup/list-item.html -->
          </template>
        </div></template>
      </div></template>
      <template x-if="!listGroups.some(g => g.tasks.length || (g.fold && g.count !== 0))">
        <!-- include markup/empty.html -->
      </template>
    </div></template>

    <template x-if="!view.loading && !view.error && route.name === 'projects'"><div>
      <template x-for="line in placeLines('projects')" :key="line.n">
        <!-- include markup/place-line.html -->
      </template>
      <template x-if="!projects.length"><div><div class="empty"><b>No projects yet.</b>Create one here, or in Vikunja's web app.</div>
        <div class="list"><div class="row cl-new"><button class="body" id="btn-new-project" @click="openNewProject()"><svg class="i"><use href="#i-plus"/></svg><span class="title">New project</span></button></div></div></div></template>
      <template x-if="favorites.length"><div>
        <div class="sec">Favorites</div>
        <div class="list tree"><template x-for="p in favorites" :key="p.id">
          <div class="row"><button class="body" @click="go('#/project/' + p.id)"><i class="dot" style="width:10px;height:10px;margin:0" x-style="{background: colorOf(p.hex_color)}"></i><span style="flex:1" x-text="p.title"></span><svg class="i chev"><use href="#i-chev"/></svg></button></div>
        </template></div>
      </div></template>
      <template x-if="projects.length"><div>
        <div class="sec">All projects</div>
        <div class="list tree"><template x-for="r in tree" :key="r.p.id">
          <div class="row"><button class="body" x-style="{paddingLeft: r.depth * 18 + 'px'}" @click="go('#/project/' + r.p.id)"><i class="dot" style="width:10px;height:10px;margin:0" x-style="{background: colorOf(r.p.hex_color)}"></i><span style="flex:1" x-text="r.p.title"></span><svg class="i chev"><use href="#i-chev"/></svg></button></div>
        </template><div class="row cl-new"><button class="body" id="btn-new-project" @click="openNewProject()"><svg class="i"><use href="#i-plus"/></svg><span class="title">New project</span></button></div></div>
      </div></template>
      <!-- Until a project is set up for checklists, this card sets one up -->
      <template x-if="!checklistProjects.length"><div style="margin-top:18px">
        <!-- include markup/setup-card.html -->
      </div></template>
    </div></template>
