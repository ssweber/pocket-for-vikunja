    <!-- Today and a single project share the task-list markup. A project's done tasks are a section of their own, under
         the open ones, folded until it's tapped (loaded then), and kept open or folded for each project. A long screen's
         rows are drawn a batch at a time, its first screenful first (drawn, views.js). -->
    <template x-if="!view.loading && !view.error && ['today', 'project', 'search'].includes(route.name)"><div x-effect="hint.pick && pickHint()">
      <template x-for="g in listGroups.filter(g => g.tasks.length || (g.fold && g.count !== 0) || placeLines(g.key).length)" :key="g.key"><div>
        <!-- Nothing open: said above the Done section -->
        <template x-if="g.fold && !listGroups.some(x => !x.fold && x.tasks.length)"><div class="empty"><b x-text="emptyText.title"></b><span x-text="emptyText.body"></span></div></template>
        <template x-if="!g.fold"><div class="sec" :class="g.cls"><span x-text="g.title"></span><span class="n num" x-text="(g.count ?? g.tasks.length) ? (g.count ?? g.tasks.length).toLocaleString() : ''"></span>
          <template x-if="g.key === 'today'"><span class="sec-date" x-text="todayDate"></span></template>
          <template x-if="g.key === 'overdue' && overdueMovable"><button type="button" class="sec-act" id="btn-overdue-today" :disabled="movingOverdue" @click="moveOverdueToToday()" x-text="movingOverdue ? 'Moving…' : 'Move all to today'"></button></template></div></template>
        <template x-if="g.fold"><div class="sec" :class="g.cls"><button type="button" class="sec-fold" :id="'sec-' + g.key" :aria-expanded="String(g.open)" @click="toggleDoneSection()">
          <span x-text="g.title + (typeof g.count === 'number' ? ' (' + g.count.toLocaleString() + ')' : '')"></span><svg class="i chev"><use href="#i-chev"/></svg></button></div></template>
        <!-- What was done to the list as a whole, under its heading: Move all to today -->
        <template x-for="line in placeLines(g.key)" :key="line.n">
          <!-- include markup/place-line.html -->
        </template>
        <template x-if="g.fold && g.open && g.loading"><div class="loading">Loading…</div></template>
        <template x-if="g.fold && g.open && g.loaded && !g.tasks.length"><p class="note sec-note">Nothing done here yet.</p></template>
        <template x-if="!g.cards"><div class="list" x-show="!g.fold || (g.open && g.tasks.length)">
          <template x-for="t in drawn(g)" :key="t.id">
            <!-- include markup/task-row.html -->
          </template>
          <!-- include markup/more-row.html -->
        </div></template>
        <template x-for="line in placeLines(g.key === 'done' ? 'more' : '')" :key="line.n">
          <!-- include markup/place-line.html -->
        </template>
        <!-- A list with cards (Today, search's open tasks, a project's open list): a row, or the stacked card for anything
             with open subtasks or steps, its subtasks on it (list-item.html) -->
        <template x-if="g.cards"><div class="list">
          <template x-for="t in drawn(g)" :key="t.id">
            <!-- include markup/list-item.html -->
          </template>
        </div></template>
      </div></template>
      <template x-if="!listGroups.some(g => g.tasks.length || (g.fold && g.count !== 0))"><div class="empty"><b x-text="emptyText.title"></b><span x-text="emptyText.body"></span></div></template>
    </div></template>

    <template x-if="!view.loading && !view.error && route.name === 'projects'"><div>
      <template x-for="line in placeLines('projects')" :key="line.n">
        <!-- include markup/place-line.html -->
      </template>
      <template x-if="!projects.length"><div><div class="empty"><b>No projects yet.</b>Make one here, or in Vikunja on the web.</div>
        <div class="list"><div class="row cl-new"><button class="body" id="btn-new-project" @click="openNewProject()"><svg class="i"><use href="#i-plus"/></svg><span class="title">New project</span></button></div></div></div></template>
      <template x-if="favorites.length"><div>
        <div class="sec">Favorites</div>
        <div class="list tree"><template x-for="p in favorites" :key="p.id">
          <div class="row"><button class="body" @click="go('#/project/' + p.id)"><i class="dot" style="width:10px;height:10px;margin:0" x-style="{background: colorOf(p.hex_color)}"></i><span style="flex:1" x-text="p.title"></span><svg class="i chev"><use href="#i-chev"/></svg></button></div>
        </template></div>
      </div></template>
      <template x-if="projects.length"><div>
        <div class="sec">All projects</div>
        <div class="list tree"><template x-for="r in tree" :key="r.p.id">
          <div class="row"><button class="body" x-style="{paddingLeft: r.depth * 18 + 'px'}" @click="go('#/project/' + r.p.id)"><i class="dot" style="width:10px;height:10px;margin:0" x-style="{background: colorOf(r.p.hex_color)}"></i><span style="flex:1" x-text="r.p.title"></span><svg class="i chev"><use href="#i-chev"/></svg></button></div>
        </template><div class="row cl-new"><button class="body" id="btn-new-project" @click="openNewProject()"><svg class="i"><use href="#i-plus"/></svg><span class="title">New project</span></button></div></div>
      </div></template>
      <!-- No project for checklists yet: one to set up, with an example -->
      <template x-if="!checklistProjects.length"><div style="margin-top:18px"><div class="card cl-card setup-card" id="setup-checklists">
        <p><b>Checklists</b> are step-by-step lists people run again and again, like opening up or a weekly clean: each run is ticked off step by step, with who did what.</p>
        <button class="btn block" id="btn-setup-checklists" :disabled="settingUp" @click="setUpChecklists()" x-text="settingUp ? 'Setting up…' : 'Set up checklists'"></button>
        <template x-for="line in placeLines('setup')" :key="line.n">
          <!-- include markup/place-line.html -->
        </template>
        <p class="note" style="margin:8px 0 0">Makes a project called Checklists, with an example template to try. Or use a project of yours: its ⋯ has Use for checklists.</p>
      </div></div></template>
    </div></template>
