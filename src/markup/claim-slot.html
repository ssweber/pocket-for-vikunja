<!-- Who is doing a subtask or a step (`slot`, from claimSlot). Tapping "+ me" claims it, tapping your own picture lets
     it go, and anyone else's picture only shows who has it. The same piece serves a subtask in its parent's sheet, a
     template's step and a checklist's step on its screen. -->
<button class="claim" :class="{mine: slot.mine}" :aria-disabled="!slot.can" :aria-label="slot.label" @click="toggleClaim(slot)">
  <template x-if="!slot.users.length"><span class="me">+ me</span></template><span class="pics">
    <!-- include markup/pics.html -->
  </span></button>
