<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket</title>
<meta name="description" content="A mobile web app for tasks and checklists in Vikunja, served by Vikunja itself.">
<meta name="theme-color" content="#EEF1EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1513" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pocket">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body x-data="pocket" :class="{'sheet-open': sheet.open}" @keydown.escape.window="sheet.open && closeSheet()"
      x-effect="if (screen === 'app') document.title = head.title + ' · Pocket'">

<!-- include markup/icons.html -->

<!-- include markup/login.html -->

<!-- include markup/app.html -->

<!-- include markup/sheet.html -->

<div id="toasts">
  <div id="toast" role="status" :class="{show: toast.show}"><span id="toast-msg" x-text="toast.msg"></span><button id="toast-act" :hidden="!toast.action" x-text="toast.action?.label" @click="runToastAction()" hidden></button><button id="toast-act2" :hidden="!toast.more" x-text="toast.more?.label" @click="runToastAction(true)" hidden></button></div>
</div>

<script type="module" src="js/main.js"></script>
<script type="module">import * as chrono from './chrono-2.10.1.en.min.js'; window.chrono = chrono;</script>
<script defer src="alpine-3.17.4.min.js"></script>
</body>
</html>
