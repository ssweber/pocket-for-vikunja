    for (const p of this.projects) { const k = p.parent_project_id && this.projById.has(p.parent_project_id) ? p.parent_project_id : 0; if (!kids.has(k)) kids.set(k, []); kids.get(k).push(p); }
    const out = [];
    (function walk(pid, depth){ for (const p of kids.get(pid) || []) { out.push({p, depth}); walk(p.id, depth+1); } })(0, 0);
    return out;
  },
  get favorites(){ return this.projects.filter(p => p.is_favorite); },
  defaultProjectId(){
    if (this.route.name === 'project' && this.projById.has(this.route.id)) return this.route.id;
    const d = this.user?.settings?.default_project_id;
    if (d && this.projById.has(d)) return d;
    return this.projects[0]?.id;
  },
  /* Push a saved task into every list row showing it. */
  syncTask(saved){
    for (const g of this.view.groups) for (const t of g.tasks) if (t.id === saved.id) Object.assign(t, saved);
  },
  removeRow(id){
    for (const g of this.view.groups) { const i = g.tasks.findIndex(t => t.id === id); if (i >= 0) g.tasks.splice(i, 1); }
  },
  viewWantsDone(){ return this.route.name === 'project' && !!this.route.showDone; },

  /* ---------- views ---------- */
  go(hash){ location.hash = hash; },
  // The page's name: the tab says Today or Projects; a project shows its name, and its parent's, above its list.
  get head(){
    const r = this.route;
    if (r.name === 'projects') return {kicker: '', title: 'Projects'};
    if (r.name === 'search') return {kicker: '', title: 'Search'};
    if (r.name === 'project') {
      const p = this.view.project; if (!p) return {kicker: '', title: 'Project'};
      return {kicker: this.projById.get(p.parent_project_id)?.title || '', title: p.title};
    }
    return {kicker: '', title: 'Today'};
  },
  // Shown on the Today heading, so "Friday" on a task can be read against today.
  get todayDate(){ return new Date().toLocaleDateString([], {weekday: 'long', month: 'long', day: 'numeric'}); },
  get emptyText(){
    if (this.route.name === 'today') return {title: 'Nothing due this week.', body: `Today is ${this.todayDate}. Add a task below — try “Call Ana tomorrow !3”.`};
    if (this.route.name === 'search') return this.searchQ.trim()
      ? {title: `No tasks match “${this.searchQ.trim()}”.`, body: 'Searching looks at titles and notes, in open and done tasks.'}
      : {title: 'Search your tasks.', body: 'Finds open and done tasks in all your projects by words in their title or notes, or by number, like #12.'};
    if (!this.view.project) return {title: 'Project not found.', body: 'It may be archived or you lost access.'};
    return this.route.showDone ? {title: 'Nothing done here yet.', body: ''} : {title: 'All clear.', body: 'New tasks you add now land in this project.'};
  },
  rowMeta(t){
    const out = [], due = dueInfo(t.due_date);
    if (due) out.push({key: 'due', cls: 'due num ' + due.cls, text: due.label});
    if (t.priority) out.push({key: 'prio', prio: t.priority, text: '', label: 'Priority: ' + PRIOS[t.priority].label});
    const p = (this.route.name === 'today' || this.route.name === 'search') && this.projById.get(t.project_id);
    if (p) out.push({key: 'p', color: colorOf(p.hex_color), text: p.title});
    for (const l of (t.labels || []).slice(0,3)) out.push({key: 'l' + l.id, color: colorOf(l.hex_color), text: l.title});
    for (const u of t.assignees || []) if (u.id !== this.user?.id) out.push({key: 'u' + u.id, text: '@' + u.username, label: 'Assigned to ' + (u.name || u.username)});
    if (repeats(t)) out.push({key: 'rep', text: '↻', label: 'Repeats'});
    const subs = t.related_tasks?.subtask || [];
    if (subs.length) out.push({key: 'sub', icon: 'subtasks', cls: 'num', text: subs.filter(s => s.done).length + '/' + subs.length, label: 'Subtasks done'});
    if (t.comment_count) out.push({key: 'com', icon: 'comment', cls: 'num', text: String(t.comment_count), label: 'Comments'});
    // Photos and files still uploading count too, so a photo added with a task shows on its row straight away.
    const att = t.attachments?.length || 0, waiting = t.pending ? t.waiting : this.waitingByTask.get(t.id)?.length || 0;
    if (att + waiting) out.push({key: 'att', icon: 'clip', cls: 'num', text: String(att + waiting), label: 'Attachments' + (waiting ? `, ${waiting} waiting to upload` : '')});
    if ((t.reminders || []).some(r => new Date(r.reminder) > new Date())) out.push({key: 'rem', icon: 'bell', text: '', label: 'A reminder is still to come'});
    return out;
  },

  async render(){
    const r = currentRoute();
    if (r.name === 'add') {                      // deep link: #/add?text=Buy+milk+tomorrow
      history.replaceState(null, '', '#/today');
      await this.render();
      this.capture = r.text; this.$nextTick(() => this.$refs.capture.focus());
      return;
    }
    this.route = r;
    const seq = ++renderSeq;
    const fresh = this.view.route !== location.hash;   // new screen: show Loading; same screen: refresh in place
    if (fresh) Object.assign(this.view, {loading: true, groups: [], project: null, savedAt: null});
    this.view.route = location.hash; this.view.error = ''; this.view.bootFailed = false;
    try {
      if (r.name === 'today') await this.loadToday(seq);
      else if (r.name === 'projects') { if (!this.projects.length) await this.loadProjects(); }
      else if (r.name === 'project') await this.loadProject(seq, r);
      else if (r.name === 'search') await this.loadSearch(seq);
      if (seq === renderSeq) { this.view.loading = false; this.view.savedAt = null; }   // fresh from Vikunja
    } catch (e) {
      if (seq !== renderSeq || (e instanceof ApiError && e.status === 401)) return;
      if (e instanceof NetError) {
        if (!fresh && !this.view.loading) return;                          // keep what's on screen; the banner says we're offline
        const s = saved.get(viewKey(r));
        if (s) {
          for (const g of s.groups) for (const t of g.tasks) cache.set(t.id, t);
          Object.assign(this.view, {loading: false, groups: s.groups, project: s.project || null, savedAt: s.at});
          return;
        }
      }
      if (!fresh && !this.view.loading) { this.notify((r.name === 'search' ? 'Couldn\'t search: ' : 'Couldn\'t refresh: ') + e.message); return; }
      Object.assign(this.view, {loading: false, error: errText(e)});
    }
  },
  async loadToday(seq){
    const end = addDays(startOfDay(), 8);
    const t0 = startOfDay(), t1 = addDays(t0, 1);
    const q = new URLSearchParams({filter: `done = false && due_date < '${end.toISOString()}'`, filter_timezone: TZ, sort_by: 'due_date', order_by: 'asc', expand: 'comment_count'});
    const qNew = new URLSearchParams({filter: `done = false && created >= '${t0.toISOString()}'`, filter_timezone: TZ, sort_by: 'created', order_by: 'desc', expand: 'comment_count'});
    const [tasks, added] = await Promise.all([allPages('/tasks?' + q), allPages('/tasks?' + qNew)]);
    if (seq !== renderSeq) return;
    for (const t of [...tasks, ...added]) cache.set(t.id, t);
    const groups = todayGroups(), [overdue, today, nodate, week] = groups;
    for (const t of tasks) {
      if (!isSet(t.due_date)) continue;
      const d = new Date(t.due_date);
      (d < t0 ? overdue : d < t1 ? today : week).tasks.push({...t});
    }
    // Yours, still without a date, and not a subtask: a pasted list shows only its first line.
    for (const t of added) if (!isSet(t.due_date) && t.created_by?.id === this.user?.id && !t.related_tasks?.parenttask?.length) nodate.tasks.push({...t});
    overdue.tasks.sort((a,b) => (b.priority||0) - (a.priority||0) || new Date(a.due_date) - new Date(b.due_date));
    this.view.groups = groups;
    saved.set('today', {groups, at: new Date().toISOString()});
  },
  async loadProject(seq, r){
    if (!this.projById.has(r.id)) await this.loadProjects();
    const p = this.projById.get(r.id);
    this.view.project = p || null;
    if (!p) { this.view.groups = []; return; }
    const q = new URLSearchParams({sort_by: 'due_date', order_by: 'asc', filter_include_nulls: 'true', filter_timezone: TZ, expand: 'comment_count'});
    q.set('filter', r.showDone ? 'done = true' : 'done = false');
    const tasks = await allPages(`/projects/${p.id}/tasks?` + q);
    if (seq !== renderSeq) return;
    for (const t of tasks) cache.set(t.id, t);
    const list = r.showDone ? tasks.sort((a,b) => new Date(b.done_at) - new Date(a.done_at)) : soonestFirst(tasks);
    this.view.groups = [{key: r.showDone ? 'done' : 'open', cls: '', title: r.showDone ? 'Done' : 'Open', tasks: list.map(t => ({...t}))}];
    saved.set(viewKey(r), {groups: this.view.groups, project: p, at: new Date().toISOString()});
  },
  /* Load a newer Pocket if the server has one, when nothing would be lost by reloading; otherwise the next refresh or
     return to Pocket tries again. It only asks whether the page changed since this copy was loaded, which the server
     answers in a few bytes, and runs alongside the list refresh, not before it. */
  async updateIfNew(){
    if (!LOADED || !this.signedIn || this.screen !== 'app') return;
    let res;
    try { res = await fetch(new URL('.', location.href), {cache: 'no-store', headers: {'If-Modified-Since': LOADED.toUTCString()}}); }
    catch { return; }                                                          // offline: no news
    if (res.status !== 200) return;
    const busy = this.sheet.open || this.capture.trim() || this.capPhotos.length || this.capBusy || this.searchQ || this.movingOverdue
      || this.pending.length || pendingSaves;
    if (!busy) location.reload();
  },
  async refresh(){
    this.updateIfNew();
    this.refreshing = true;
    this.people = null; this.access = {}; this.userKnown = {}; this.labelsLoaded = false;   // sharing and labels may have changed too
    try { await this.loadProjects(); await this.render(); } catch (e) { this.notify(e.message); } finally { this.refreshing = false; }
  },

  // `extra` is saved along with it, and `undoExtra` with the Undo: progress uses these to mark a task done at 100%.
  async toggleDone(t, rowEl, extra = {}, undoExtra = {}){
    const was = t.done;
    t.done = !was;
    try {
      const saved = await this.saveTask(t.id, {done: !was, ...extra});
      Object.assign(t, saved);
      if (!was && !saved.done) {                 // repeating task rolled forward
        const d = dueInfo(saved.due_date);
        this.notify(d ? 'Repeats · next ' + d.label : 'Done — repeats');
        this.render(); return;
      }
      if (!was) this.notify('Done', {label: 'Undo', fn: async () => { await this.toggleDone(t, null, undoExtra); this.render(); }});
      setTimeout(async () => {                   // let the tick register, then slide the row away
        if (t.done === this.viewWantsDone()) return;
        await collapse(rowEl);
        if (t.done !== this.viewWantsDone()) this.removeRow(t.id);
      }, was ? 0 : 700);
    } catch (e) {
      t.done = was;
      this.notify(e instanceof NetError ? 'Offline — not saved' : 'Not saved: ' + e.message);
    }
  },

  /* ---------- progress ---------- */
  rowTask(id){
    for (const g of this.view.groups) for (const t of g.tasks) if (t.id === id) return t;
    return null;
  },
  // Progress set in the list. At 100% the task is done and slides away, as when it's ticked off.
  // `undoing`: putting back what it was, exactly, without marking it done.
  async setProgress(t, pct, rowEl, undoing = false){
    const was = pctOf(t), patch = undoing ? {percent_done: pct / 100} : progressPatch(t, pct);
    if (patch.done) return this.toggleDone(t, rowEl, patch, {percent_done: was / 100});
    t.percent_done = patch.percent_done;
    try {
      await this.saveTask(t.id, patch);
      if (!undoing) this.notify(`Progress set to ${pct}%`, {label: 'Undo', fn: () => this.setProgress(t, was, null, true)});
    } catch (e) {
      t.percent_done = was / 100;
      this.notify(e instanceof NetError ? 'Offline — not saved' : 'Not saved: ' + e.message);
    }
  },
  /* Hold, then slide sideways: how progress is set, on a list row and on a task's sheet. It moves from where it was, in
     steps of 10%, like a volume bar; sliding across most of the width goes from 0% to 100%. Moving before the hold ends
     is a scroll, a swipe or a tap as usual; once it has ended, nothing scrolls or swipes until the finger lifts.
     find(target) says what was held: {start, width, show(pct), finish(pct, or null if nothing changed)}, or null. */
  holdToSlide(area, find){
    let g = null, swallowClick = false;
    const stop = commit => {
      if (!g) return;
      clearTimeout(g.timer); sliding = false;
      const {s, on, pct} = g; g = null;
      s.finish(on && commit && pct !== s.start ? pct : null);
    };
    area.addEventListener('pointerdown', e => {
      if (g || !e.isPrimary || (e.pointerType === 'mouse' && e.button !== 0)) return;
      const s = find(e.target); if (!s) return;
      g = {s, id: e.pointerId, x0: e.clientX, y0: e.clientY, x: e.clientX, on: false, pct: s.start};
      g.timer = setTimeout(() => { g.on = true; sliding = true; s.show(g.pct); navigator.vibrate?.(10); }, HOLD_MS);
    });
    // Moves and the release are followed on the whole window, so a press that ends outside the area still ends.
    addEventListener('pointermove', e => {
      if (!g || e.pointerId !== g.id) return;
      if (!g.on) { if (Math.hypot(e.clientX - g.x0, e.clientY - g.y0) > 8) stop(false); else g.x = e.clientX; return; }
      const pct = Math.max(0, Math.min(100, g.s.start + Math.round((e.clientX - g.x) / (g.s.width * .8) * 10) * 10));
      if (pct !== g.pct) { g.pct = pct; g.s.show(pct); navigator.vibrate?.(5); }
    });
    addEventListener('pointerup', e => {
      if (!g || e.pointerId !== g.id) return;
      if (g.on) { swallowClick = true; setTimeout(() => swallowClick = false, 400); }   // the release isn't a tap
      stop(true);
    });
    addEventListener('pointercancel', e => { if (g && e.pointerId === g.id) stop(false); });
    // While sliding, nothing scrolls, and a long press doesn't open the browser's menu.
    area.addEventListener('touchmove', e => { if (g?.on) e.preventDefault(); }, {passive: false});
    area.addEventListener('contextmenu', e => { if (g) e.preventDefault(); });
    area.addEventListener('click', e => { if (swallowClick) { swallowClick = false; e.preventDefault(); e.stopPropagation(); } }, true);
  },
  // In the list: the row fills, and at 100% the task is done and slides away.
  initProgressDrag(){
    this.holdToSlide(document.getElementById('view'), target => {
      const row = target.closest('.list:not(.tree) > .row');
      const t = row && this.rowTask(+row.dataset.id);
      if (!t || t.pending || t.done) return null;
      return {start: Math.round(pctOf(t) / 10) * 10, width: row.clientWidth,
        show: pct => { row.classList.add('setting'); row.style.setProperty('--pct', pct / 100); row.dataset.pct = pct + '%'; },
        finish: pct => {
          if (pct !== null) this.setProgress(t, pct, row);
          row.classList.remove('setting');
          row.style.setProperty('--pct', t.done ? 0 : t.percent_done || 0);
        }};
    });
  },
  // In a task's sheet: hold the progress bar, or around the title (not its text, where a long press selects).
  initSheetProgress(){
    this.holdToSlide(this.$refs.sheet, target => {
      const head = target.closest('.d-head'), t = this.sheet.task;
      if (!head || !t || target.closest('textarea, button, a, select')) return null;
      return {start: Math.round(pctOf(t) / 10) * 10, width: head.clientWidth,
        show: pct => { this.sheet.pct = pct; head.classList.add('setting'); head.style.setProperty('--pct', pct / 100); head.dataset.pct = pct + '%'; },
        finish: pct => {
          head.classList.remove('setting'); this.sheet.pct = null;
          if (pct !== null && this.sheet.task === t) this.save(progressPatch(t, pct));
        }};
    });
  },

  /* ---------- search ---------- */
  // The magnifier. The box is focused here, during the tap, since that's the only way a phone opens its keyboard for it.
  openSearch(){
    this.$refs.header.classList.add('searching');
    this.$refs.searchIn.focus();
    if (this.route.name !== 'search') { this.searchFrom = location.hash || '#/today'; this.searchQ = ''; }
    this.go('#/search');
  },
  closeSearch(){
    this.searchQ = '';
    this.go(this.searchFrom && this.searchFrom !== '#/search' ? this.searchFrom : '#/today');
  },
  // Vikunja's search: words in the title or notes, or a task's number. Open tasks soonest first, then the 50 most
  // recently done.
  async loadSearch(seq){
    const s = this.searchQ.trim();
    if (!s) { this.view.groups = []; return; }
    const open = new URLSearchParams({s, filter: 'done = false', filter_timezone: TZ, expand: 'comment_count'});
    const done = new URLSearchParams({s, filter: 'done = true', filter_timezone: TZ, sort_by: 'done_at', order_by: 'desc', per_page: 50, expand: 'comment_count'});
    const [opened, finished = []] = await Promise.all([allPages('/tasks?' + open), api('/tasks?' + done).then(r => r || [])]);
    if (seq !== renderSeq) return;
    for (const t of [...opened, ...finished]) cache.set(t.id, t);
    this.view.groups = [
      {key: 'open', cls: '', title: 'Open', tasks: soonestFirst(opened).map(t => ({...t}))},
      {key: 'done', cls: '', title: finished.length >= 50 ? 'Done · the 50 most recent' : 'Done', tasks: finished.map(t => ({...t}))},
    ];
  },

  /* ---------- overdue ---------- */
  // "Move all to today": each overdue task to today, at the time of day it had. Undo puts every date back.
  async moveOverdueToToday(){
    const tasks = this.view.groups.find(g => g.key === 'overdue')?.tasks || [];
    if (!tasks.length || this.movingOverdue) return;
    this.movingOverdue = true;
    const now = new Date();
    const moves = tasks.map(t => {
      const d = new Date(t.due_date);
      d.setFullYear(now.getFullYear(), now.getMonth(), now.getDate());
      return {t, was: t.due_date, due: d.toISOString()};
    });
    const moved = await this.saveEach(moves.map(m => [m.t, {due_date: m.due}]));
    this.movingOverdue = false;
    const left = moves.length - moved.length, n = moved.length;
    const undo = {label: 'Undo', fn: async () => {
      const back = await this.saveEach(moves.filter(m => moved.includes(m.t)).map(m => [m.t, {due_date: m.was}]));
      const k = n - back.length;
      if (k) this.notify(`${k === 1 ? '1 task' : k + ' tasks'} couldn't be moved back and ${k === 1 ? 'is' : 'are'} still due today.`);
      this.render();
    }};
    if (!n) return this.notify(this.offline ? 'Offline — not moved' : 'Not moved: Vikunja didn\'t save the changes');
    this.notify(`Moved ${n === 1 ? '1 task' : n + ' tasks'} to today` + (left ? `. ${left === 1 ? '1 wasn\'t' : left + ' weren\'t'} saved and ${left === 1 ? 'is' : 'are'} still overdue.` : ''), undo);
    this.render();
  },
  // Saves [task, patch] pairs one after another; resolves to the tasks that saved.
  async saveEach(pairs){
    const results = await Promise.allSettled(pairs.map(([t, patch]) => this.saveTask(t.id, patch)));
    return pairs.filter((p, i) => results[i].status === 'fulfilled').map(([t]) => t);
  },

  /* ---------- quick add ---------- */
  get capLines(){ return captureLines(this.capture); },
  // The user's Vikunja settings: "default due time" and Quick Add Magic mode (vikunja, todoist or disabled).
  get dueTime(){ return this.user?.settings?.frontend_settings?.default_due_time || '12:00'; },
  get quickAddMode(){ return this.user?.settings?.frontend_settings?.quick_add_magic_mode || 'vikunja'; },
  get prefixes(){ return QUICK_ADD_PREFIXES[this.quickAddMode] || null; },
  get parseOpts(){ return {mode: this.quickAddMode, dueTime: this.dueTime}; },
  get parsed(){ return parseCapture(this.capLines[0] || '', this.projects, {...this.parseOpts, ignore: this.capIgnore}); },   // the first (or only) line
  get parsedAll(){ return parseCapture(this.capLines[0] || '', this.projects, this.parseOpts); },                            // the same, ignoring nothing
  /* A pasted list goes to one project: the first +project in it, on whichever line. A different +project on a later line
     stays in that line's text, as a second one does within a line. (Vikunja's own quick add reads each line on its own.)
     Returns {parsed: [each line], project, miss}; `first` is the first line already parsed, if there is one. */
  parseList(lines, first){
    let owner = -1;
    const parsed = lines.map((raw, i) => {
      const p = i === 0 && first ? first : parseCapture(raw, this.projects, owner >= 0 ? {...this.parseOpts, ignore: {project: true}} : this.parseOpts);
      if (owner < 0 && (p.project || p.projectMiss)) owner = i;
      return p;
    });
    const project = owner >= 0 ? parsed[owner].project : null, miss = owner >= 0 ? parsed[owner].projectMiss : null;
    return {parsed: lines.length > 1 ? parsed.map(p => ({...p, project})) : parsed, project, miss};
  },
  get captureHint(){
    const p = this.prefixes;
    return p ? `${p.project}project  ${p.label}label  ${p.assignee}user  !1–5  tomorrow · fri at 2 · Oct 12 · every week · tap a chip to undo it`
      : 'Quick add shortcuts are turned off in your Vikunja settings';
  },
  /* ---------- @username: who can see the task's project ---------- */
  // What checkAccess looks up: a single task's project and its @usernames. Empty when there's nothing to check.
  get accessQuery(){
    if (this.capLines.length !== 1 || this.accessBlocked || !this.prefixes) return '';
    const p = this.parsed;
    return p.assignees.length ? [p.project?.id || this.defaultProjectId(), ...p.assignees.map(n => n.toLowerCase())].join('|') : '';
  },
  /* From what checkAccess has found so far: {auto, warn}. auto is the one project everyone mentioned can see, when they
     can't all see the default project and no +project was typed; warn lists the chips for people the task can't reach. */
  get accessHints(){
    const out = {auto: null, warn: []};
    if (!this.accessQuery) return out;
    const p = this.parsed, target = p.project?.id || this.defaultProjectId(), at = this.prefixes.assignee;
    const sees = (pid, n) => this.access[pid + ':' + n.toLowerCase()];
    const known = p.assignees.filter(n => this.userKnown[n.toLowerCase()] !== false);
    p.assignees.filter(n => this.userKnown[n.toLowerCase()] === false).forEach(n => out.warn.push(`No user ${at}${n}`));
    const blocked = known.filter(n => sees(target, n) === false);
    if (!blocked.length) return out;
    if (!p.project) {
      const fits = [];
      for (const proj of this.projects) if (proj.id > 0 && proj.id !== target) {
        const v = known.map(n => sees(proj.id, n));
        if (v.includes(undefined)) return out;                                  // still looking
        if (v.every(Boolean)) fits.push(proj);
      }
      if (fits.length === 1) out.auto = fits[0];
    }
    if (!out.auto || this.capIgnore.autoProject) blocked.forEach(n => out.warn.push(`${at}${n} can't see ${this.projById.get(target)?.title || 'this project'}`));
    return out;
  },
  async checkAccess(){
    if (!this.accessQuery) return;
    const p = this.parsed, target = p.project?.id || this.defaultProjectId();
    try {
      let blocked = false;
      for (const n of p.assignees) if (await this.canSee(target, n) === false && await this.userExists(n)) blocked = true;
      // Someone can't see it: look through the other projects, so one everyone can see can be picked.
      if (blocked && !p.project) {
        const known = p.assignees.filter(n => this.userKnown[n.toLowerCase()] !== false);
        await Promise.all(this.projects.filter(x => x.id > 0 && x.id !== target).flatMap(x => known.map(n => this.canSee(x.id, n))));
      }
    } catch {}                                                                  // offline, say: no hints, and sending works as before
  },
  // Whether @name can see a project: true or false, or null when Pocket isn't allowed to look. Remembered until sign-out.
  async canSee(pid, name){
    const k = name.toLowerCase(), key = pid + ':' + k;
    if (key in this.access) return this.access[key];
    if (this.accessBlocked) return null;
    try {
      const u = (await api(`/projects/${pid}/projectusers?s=` + encodeURIComponent(name)) || []).find(x => x.username.toLowerCase() === k);
      if (u) { userCache.set(k, u); this.userKnown[k] = true; }
      return this.access[key] = !!u;
    } catch (e) {
      if (e instanceof NetError) throw e;
      if (e instanceof ApiError && e.status === 403) this.accessBlocked = true;  // an API token without Projects → projectusers
      return null;
    }
  },
  async userExists(name){
    const k = name.toLowerCase();
    if (!(k in this.userKnown)) this.userKnown[k] = !!(await this.findUser(name));
    return this.userKnown[k];
  },
  // The project a single task goes to: its +project, or the one picked for its @usernames, or the default.
  get capProjectId(){
    const auto = this.accessHints.auto;
    return this.parsed.project?.id || (auto && !this.capIgnore.autoProject ? auto.id : this.defaultProjectId());
  },

  /* ---------- suggestions for the @username or *label at the cursor ---------- */
  // {kind: 'assignee' | 'label', prefix, q, start, end}: the word being typed, from its prefix to the end of the word.
  get capToken(){
    const P = this.prefixes;
    if (!P || !this.capFocus) return null;
    const text = this.capture, at = Math.min(this.capCaret, text.length), tail = text.slice(at).match(/^\S*/)[0];
    for (const kind of ['assignee', 'label']) {
      const m = text.slice(0, at).match(new RegExp(`(^|\\s)\\${P[kind]}(?:"([^"]*)|([^\\s"]*))$`));
      if (m) return {kind, prefix: P[kind], q: m[2] ?? m[3] ?? '', start: m.index + m[1].length, end: at + tail.length};
    }
    return null;
  },
  /* Chips to tap instead of typing the rest: people who can see the task's project first, then others you share with.
     None once the word already names one exactly, so the usual chips show what will be saved. */
  get suggestions(){
    const tk = this.capToken;
    if (!tk) return null;
    const q = tk.q.toLowerCase();
    if (q && (tk.kind === 'label' ? this.labels.some(l => l.title.toLowerCase() === q) : (this.people || []).some(x => x.user.username.toLowerCase() === q))) return null;
    const score = (...names) => Math.min(...names.map(n => (n || '').toLowerCase()).map(n => n.startsWith(q) ? 0 : n.includes(q) ? 1 : 9));
    let out;
    if (tk.kind === 'label') {
      out = this.labels.map(l => ({l, s: score(l.title)})).filter(x => x.s < 9).sort((a, b) => a.s - b.s || a.l.title.localeCompare(b.l.title))
        .map(({l}) => ({key: 's' + l.id, kind: 'suggest', color: colorOf(l.hex_color), text: tk.prefix + l.title, hint: 'Use this label', action: () => this.useSuggestion(tk, l.title)}));
    } else {
      const pid = this.parsed.project?.id || this.defaultProjectId();
      out = (this.people || []).map(x => ({x, s: score(x.user.username, x.user.name), away: !x.pids.has(pid)})).filter(y => y.s < 9)
        .sort((a, b) => a.away - b.away || a.s - b.s || (a.x.user.name || a.x.user.username).localeCompare(b.x.user.name || b.x.user.username))
        .map(({x: {user: u}}) => ({key: 's' + u.id, kind: 'suggest', text: (u.name ? u.name + ' ' : '') + tk.prefix + u.username, hint: 'Assign ' + (u.name || u.username), action: () => this.useSuggestion(tk, u.username)}));
    }
    return out.length ? out.slice(0, 6) : null;
  },
  useSuggestion(tk, name){
    const word = tk.prefix + (/\s/.test(name) ? `"${name}"` : name) + ' ', el = this.$refs.capture;
    const text = this.capture = el.value = this.capture.slice(0, tk.start) + word + this.capture.slice(tk.end).replace(/^ /, '');
    // Set the text and cursor now, not on Alpine's next tick: a fast typist's next letters would otherwise land before the word.
    const at = this.capCaret = Math.min(tk.start + word.length, text.length);
    el.focus(); el.setSelectionRange(at, at);
  },
  /* Everyone with access to each of your projects, from Vikunja's list per project (which counts teams). Loaded once; it also
     tells checkAccess who can see what, without asking again. Skipped for an API token without Projects → projectusers. */
  async loadPeople(){
    if (this.people || this.accessBlocked) return;
    if (peopleLoading) return peopleLoading;
    peopleLoading = (async () => {
      const projs = this.projects.filter(p => p.id > 0), get = p => api(`/projects/${p.id}/projectusers`).then(r => r || []).catch(e => {
        if (e instanceof ApiError && e.status === 403) this.accessBlocked = true;
        return null;
      });
      const first = projs.length ? await get(projs[0]) : [];                    // one first, so a token that can't stops here
      if (this.accessBlocked) return;
      const lists = [first, ...await Promise.all(projs.slice(1).map(get))], byName = new Map();
      projs.forEach((p, i) => { for (const u of lists[i] || []) {
        const k = u.username.toLowerCase();
        if (!byName.has(k)) byName.set(k, {user: u, pids: new Set()});
        byName.get(k).pids.add(p.id);
      } });
      for (const [k, x] of byName) {
        userCache.set(k, x.user); this.userKnown[k] = true;
        projs.forEach((p, i) => { if (lists[i]) this.access[p.id + ':' + k] = x.pids.has(p.id); });
      }
      this.people = [...byName.values()];
    })().finally(() => { peopleLoading = null; });
    return peopleLoading;
  },

  get chips(){
    // Photos for the new task, each with a tap to take it off again. A pasted list puts them on its first task.
    const photos = this.capPhotos.map((f, i) => ({key: 'ph' + i, cls: 'photo', icon: 'clip', hint: 'Tap to remove this photo',
      text: f.name + (this.capLines.length > 1 ? ' · on the first task' : '') + '  ✕', action: () => this.capPhotos.splice(i, 1)}));
    if (!this.capture.trim()) return photos;
    const sg = this.suggestions;
    if (sg) return sg;
    const parsed = this.parsed, p = this.projById.get(parsed.project?.id || this.defaultProjectId()), out = [], n = this.capLines.length;
    out.push(...photos);
    if (n > 1) {
      out.push({key: 'n', text: this.capNest ? `1 task + ${n - 1} subtask${n > 2 ? 's' : ''}` : `${n} tasks`});
      const {project, miss} = this.parseList(this.capLines);
      const to = this.projById.get(project?.id || this.defaultProjectId());
      if (to) out.push({key: 'p', color: colorOf(to.hex_color), text: to.title});
      if (miss) out.push({key: 'miss', kind: 'new-project', cls: 'create', hint: 'Tap to create this project',
        text: this.creatingProject ? 'Creating…' : `+ Create project “${projectName(miss)}”`, action: () => this.createProject(miss)});
      return out;
    }
    // Chips come from the full parse; tapped-off ones stay visible (struck through) so they can be turned back on.
    const all = this.parsedAll, off = k => !!this.capIgnore[k];
    const {auto, warn} = this.accessHints;
    if (all.project) out.push({key: 'p', kind: 'project', color: colorOf(all.project.hex_color), text: all.project.title, off: off('project')});
    // A project picked because the @usernames can see it; tap to send it to the default project after all.
    if (auto) out.push({key: 'ap', kind: 'autoProject', color: colorOf(auto.hex_color), text: auto.title, off: off('autoProject'),
      hint: off('autoProject') ? 'Tap to use this project' : `Picked because ${parsed.assignees.map(n => this.prefixes.assignee + n).join(', ')} can see it. Tap to undo`});
    if (p && !parsed.project && !(auto && !off('autoProject'))) out.push({key: 'dp', color: colorOf(p.hex_color), text: p.title});      // where it lands otherwise
    // A +project that doesn't exist yet: tap to create it; the line then finds it by name.
    if (all.projectMiss) out.push({key: 'miss', kind: 'new-project', cls: 'create', hint: 'Tap to create this project',
      text: this.creatingProject ? 'Creating…' : `+ Create project “${projectName(all.projectMiss)}”`, action: () => this.createProject(all.projectMiss)});
    if (all.due && !all.dueFromRepeat) out.push({key: 'due', kind: 'due', cls: 'num', text: all.dueLabel, off: off('due')});
    if (all.repeat) out.push({key: 'rep', kind: 'repeat', text: '↻ ' + all.repeat.label + (all.dueFromRepeat ? ', from ' + all.dueLabel : ''), off: off('repeat')});
    if (all.priority) out.push({key: 'prio', kind: 'priority', text: 'Priority ' + all.priority, off: off('priority')});
    all.labels.forEach((l, i) => out.push({key: 'l' + i, kind: 'labels', text: this.prefixes.label + l, off: off('labels')}));
    all.assignees.forEach((u, i) => out.push({key: 'a' + i, kind: 'assignees', text: this.prefixes.assignee + u, off: off('assignees')}));
    warn.forEach((text, i) => out.push({key: 'w' + i, cls: 'warn', text}));
    return out;
  },
  /* ---------- the words quick add read, marked in the box ---------- */
  // Marks in the text as typed, over every line of a pasted list. A tapped-off chip's words aren't marked, since they
  // stay in the title, nor is an @username that won't be assigned: no such user, or one who can't see the project.
  get capMarks(){
    if (!this.prefixes || !this.capLines.length) return [];
    const lines = this.capLines, parsed = lines.length > 1 ? this.parseList(lines, this.parsed).parsed : [this.parsed];
    let target = null;
    if (lines.length === 1) {
      const {auto} = this.accessHints;
      target = this.parsed.project?.id || (auto && !this.capIgnore.autoProject ? auto.id : this.defaultProjectId());
    }
    const stays = n => this.userKnown[n.toLowerCase()] === false || (target && this.access[target + ':' + n.toLowerCase()] === false);
    const out = [];
    let at = 0, k = 0;
    for (const l of this.capture.split('\n')) {
      // Where the line's text starts, as captureLines finds it: after indent, list marker and spaces.
      const t = l.trim(), u = t.replace(LIST_MARKER, '');
      if (u.trim()) {
        const start = at + (l.length - l.trimStart().length) + (t.length - u.length) + (u.length - u.trimStart().length);
        for (const m of parsed[k++]?.marks || []) if (!(m.kind === 'assignees' && stays(m.name))) out.push({...m, start: m.start + start, end: m.end + start});
      }
      at += l.length + 1;
    }
    return out;
  },
  // The box's text with those marks, drawn behind the box itself (.cap-marks), so the marks sit under the typed words.
  get capMarksHtml(){
    const text = this.capture;
    let html = '', at = 0;
    for (const m of this.capMarks) { html += esc(text.slice(at, m.start)) + `<mark data-kind="${m.kind}">${esc(text.slice(m.start, m.end))}</mark>`; at = m.end; }
    return html + esc(text.slice(at)) + '​';                   // the zero-width space keeps a last empty line's height
  },

  /* Create one task from a parsed line; labels are created when missing. */
  /* Create a task from a parsed line, by LINE_STEPS. `job` keeps each step's progress and `save` keeps the job: for a
     line in the outbox, job is its item. `made` hears of the task as soon as it exists, and `parent` makes it a
     subtask of that task. Returns the task (just {id, project_id} if an earlier try made it), with `problems`: what
     couldn't be done, like an @username who can't see the project. A lost connection or a busy Vikunja is thrown. */
  async createTask(parsed, pid, {job = {}, save = async () => {}, made, at, skip, parent} = {}){
    job.problems ||= [];
    job.key ||= randomId();                      // this line, for the record of which task was added for it
    const c = {parsed, pid, save, made, at, skip, parent};
    if (!itemDone(job, !!parent)) {
      for (const step of LINE_STEPS) while (!step.done(job, c)) { await step.run(job, c); await save(); }
      job.done = true; await save();
    }
    return Object.assign(c.task || {id: job.taskId, project_id: job.projectId}, {problems: job.problems});
  },
  async findUser(name){
    const key = name.toLowerCase();
    if (userCache.has(key)) return userCache.get(key);
    const u = (await api('/users?s=' + encodeURIComponent(name)) || []).find(x => x.username.toLowerCase() === key) || null;
    if (u) userCache.set(key, u);
    return u;
  },
  linkSubtask(parentId, childId){
    return api(`/tasks/${parentId}/relations`, {method:'PUT', body:{other_task_id: childId, relation_kind: 'subtask'}});
  },
  /* Create a task per line, in order. With parent, each becomes its subtask and lands in the parent's project
     unless the line names one. Returns the ids created and how many lines were used; stops at the first error. */
  async createLines(lines, {pid, parent} = {}){
    const ids = [], problems = []; let used = 0;
    try {
      for (const line of lines) {
        const parsed = parseCapture(line, this.projects, this.parseOpts);
        if (parsed.title) {
          const t = await this.createTask(parsed, parent ? parent.project_id : pid, {parent: parent?.id});
          ids.push(t.id); problems.push(...t.problems);
        }
        used++;
      }
      return {ids, used, problems, error: null};
    } catch (error) { return {ids, used, problems, error}; }
  },
  async deleteTasks(ids){
    for (const id of [...ids].reverse()) await api('/tasks/' + id, {method:'DELETE'}).catch(() => {});
    this.render();
  },
  /* Every capture goes through the outbox: online it's sent straight away, offline it waits. */
  async submitCapture(){
    const lines = this.capLines, parsed = this.parsed;
    if (!parsed.title || this.capBusy) return;
    // A single task can go to the project picked for its @usernames; a pasted list goes where it always does.
    const pid = lines.length === 1 ? this.capProjectId : this.defaultProjectId();
    const first = parsed.project?.id || pid;
    if (!first) { this.notify('Create a project in Vikunja first'); return; }
    const nest = this.capNest && lines.length > 1;
    // Parse every line now, so dates mean what they meant when typed.
    const list = this.parseList(lines, parsed);
    const items = lines.map((raw, i) => ({raw, p: list.parsed[i]}))
      .filter(x => x.p.title).map(x => ({raw: x.raw, p: packParsed(x.p), taskId: null, done: false, linked: false}));
    const photos = this.capPhotos.map(f => Alpine.raw(f));
    const entry = {id: randomId(), user: this.user?.id, at: new Date().toISOString(), nest, pid, items, files: photos.map(fileEntry)};
    this.capBusy = true; this.capture = ''; this.capNest = false; this.capPhotos = [];
    try {
      // Saved first, with its photos, but only shown as waiting if sending doesn't finish.
      const {kept, full} = await sync.add(entry, photos);
      const r = await sync.lock(() => this.sendEntry(entry.id));
      if (r.ids?.length) { this.fresh = r.ids; clearTimeout(freshTimer); freshTimer = setTimeout(() => this.fresh = [], 2000); }
      this.placeSent(r.tasks || []);
      const n = items.length, np = photos.length;
      const but = r.problems?.length ? `, but ${r.problems.join('; ')}` : '';
      if (r.status === 'offline') {
        // It shows up in the list, tinted, unless this list wouldn't include it (say, a task due next month on Today).
        this.refreshPending();
        sync.keep();
        if (!kept) this.notify(full ? NO_ROOM : NOT_KEPT);
        else if (np && r.ids.length === n)            // the task got there; its photos are still to go
          this.notify(`Added to ${this.projById.get(r.projectId)?.title || 'project'}. ${np === 1 ? 'The photo uploads' : 'The photos upload'} when the connection's back.`, {label: 'Open', fn: () => this.openTask(r.ids[0])});
        else if (np) this.notify(`Saved offline, with ${np === 1 ? 'the photo' : np + ' photos'}. ${n === 1 && np === 1 ? 'Both go' : 'They all go'} to Vikunja when you're back online.`);
        else if (!this.pendingTasks.some(t => t.entry === entry.id && this.pendingPlace(t)))
          this.notify(`Saved offline. ${n === 1 ? 'It goes' : 'They go'} to Vikunja when you're back online.`);
      } else if (r.status === 'error') {
        this.capture = r.unsent.join('\n');                                // keep what wasn't added
        this.capPhotos = r.photos;
        const undo = r.ids.length ? {label: 'Undo', fn: () => this.deleteTasks(r.ids)} : null;
        this.notify(r.ids.length ? `Added ${r.ids.length} of ${n}${but}. Stopped: ${r.error.message}` : 'Not added: ' + r.error.message, undo);
      } else if (r.status === 'gone') {
        this.notify('Added');                                              // another tab sent it first
      } else if (n === 1) {
        // A date past next week keeps it off Today, so say which, in case quick add read it wrong.
        const due = items[0].p.due, later = due && new Date(due) >= addDays(startOfDay(), 8) ? ', due ' + dueInfo(due).label : '';
        const withPhotos = r.uploaded ? (r.uploaded === 1 ? ', with the photo' : `, with ${r.uploaded} photos`) : '';
        const where = 'Added to ' + (this.projById.get(r.projectId)?.title || 'project') + later + withPhotos;
        this.notify(where + but,{label: 'Open', fn: () => this.openTask(r.ids[0])});
      } else {
        this.notify((nest ? `Added 1 task with ${n - 1} subtask${n === 2 ? '' : 's'}` : `Added ${n} tasks`) + but, {label: 'Undo', fn: () => this.deleteTasks(r.ids)});
      }
    } finally {
      this.capBusy = false;
      this.refreshPending();
      this.render();
    }
  },
  /* Send one outbox entry, carrying on where an earlier try stopped. Returns {status: sent|offline|error|gone, ...},
     with the ids of its tasks, the tasks created this time, and how many files were uploaded. `offline` means it's
     kept to try again; `reached` that Vikunja answered, only not usefully yet (busy, or a server error on a file). */
  async sendEntry(id){
    const entry = await sync.fresh(id);
    if (!entry) return {status: 'gone', ids: [], tasks: []};                // another tab sent it
    const ids = [], tasks = [], problems = entry.problems ||= [], save = () => sync.save(entry);
    const all = () => [...entry.items.flatMap(x => x.problems || []), ...problems];
    const taken = new Set(entry.items.map(x => x.taskId).filter(Boolean));  // a pasted list can have a line twice
    let uploaded = 0;
    try {
      for (const [i, item] of entry.items.entries()) {
        const child = entry.nest && i > 0;
        await this.createTask(unpackParsed(item.p), child ? entry.parentProject : entry.pid, {
          job: item, save, at: entry.at, skip: taken, parent: child ? entry.items[0].taskId : null,
          made: t => { taken.add(t.id); tasks.push({...t, child}); if (i === 0) entry.parentProject = t.project_id; }});
        ids.push(item.taskId);
      }
      // Then the photos and files, to the task they were added to.
      const target = entry.taskId || entry.items[0]?.taskId, files = (entry.files || []).filter(f => !f.sent);
      if (files.length) { this.placeSent(tasks); this.refreshPending(); }    // the task shows while its photos upload
      for (const f of files) if (await this.sendFile(entry, target, f)) uploaded++;
      await sync.remove(entry.id);
      if (files.length) {
        this.refreshPending();
        // The task with its new attachments, for its row and its sheet.
        const t = await api('/tasks/' + target).catch(() => null);
        if (t) {
          cache.set(t.id, t); this.syncTask(t);
          for (const x of tasks) if (x.id === t.id) Object.assign(x, t);
          if (this.sheet.task?.id === t.id) { this.showTask(t); this.sheet.dirty = true; }
        }
      }
      return {status: 'sent', ids, tasks, problems: all(), uploaded, projectId: entry.parentProject};
    } catch (error) {
      // No connection, Vikunja busy, or signed out: keep it for later.
      if (passing(error) || error.again || (error instanceof ApiError && error.status === 401))
        return {status: 'offline', reached: error instanceof ApiError && error.status !== 401, ids, tasks, problems: all(), uploaded, projectId: entry.parentProject};
      // Photos added with a task that couldn't be added go back to the add box with it.
      const photos = (await Promise.all((entry.files || []).filter(f => !f.sent).map(f => sync.file(f.key)))).filter(Boolean);
      await sync.remove(entry.id);
      return {status: 'error', ids, tasks, problems: all(), error, photos, unsent: entry.items.filter(x => !x.taskId).map(x => x.raw)};
    }
  },
  // Upload one waiting file, unless an earlier try that was cut off got it there already. A file Vikunja turns down
  // (too big, say, or the task is gone) is reported and dropped; after a server error it's kept, to try again, and its
  // row says so (`trouble`). `sent` marks it as dealt with. Returns whether it's on the task.
  async sendFile(entry, taskId, f){
    const problems = entry.problems ||= [];
    let ok = false;
    try {
      if (f.tried && await this.hasAttachment(taskId, f, entry.at)) ok = true;
      else {
        const file = await sync.file(f.key);
        if (!file) problems.push(`${f.name} was lost on this device before it uploaded`);
        else {
          f.tried = true; f.triedAt = Date.now(); await sync.save(entry);
          const form = new FormData(); form.append('files', file, f.name);
          const r = await api(`/tasks/${taskId}/attachments`, {method: 'PUT', body: form});
          // Vikunja answers OK even when it turns a file down, with the reasons in `errors`.
          if (r?.errors?.length) problems.push(`${f.name} didn't upload: ${r.errors.map(e => e.message).join('; ')}`); else ok = true;
        }
      }
    } catch (e) {
      if (e instanceof ApiError && (e.status >= 500 || TRANSIENT.has(e.status))) { f.trouble = true; await sync.save(entry); e.again = true; }
      if (passing(e) || e.again || e.status === 401) throw e;
      problems.push(`${f.name} didn't upload: ${e.message}`);
    }
    f.sent = true; await sync.save(entry, [f.key]);
    return ok;
  },
  // Whether this file is on the task already, uploaded since it was added.
  async hasAttachment(taskId, f, at){
    const t = await api('/tasks/' + taskId), since = triedSince(f.triedAt, at);
    return (t?.attachments || []).some(a => a.file?.name === f.name && a.file?.size === f.size && new Date(a.created).getTime() >= since);
  },
  // Put tasks that just reached Vikunja in the list on screen, where they belong, without waiting for it to reload. On
  // a patchy connection the reload can fail, and the list on screen is then kept as it was: without them.
  placeSent(tasks){
    if (this.view.loading || this.view.route !== location.hash) return;
    let placed = false;
    for (const {child, problems, ...t} of tasks) {
      const key = this.pendingPlace({...t, child});
      if (!key || this.view.groups.some(g => g.tasks.some(x => x.id === t.id))) continue;
      const g = this.view.groups.find(g => g.key === key);
      if (g) g.tasks.push(t);
      else this.view.groups.push({...(this.route.name === 'today' ? todayGroups().find(x => x.key === key) : {key, cls: '', title: 'Open'}), tasks: [t]});
      placed = true;
    }
    // And in the copy kept for opening offline.
    const k = viewKey(this.route), s = saved.get(k);
    if (placed && s) saved.set(k, {...s, groups: this.view.groups});
  },
  // The task a cut-off try added, if it got there: this title, in this project, added by you since that try, and not
  // one of the capture's other tasks or one Pocket added for another line.
  async findSent(title, project, triedAt, at, skip = new Set(), key){
    const list = await api('/tasks?s=' + encodeURIComponent(title)) || [];
    const since = triedSince(triedAt, at);
    return list.find(t => t.title === title && t.project_id === project && t.created_by?.id === this.user?.id && !skip.has(t.id) && !sync.claimedByOther(t.id, key)
      && new Date(t.created).getTime() >= since) || null;
  },
  // Send whatever is waiting. Called when Pocket opens, comes back to the front, reconnects, and every 30 seconds.
  async flush(){
    // In a shared session, nothing is sent until Pocket knows the session is still this person's.
    if (this.signedIn && this.user && this.mode === 'session' && sharedToken.get() !== seenToken) { this.sessionChanged(); return; }
    if (this.flushing || !this.signedIn || !this.user || !sync.all(this.user.id).length) return;
    this.flushing = true;
    let sent = 0; const failed = [], tasks = [], problems = [];
    try {
      await sync.lock(async () => {
        for (const e of sync.all(this.user?.id)) {
          const r = await this.sendEntry(e.id);
          tasks.push(...(r.tasks || [])); problems.push(...(r.problems || []));
          if (r.status === 'offline' && !r.reached) break;                    // no connection: the rest can wait too
          if (r.status === 'sent') sent += r.ids.length + r.uploaded;
          if (r.status === 'error') failed.push(r);
        }
      });
    } finally { this.flushing = false; this.refreshPending(); }
    this.placeSent(tasks);
    if (failed.length) {
      this.capture = [this.capture, ...failed.flatMap(f => f.unsent)].filter(Boolean).join('\n');
      this.capPhotos = [...this.capPhotos, ...failed.flatMap(f => f.photos)];
      this.notify(`A task added offline couldn't be added: ${failed[0].error.message}. It's back in the box.`);
    } else if (problems.length) this.notify('Sent what was waiting, but ' + problems.join('; '));
    if (sent || failed.length) this.render();
  },
  async createProject(name){
    if (this.creatingProject) return;
    this.creatingProject = true;
    try {
      const p = await api('/projects', {method: 'PUT', body: {title: projectName(name)}});
      this.setProjects([...this.projects, p]);
      saved.set('projects', this.projects);
    } catch (e) {
      this.notify(e instanceof NetError ? 'Offline — you can create the project once you\'re back online' : 'Project not created: ' + e.message);
    } finally { this.creatingProject = false; }
  },
  refreshPending(){ this.pending = this.user ? sync.all(this.user.id) : []; },
  // Tasks still in the outbox, shaped like tasks so they can sit in the lists where they'll land once sent.
  get pendingTasks(){
    const out = [];
    for (const e of this.pending) {
      const parentProject = e.items[0]?.p.project?.id || e.pid;
      e.items.forEach((x, i) => {
        if (x.taskId) return;
        const p = x.p;
        out.push({id: `pending-${e.id}-${i}`, pending: true, entry: e.id, index: i, child: e.nest && i > 0, title: p.title, done: false, priority: p.priority || 0,
          due_date: p.due || ZERO, project_id: p.project?.id || (e.nest && i > 0 ? parentProject : e.pid),
          labels: [], assignees: [], repeat_after: p.repeat?.after || 0, repeat_mode: p.repeat?.mode || 0,
          waiting: i === 0 ? (e.files || []).filter(f => !f.sent).length : 0});
      });
    }
    return out;
  },
  // Photos and files on their way to tasks already in Vikunja: task id -> [{entry, key, name, ...}].
  get waitingByTask(){
    const m = new Map();
    for (const e of this.pending) {
      const id = e.taskId || e.items[0]?.taskId;
      if (id) for (const f of e.files || []) if (!f.sent && !this.dropping.includes(f.key)) m.set(id, [...(m.get(id) || []), {...f, entry: e.id}]);
    }
    return m;
  },
  // Which group of the current list a waiting task belongs in, by the same rules as the lists from Vikunja; null if none.
  pendingPlace(t){
    const r = this.route;
    if (r.name === 'project') return !r.showDone && t.project_id === r.id ? 'open' : null;
    if (r.name !== 'today') return null;
    if (!isSet(t.due_date)) return t.child ? null : 'nodate';
    const d = new Date(t.due_date), t0 = startOfDay();
    return d >= addDays(t0, 8) ? null : d < t0 ? 'overdue' : d < addDays(t0, 1) ? 'today' : 'week';
  },
  // The current list, with waiting tasks added where they belong.
  get listGroups(){
    const extra = this.pendingTasks.map(t => [this.pendingPlace(t), t]).filter(([k]) => k);
    let base = this.view.groups;
    if (this.route.name === 'today') {
      // Every group, even in a list saved offline before "Added today, no date" existed, and in one saved yesterday only today's additions.
      const t0 = startOfDay();
      base = todayGroups().map(g => {
        const b = base.find(x => x.key === g.key) || g;
        return g.key === 'nodate' ? {...b, tasks: b.tasks.filter(t => new Date(t.created) >= t0)} : b;
      });
    } else if (!extra.length) return base;
    if (!base.length && this.route.name === 'project' && this.view.project) base = [{key:'open', cls:'', title:'Open', tasks:[]}];
    return base.map(g => ({...g, tasks: [...g.tasks, ...extra.filter(([k]) => k === g.key).map(([, t]) => t)]}));
  },
  // Cancel one waiting task. Cancelling the first line of a pasted list with a parent leaves the rest as plain tasks.
  // The photos added with it go too.
  async cancelPending(entryId, index){
    await sync.lock(async () => {
      const e = await sync.fresh(entryId); if (!e) return;
      e.items.splice(index, 1);
      let drop = [];
      if (index === 0) { e.nest = false; drop = (e.files || []).map(f => f.key); e.files = []; }
      await sync.save(e, drop);
      if (entryDone(e)) await sync.remove(e.id);
    });
    this.refreshPending();
  },
  // Don't upload a waiting photo or file after all. Its row goes at once; one already uploading finishes first.
  async cancelFile(entryId, key){
    this.dropping.push(key);
    await sync.lock(async () => {
      const e = await sync.fresh(entryId); if (!e) return;
      const was = e.files.length;
      e.files = e.files.filter(f => f.key !== key || f.sent);
      if (e.files.length === was) return;                                    // uploaded meanwhile
      await sync.save(e, [key]);
      if (entryDone(e)) await sync.remove(e.id);
    });
    this.refreshPending();
    this.dropping = this.dropping.filter(k => k !== key);
  },

  /* ---------- sheet ---------- */
  openSheet(kind){
    clearTimeout(closeTimer);
    const already = this.sheet.open && this.sheet.show, dirty = already && this.sheet.dirty;   // e.g. parent -> subtask
    if (!already) lastFocus = document.activeElement;
    this.sheet = {...blankSheet(kind), open: true, show: already, dirty};
    this.picker = {open: false, loading: false, error: '', q: ''};
    const sh = document.getElementById('sheet');
    if (already) this.$nextTick(() => { sh.querySelector('.scroll').scrollTop = 0; });
    else this.$nextTick(() => { void sh.offsetHeight; this.sheet.show = true; });   // reflow so the slide-in animates
  },
  closeSheet(instant){
    if (!this.sheet.open) return;
    const dirty = this.sheet.dirty;
    this.sheet.show = false;
    const done = () => { this.sheet = blankSheet(''); this.picker.open = false; };
    clearTimeout(closeTimer);
    if (instant) done(); else closeTimer = setTimeout(done, 260);
    if (dirty && !instant) this.render();
    lastFocus?.focus?.();
  },
  initSwipe(){                                   // swipe down to close
    let y0 = null; const sh = this.$refs.sheet;
    sh.addEventListener('touchstart', e => { const sc = sh.querySelector('.scroll'); y0 = (sc.scrollTop <= 0 || e.target.closest('.bar')) ? e.touches[0].clientY : null; }, {passive:true});
    sh.addEventListener('touchmove', e => { if (y0 !== null && sliding) { y0 = null; sh.style.transform = ''; } if (y0 === null) return; const dy = e.touches[0].clientY - y0; if (dy > 0) sh.style.transform = `translateY(${dy}px)`; }, {passive:true});
    sh.addEventListener('touchend', e => { if (y0 === null) return; const dy = e.changedTouches[0].clientY - y0; sh.style.transform = ''; y0 = null; if (dy > 110) this.closeSheet(); });
  },
  // The header slides away once the list has scrolled down past it, and comes back as soon as it scrolls up a little.
  initHeader(){
    let anchor = scrollY;                        // where the current run of scrolling, down or up, turned around
    addEventListener('scroll', () => {
      const y = scrollY;
      if (y <= this.$refs.header.offsetHeight || this.route.name === 'search') { this.headerTucked = false; anchor = y; return; }
      const tucked = this.headerTucked;
      if (tucked ? y < anchor - 12 : y > anchor + 12) { this.headerTucked = !tucked; anchor = y; }
      else if (tucked ? y > anchor : y < anchor) anchor = y;
    }, {passive: true});
  },
  openAccount(){ this.openSheet('account'); },

  async openTask(id){
    this.openSheet('task');
    const mine = this.sheet, cached = cache.get(id), edits = saveCount;
    if (cached) this.showTask(cached); else this.sheet.loading = true;
    try {
      const t = await api('/tasks/' + id);
      if (this.sheet !== mine) return;
      // If something was changed while this loaded, the save already brought a newer copy; don't put the old one back.
      if (saveCount === edits) { cache.set(id, t); this.showTask(t); }
      this.loadComments(id);
    } catch (e) { if (!cached && this.sheet === mine) this.sheet.error = errText(e); }
    finally { if (this.sheet === mine) this.sheet.loading = false; }
  },
  showTask(t){
    if (this.sheet.task?.id === t.id) Object.assign(this.sheet.task, t); else this.sheet.task = {...t};
    if (document.activeElement?.id !== 'd-title') this.sheet.title = t.title;
  },
  /* Repeat settings as Vikunja stores them: repeat_mode 1 is monthly, otherwise repeat_after is an interval in seconds. */
  get repeatValue(){
    const t = this.sheet.task; if (!t) return 'none';
    if (t.repeat_mode === 1) return 'month';
    return {0: 'none', 86400: 'day', 604800: 'week', 1209600: '2weeks'}[t.repeat_after || 0] || 'custom';
  },
  get repeatOptions(){
    const opts = [{value: 'none', label: 'Doesn’t repeat'}, {value: 'day', label: 'Every day'}, {value: 'week', label: 'Every week'},
      {value: '2weeks', label: 'Every 2 weeks'}, {value: 'month', label: 'Every month'}];
    if (this.repeatValue === 'custom') {
      const days = this.sheet.task.repeat_after / 86400;
      opts.push({value: 'custom', label: Number.isInteger(days) ? `Every ${days} days` : 'Custom (set in Vikunja)'});
    }
    return opts;
  },
  setRepeat(v){
    if (v === 'custom') return;
    const patch = v === 'month' ? {repeat_mode: 1, repeat_after: 0}
      : {repeat_mode: 0, repeat_after: {none: 0, day: 86400, week: 604800, '2weeks': 1209600}[v]};
    // A repeating task needs a due date to move forward from.
    if (v !== 'none' && !isSet(this.sheet.task.due_date)) { const d = atTime(new Date(), this.dueTime); patch.due_date = (d < new Date() ? addDays(d, 1) : d).toISOString(); }
    this.save(patch);
  },
  get subtasks(){ return this.sheet.task?.related_tasks?.subtask || []; },
  get parentTask(){ return this.sheet.task?.related_tasks?.parenttask?.[0] || null; },
  async toggleSubtask(st){
    const was = st.done;
    st.done = !was;
    try {
      const full = await api('/tasks/' + st.id);          // related tasks come without labels etc.; save the full task
      const saved = await api('/tasks/' + st.id, {method:'POST', body: {...full, done: !was}});
      cache.set(st.id, saved);
      Object.assign(st, {done: saved.done, due_date: saved.due_date});
      this.sheet.dirty = true;
    } catch (e) {
      st.done = was;
      this.notify(e instanceof NetError ? 'Offline — not saved' : 'Not saved: ' + e.message);
    }
  },
  async addSubtasks(){
    const parent = this.sheet.task, lines = captureLines(this.sheet.subDraft);
    if (!parent || !lines.length || this.sheet.subBusy) return;
    this.sheet.subBusy = true;
    const r = await this.createLines(lines, {parent});
    if (this.sheet.task?.id === parent.id) {
      this.sheet.subBusy = false;
      this.sheet.subDraft = r.error ? lines.slice(r.used).join('\n') : '';
      if (r.ids.length) {
        this.sheet.dirty = true;
        try { const t = await api('/tasks/' + parent.id); cache.set(t.id, t); if (this.sheet.task?.id === t.id) this.showTask(t); } catch {}
      }
    }
    const but = r.problems.length ? `, but ${r.problems.join('; ')}` : '';
    if (r.error) this.notify(`Added ${r.ids.length} of ${lines.length}${but}. Stopped: ${r.error.message}`);
    else if (but) this.notify(`Added ${r.ids.length}${but}`);
  },
  get descHtml(){
    const d = (this.sheet.task?.description || '').replace(/<p>\s*<\/p>/g,'').trim();
    return d ? sanitize(d) : '<span class="ph">Add notes</span>';
  },

  /* Save a change to the open task. The sheet updates right away; the server's copy is applied once no other saves are queued. */
  save(patch){
    const id = this.sheet.task?.id; if (!id) return;
    Object.assign(this.sheet.task, patch);
    this.sheet.savedMsg = 'Saving…';
    pendingSaves++;
    return this.saveTask(id, patch).then(saved => {
      if (--pendingSaves || this.sheet.task?.id !== id) return;
      const repeated = patch.done === true && !saved.done;
      this.showTask(saved); this.sheet.dirty = true;
      this.sheet.savedMsg = repeated ? 'Repeats — moved to next date' : 'Saved';
      setTimeout(() => { if (this.sheet.savedMsg === 'Saved') this.sheet.savedMsg = ''; }, 1500);
    }, e => {
      pendingSaves--;
      if (this.sheet.task?.id === id) { this.sheet.savedMsg = ''; if (cache.get(id)) this.showTask(cache.get(id)); }
      this.notify(e instanceof NetError ? 'Offline — not saved' : 'Not saved: ' + e.message);
    });
  },
  // Saves changes to a task from anywhere (the sheet, a list row), one save at a time, and updates its rows.
  // Resolves to Vikunja's copy; rejects if not saved.
  saveTask(id, patch){
    saveCount++;
    const run = saveChain.then(async () => {
      // Vikunja replaces the whole task with what's sent, so the change goes onto its latest copy: anything changed
      // elsewhere since Pocket loaded the task (notes edited on the web, say) isn't put back the way it was.
      const latest = await api('/tasks/' + id);
      const saved = await api('/tasks/' + id, {method:'POST', body: {...latest, ...patch}});
      cache.set(id, saved); this.syncTask(saved);
      return saved;
    });
    saveChain = run.catch(() => {});
    return run;
  },
  nudgeProgress(step){                           // the arrow keys, on the focused bar
    const t = this.sheet.task, was = pctOf(t), pct = Math.max(0, Math.min(100, Math.round(was / 10) * 10 + step));
    if (pct !== was) this.save(progressPatch(t, pct));
  },
  saveTitle(){
    const v = this.sheet.title.trim();
    if (v && v !== this.sheet.task.title) this.save({title: v}); else this.sheet.title = this.sheet.task.title;
  },
  editDesc(){
    this.sheet.descDraft = htmlToText(this.sheet.task.description);
    this.sheet.editingDesc = true;
  },
  async saveDesc(){
    const v = this.sheet.descDraft;
    this.sheet.editingDesc = false;
    await this.save({description: v.trim() ? textToHtml(v) : ''});
  },

  /* ---------- labels ---------- */
  async toggleLabelPicker(){
    if (this.picker.open) { this.picker.open = false; return; }
    this.picker = {open: true, loading: true, error: '', q: ''};
    try { await this.loadLabels(); } catch (e) { this.picker.error = errText(e); }
    this.picker.loading = false;
  },
  get pickerMatches(){
    const have = new Set((this.sheet.task?.labels || []).map(l => l.id)), ql = this.picker.q.trim().toLowerCase();
    return this.labels.filter(l => !have.has(l.id) && (!ql || l.title.toLowerCase().includes(ql))).slice(0, 30);
  },
  get pickerCanCreate(){
    const ql = this.picker.q.trim().toLowerCase();
    return !!ql && !this.labels.some(l => l.title.toLowerCase() === ql);
  },
  setAssignees(assignees, id = this.sheet.task.id){
    if (this.sheet.task?.id === id) { this.sheet.task.assignees = assignees; this.sheet.dirty = true; }
    const c = cache.get(id); if (c) c.assignees = assignees;
    this.syncTask({id, assignees});
  },
  async assign(){
    const name = this.sheet.assignName.trim().replace(/^@/, ''), t = this.sheet.task;   // the task it started on
    if (!name) { this.sheet.assigning = false; return; }
    try {
      const u = await this.findUser(name);
      if (!u) { this.notify(`No user @${name}`); return; }
      await api(`/tasks/${t.id}/assignees`, {method:'PUT', body:{user_id: u.id}});
      this.setAssignees([...(t.assignees || []).filter(x => x.id !== u.id), u], t.id);
      if (this.sheet.task?.id === t.id) { this.sheet.assignName = ''; this.sheet.assigning = false; }
    } catch (e) { this.notify('Not assigned: ' + e.message); }
  },
  async unassign(uid){
    const t = this.sheet.task;                                                // the task it started on
    try {
      await api(`/tasks/${t.id}/assignees/${uid}`, {method:'DELETE'});
      this.setAssignees((t.assignees || []).filter(u => u.id !== uid), t.id);
    } catch (e) { this.notify('Not unassigned: ' + e.message); }
  },
  setLabels(labels, id = this.sheet.task.id){
    if (this.sheet.task?.id === id) { this.sheet.task.labels = labels; this.sheet.dirty = true; }
    const c = cache.get(id); if (c) c.labels = labels;
    this.syncTask({id, labels});
  },
  async addLabel(l){
    const t = this.sheet.task;                                                // the task it started on
    try {
      if (!l) { l = await api('/labels', {method:'PUT', body:{title: this.picker.q.trim()}}); this.labels.push(l); }
      await api(`/tasks/${t.id}/labels`, {method:'PUT', body:{label_id: l.id}});
      this.setLabels([...(t.labels || []), l], t.id);
      if (this.sheet.task?.id === t.id) this.picker.q = '';
    } catch (err) { this.notify('Label not added: ' + err.message); }
  },
  async removeLabel(lid){
    const t = this.sheet.task;                                                // the task it started on
    try {
      await api(`/tasks/${t.id}/labels/${lid}`, {method:'DELETE'});
      this.setLabels((t.labels || []).filter(l => l.id !== lid), t.id);
    } catch (e) { this.notify('Label not removed: ' + e.message); }
  },

  /* ---------- comments, attachments, delete ---------- */
  async loadComments(id){
    if (this.info && this.info.task_comments_enabled === false) { this.sheet.commentsNote = 'Comments are turned off on this server.'; return; }
    try {
      const list = await api(`/tasks/${id}/comments`) || [];
      if (this.sheet.task?.id === id) this.sheet.comments = list;
    } catch (e) { if (this.sheet.task?.id === id) this.sheet.commentsNote = errText(e); }
  },
  async postComment(){
    const id = this.sheet.task.id, v = this.sheet.commentDraft.trim(); if (!v) return;
    this.sheet.commentBusy = true;
    try { await api(`/tasks/${id}/comments`, {method:'PUT', body:{comment: textToHtml(v)}}); this.sheet.commentDraft = ''; await this.loadComments(id); }
    catch (err) { this.notify('Comment not posted: ' + err.message); }
    finally { this.sheet.commentBusy = false; }
  },
  // A blob: URL runs with this app's origin, so an HTML or SVG attachment opened that way could read the
  // saved token. Only types that can't run script open in a tab; everything else is downloaded.
  get attachmentsOn(){ return this.info?.task_attachments_enabled !== false; },
  // The files of these that this Vikunja won't take, said plainly; '' when they all fit. (Vikunja's own message about
  // it gives the wrong limit.)
  tooBig(files){
    const max = sizeLimit(this.info?.max_file_size), big = max ? files.filter(f => f.size > max) : [];
    return big.length ? `${big.map(f => `${f.name} (${fmtSize(f.size)})`).join(', ')} ${big.length === 1 ? 'is' : 'are'} too big: your Vikunja takes files up to ${this.info.max_file_size}.` : '';
  },
  // From the sheet's "Add a photo or file". They go through the outbox, so without a connection they wait on the
  // phone, shown in the sheet, and upload once Pocket reaches Vikunja again.
  async addFiles(list){
    const files = [...list], t = this.sheet.task;
    if (!files.length || !t) return;
    const big = this.tooBig(files); if (big) { this.notify(big); return; }
    const entry = {id: randomId(), user: this.user?.id, at: new Date().toISOString(), taskId: t.id, items: [], files: files.map(fileEntry)};
    const {kept, full} = await sync.add(entry, files); this.refreshPending();
    const r = await sync.lock(() => this.sendEntry(entry.id));
    this.refreshPending();
    if (r.status === 'offline') { sync.keep(); if (!kept) this.notify(full ? NO_ROOM : NOT_KEPT); }
    if (r.problems?.length) this.notify(r.problems.join('; '));
  },
  // From the add box's camera button.
  addCapPhotos(list){
    const files = [...list], big = this.tooBig(files);
    if (big) this.notify(big);
    const max = sizeLimit(this.info?.max_file_size);
    this.capPhotos.push(...files.filter(f => !max || f.size <= max));
    this.$refs.capture.focus();
  },
  async openAttachment(a){
    const inline = INLINE_TYPES.test(mimeOf(a.file?.mime));
    const w = inline ? window.open('', '_blank') : null;   // open synchronously so iOS doesn't block it
    try {
      const res = await api(`/tasks/${this.sheet.task.id}/attachments/${a.id}`, {raw:true});
      const blob = await res.blob(), type = mimeOf(blob.type);
      if (inline && INLINE_TYPES.test(type)) {
        const url = URL.createObjectURL(new Blob([blob], {type}));
        if (w) w.location = url; else location.href = url;
        setTimeout(() => URL.revokeObjectURL(url), 60000);
        return;
      }
      w?.close();
      const url = URL.createObjectURL(new Blob([blob], {type: 'application/octet-stream'}));
      Object.assign(document.createElement('a'), {href: url, download: a.file?.name || 'attachment'}).click();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    } catch (e) { w?.close(); this.notify('Couldn\'t open: ' + e.message); }
  },
  async deleteTask(){
    const t = this.sheet.task;
    if (!confirm(`Delete “${t.title}”? This can't be undone here.`)) return;
    await saveChain;
    try {
      await api('/tasks/' + t.id, {method:'DELETE'});
      cache.delete(t.id); this.removeRow(t.id);
      this.sheet.dirty = false; this.closeSheet(); this.notify('Deleted');
    } catch (e) { this.notify('Not deleted: ' + e.message); }
  },

  /* ---------- toast ---------- */
  notify(msg, action){
    this.toast = {show: true, msg, action: action || null};
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => this.toast.show = false, action ? 5000 : 2600);
  },
  runToastAction(){ const a = this.toast.action; this.toast.show = false; a?.fn(); },
})));
</script>
<script type="module">import * as chrono from './chrono-2.10.1.en.min.js'; window.chrono = chrono;</script>
