<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket</title>
<meta name="description" content="A single-file mobile web app for Vikunja, served by Vikunja itself.">
<meta name="theme-color" content="#EEF1EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1513" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pocket">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#EEF1EF; --surface:#FFFFFF; --sunk:#E3E8E5; --ink:#17201C; --muted:#5B6863; --line:#D6DDD9;
  --accent:#1D6B52; --accent-ink:#FFFFFF; --accent-soft:#D8EBE3;
  --overdue:#A82339; --today:#9A6414; --danger:#A82339;
  --r-row:14px; --r-sheet:22px; --r-chip:999px;
  --pad:16px; --cap-h:64px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F1513; --surface:#18201D; --sunk:#111816; --ink:#E7EDEA; --muted:#93A29C; --line:#26312D;
  --accent:#4FB08D; --accent-ink:#06120D; --accent-soft:#1B3A2F;
  --overdue:#F07A8B; --today:#E0A94A; --danger:#F07A8B;
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- login ---------- */
#login{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:calc(env(safe-area-inset-top) + 32px) 24px calc(env(safe-area-inset-bottom) + 32px);max-width:440px;margin:0 auto}
#login h1{font-size:40px;line-height:1.05;letter-spacing:-.02em;margin:0 0 8px;font-weight:800}
#login p.lead{color:var(--muted);margin:0 0 28px}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);outline:none;font-size:17px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:650;font-size:17px}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--line)}
.btn[disabled]{opacity:.55}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;margin-bottom:16px}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:9px;font-size:15px;color:var(--muted);font-weight:600}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.note{font-size:14px;color:var(--muted);margin:10px 0 0}
.sso-btn + .sso-btn{margin-top:10px}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px;margin:20px 0 16px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.err{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger);border-radius:12px;padding:12px 14px;font-size:15px;margin:0 0 16px;white-space:pre-line}
.err code{font-size:13px;background:rgba(0,0,0,.06);padding:1px 4px;border-radius:4px;white-space:nowrap}

/* ---------- shell ---------- */
#app{min-height:100%}
/* The header is one row: the views on the left, refresh and account on the right. It slides up out of the way while the
   list scrolls down, and back when it scrolls up. The strip under the status bar stays, so the list never shows under it. */
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);padding:calc(env(safe-area-inset-top) + 8px) var(--pad) 8px;display:flex;align-items:center;gap:6px;transition:transform .22s ease}
header.top.tucked{transform:translateY(-100%)}
#app::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:var(--bg);z-index:6}
header.top > .icon-btn{width:38px;height:38px}
nav.tabs{flex:1;min-width:0;display:flex;gap:4px}
/* searching: the search box takes the whole row */
header.top .search{display:none;flex:1;min-width:0;align-items:center;gap:8px;height:40px;padding:0 4px 0 12px;border-radius:var(--r-chip);background:var(--surface);color:var(--muted)}
header.top.searching .search{display:flex}
header.top.searching > nav.tabs,header.top.searching > .icon-btn{display:none}
header.top .search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:17px;color:var(--ink);padding:0}
header.top .search input::-webkit-search-cancel-button{-webkit-appearance:none}
header.top .search .linkish{font-weight:600;padding:8px 10px}
nav.tabs a{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px 0 11px;border-radius:var(--r-chip);color:var(--muted);text-decoration:none;font-size:15px;font-weight:650}
nav.tabs a svg{width:20px;height:20px}
nav.tabs a[aria-current=page]{background:var(--surface);color:var(--accent)}
/* a project's name, under the header, scrolling with its list */
.page-title{display:flex;align-items:center;gap:6px;margin:6px 0 0 -8px}
.page-title .t{flex:1;min-width:0}
.page-title .kicker{color:var(--muted);font-size:14px;font-weight:600}
.page-title h2{margin:0;font-size:28px;line-height:1.15;letter-spacing:-.02em;font-weight:800;overflow-wrap:anywhere}
.icon-btn{width:40px;height:40px;border-radius:20px;border:0;background:var(--surface);display:grid;place-items:center;color:var(--ink);flex:none}
.icon-btn.plain{background:transparent}
main{padding:4px var(--pad) calc(var(--cap-h) + 28px)}

.sec{margin:18px 0 6px;display:flex;align-items:baseline;gap:8px;font-weight:700;font-size:15px}
.sec .n{color:var(--muted);font-weight:600}
.sec.overdue{color:var(--overdue)} .sec.today{color:var(--today)}
.sec-date{margin-left:auto;color:var(--muted);font-weight:600;font-size:14px}
.sec-act{margin-left:auto;border:0;background:transparent;color:var(--accent);font-size:14px;font-weight:650;padding:6px 2px}
.sec-act[disabled]{opacity:.55}
.list{background:var(--surface);border-radius:var(--r-row);overflow:hidden}
.row{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-height:56px;position:relative}
.row:first-of-type{border-top:0}
.row .body{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:2px 0}
.row .title{font-size:16.5px;overflow-wrap:anywhere}
.row.done .title{color:var(--muted);text-decoration:line-through}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:3px;font-size:13.5px;color:var(--muted)}
.meta .due.overdue{color:var(--overdue);font-weight:600}
.meta .due.today{color:var(--today);font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px;background:var(--muted)}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);background:transparent;flex:none;margin-top:1px;display:grid;place-items:center;padding:0;transition:background .15s,border-color .15s}
.check svg{width:15px;height:15px;stroke:var(--accent-ink);stroke-width:3;opacity:0}
.check.p3,.check.p4,.check.p5{border-color:var(--overdue)}
.row.done .check,.check.on{background:var(--accent);border-color:var(--accent)}
.row.done .check svg,.check.on svg{opacity:1}
.empty{text-align:center;color:var(--muted);padding:48px 12px}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
.offline{margin:8px 0 0;padding:9px 12px;border-radius:12px;background:var(--sunk);color:var(--muted);font-size:14px}
/* a task added offline, not sent yet */
.row.pending{background:color-mix(in srgb,var(--accent-soft) 55%,var(--surface))}
/* a task just added lights up, then fades, to show where it went */
.row.fresh{animation:fresh 1.6s ease-out}
@keyframes fresh{0%,35%{background:var(--accent-soft)}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){.row.fresh{animation:none;background:var(--accent-soft)}}
.check.wait{border-style:dashed;opacity:.8}
/* progress: a thin bar along a row's bottom edge; while it's being set, the row fills like a volume bar */
.list:not(.tree) > .row{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.row::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:calc(var(--pct,0) * 100%);background:var(--accent);border-radius:0 2px 2px 0;pointer-events:none}
.row.setting{background:linear-gradient(to right,var(--accent-soft) calc(var(--pct) * 100%),var(--surface) 0)}
.row.setting::before,.d-head.setting::before{content:attr(data-pct);position:absolute;right:12px;top:50%;transform:translateY(-50%);z-index:1;min-width:76px;text-align:center;padding:4px 12px;border-radius:var(--r-chip);background:var(--accent);color:var(--accent-ink);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;box-shadow:0 2px 10px rgba(0,0,0,.18);pointer-events:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.tree .row{align-items:center;padding-top:14px;padding-bottom:14px}
.tree .row .body{display:flex;align-items:center;gap:10px}
.tree .chev{color:var(--muted)}
.toggle-done{margin:14px 0 0;width:100%}

/* ---------- capture bar ---------- */
#capture{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:10px var(--pad) calc(env(safe-area-inset-bottom) + 10px);background:var(--bg)}
#capture::before{content:"";position:absolute;left:0;right:0;top:-18px;height:18px;background:linear-gradient(to bottom,transparent,var(--bg));pointer-events:none}
#capture form{display:flex;gap:8px;align-items:flex-end;background:var(--surface);border:2px solid var(--accent);border-radius:16px;padding:4px 4px 4px 14px}
#capture .cap-field{flex:1;min-width:0;position:relative}
#capture textarea{position:relative;display:block;width:100%;border:0;outline:0;background:transparent;font-size:17px;line-height:1.35;padding:10px 0;resize:none;max-height:35vh;overflow-y:auto;white-space:pre-wrap;overflow-wrap:break-word;scrollbar-width:none}
/* The words quick add read: the same text, laid out the same way behind the box, with only the marks showing */
#capture .cap-marks{position:absolute;inset:0;font-size:17px;line-height:1.35;padding:10px 0;white-space:pre-wrap;overflow-wrap:break-word;overflow:hidden;color:transparent;pointer-events:none}
#capture .cap-marks mark{color:transparent;background:var(--accent-soft)}
#capture textarea::placeholder{color:var(--muted)}
#capture .go{width:42px;height:42px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
#capture .go[disabled]{opacity:.35}
#capture .cam{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;color:var(--muted);cursor:pointer}
#capture .cam.on{color:var(--accent);background:var(--accent-soft)}
#capture .cam:focus-within{outline:2.5px solid var(--accent);outline-offset:2px}
.chip.photo{cursor:pointer}
.chip svg.i{width:15px;height:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:13.5px;padding:5px 10px;border-radius:var(--r-chip);background:var(--accent-soft);color:var(--ink);border:0;white-space:nowrap}
.chip.warn{background:color-mix(in srgb,var(--today) 20%,transparent)}
.chip:not(.tap){cursor:default}
.chip.off{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--muted);text-decoration:line-through}
.chip.create{background:transparent;box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--accent);font-weight:600}
.chip.toggle{background:var(--sunk);color:var(--muted);font-weight:600}
.chip.toggle[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.chip .x{font-weight:700;opacity:.6;margin-left:2px}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}


/* ---------- sheet ---------- */
#scrim{position:fixed;inset:0;background:rgba(10,16,13,.42);z-index:20;opacity:0;transition:opacity .2s}
#scrim.show{opacity:1}
#sheet{position:fixed;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top) + 28px);z-index:21;background:var(--bg);border-radius:var(--r-sheet) var(--r-sheet) 0 0;display:flex;flex-direction:column;transform:translateY(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-width:720px;margin:0 auto}
#sheet.show{transform:none}
@media (prefers-reduced-motion:reduce){#sheet,#scrim,header.top{transition:none}}
#sheet .bar{position:relative;display:flex;align-items:center;gap:8px;padding:12px 12px 6px}
#sheet .bar .bar-meta{flex:1;min-width:0}
#sheet .bar .grab{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:flex}
/* the task's number and priority, top left */
.bar-meta-in{display:flex;align-items:center;gap:10px;padding-left:4px}
.task-id{color:var(--muted);font-size:14px;font-weight:650}
.prio-pick{position:relative;display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px 0 10px;border-radius:var(--r-chip);background:var(--surface);color:var(--muted);font-size:14px;font-weight:650}
.prio-pick:focus-within{outline:2.5px solid var(--accent);outline-offset:2px}
.prio-pick select{position:absolute;inset:0;width:100%;opacity:0;font-size:16px;cursor:pointer}
.prio-pick.p1,.prio-pick.p2{color:var(--ink)}
.prio-pick.p3,.prio-pick.p4,.prio-pick.p5{color:var(--overdue)}
/* Priority as a level: five rising bars, filled up to it; red from High up. On the sheet and in list rows. */
.bars{display:inline-flex;align-items:flex-end;gap:2px;height:14px}
.bars i{width:3px;border-radius:1px;background:var(--line)}
.bars i:nth-child(1){height:5px} .bars i:nth-child(2){height:7px} .bars i:nth-child(3){height:9px} .bars i:nth-child(4){height:12px} .bars i:nth-child(5){height:14px}
.bars.p1 i:nth-child(-n+1),.bars.p2 i:nth-child(-n+2){background:var(--ink)}
.bars.p3 i:nth-child(-n+3),.bars.p4 i:nth-child(-n+4),.bars.p5 i{background:var(--overdue)}
.meta .bars{height:12px;vertical-align:-1px}
.meta .bars.p1 i:nth-child(-n+1),.meta .bars.p2 i:nth-child(-n+2){background:var(--muted)}
.meta svg.i{width:14px;height:14px;stroke-width:2.2;vertical-align:-2px;margin-right:3px}
#sheet .bar .grab i{width:40px;height:5px;border-radius:3px;background:var(--line)}
/* While a sheet is open, the page behind it stays put: the sheet keeps its scrolling to itself, even at its ends */
body.sheet-open{overflow:hidden}
#sheet .scroll{flex:1;overflow:auto;overscroll-behavior:contain;padding:4px var(--pad) calc(env(safe-area-inset-bottom) + 32px);-webkit-overflow-scrolling:touch}
/* where the task lives, above its title */
.d-path{display:flex;align-items:center;flex-wrap:wrap;gap:2px 6px;margin:2px 0 8px 2px;color:var(--muted);font-size:14px;font-weight:600}
.d-path .dot{margin:0}
.d-parent{display:inline-flex;align-items:center;gap:6px;min-width:0}
.d-parent .linkish{font-size:14px;font-weight:600}
.d-title{display:flex;gap:12px;align-items:flex-start;margin:0 0 6px}
/* progress under the title: a bar to slide along, which thickens while it's being set */
.d-head{position:relative;margin:0 -8px;padding:4px 8px 2px;border-radius:var(--r-row)}
.d-head.setting{background:linear-gradient(to right,var(--accent-soft) calc(var(--pct) * 100%),transparent 0)}
.d-path,.d-progress{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.d-progress{display:flex;align-items:center;gap:10px;height:40px;margin:0 0 2px 42px}
.d-progress .track{flex:1;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;transition:height .12s}
.d-progress .track i{display:block;height:100%;width:calc(var(--pct) * 100%);background:var(--accent)}
.d-progress .num{width:44px;text-align:right;color:var(--muted);font-size:13px;font-weight:650}
.d-progress.setting .track{height:12px}
.d-progress.setting .num{color:var(--accent);font-size:16px}
.d-title textarea{flex:1;border:0;background:transparent;font-size:24px;font-weight:750;line-height:1.2;letter-spacing:-.01em;resize:none;outline:0;padding:0;min-height:30px}
.d-title .check{width:30px;height:30px;margin-top:0}
.card{background:var(--surface);border-radius:var(--r-row);margin-bottom:14px}
.prop{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line);min-height:52px}
.prop:first-of-type{border-top:0}
.prop .k{width:72px;flex:none;color:var(--muted);font-size:15px}
.prop .v{flex:1;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prop select,.prop input[type=datetime-local]{flex:1;min-width:0;border:0;background:transparent;font-size:16px;padding:6px 0;outline:0}
.assign-form{flex:1;min-width:120px;display:flex}
.assign-form input{flex:1;min-width:0;padding:6px 10px;border-radius:var(--r-chip);border:1.5px solid var(--line);background:var(--bg);font-size:15px;outline:0}
.assign-form input:focus{border-color:var(--accent)}
.label-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 6px 5px 10px;border-radius:var(--r-chip);background:var(--sunk);font-size:14px;border:0}
.label-chip .x{width:24px;height:24px;border-radius:12px;display:grid;place-items:center;color:var(--muted);border:0;background:transparent;padding:0}
.add-label{border:1.5px dashed var(--line);background:transparent;color:var(--muted);border-radius:var(--r-chip);padding:4px 12px;font-size:14px}
.desc{padding:14px;font-size:16px;line-height:1.5;overflow-wrap:anywhere}
.desc :first-child{margin-top:0} .desc :last-child{margin-bottom:0}
.desc a{color:var(--accent)}
.desc ul[data-type=taskList]{list-style:none;padding-left:4px}
.desc li[data-checked]::before{content:"○ ";color:var(--muted)}
.desc li[data-checked=true]::before{content:"● ";color:var(--accent)}
.desc li[data-checked] > div,.desc li[data-checked] p{display:inline}
.desc .ph{color:var(--muted)}
.desc-edit{padding:10px}
.desc-edit textarea{width:100%;min-height:140px;border:1.5px solid var(--accent);border-radius:10px;padding:10px;background:var(--bg);font-size:16px;line-height:1.45;outline:0;resize:vertical}
.row-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.h3{font-size:15px;font-weight:700;margin:22px 2px 8px;display:flex;align-items:baseline;gap:8px}
.h3 .n{color:var(--muted);font-weight:600}
.comment{padding:12px 14px;border-top:1px solid var(--line)}
.comment:first-of-type{border-top:0}
.comment .who{font-size:13.5px;color:var(--muted);margin-bottom:3px}
.comment .who b{color:var(--ink);font-weight:650}
.comment-form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.comment-form{border-top:0} .comment ~ .comment-form,.row ~ .comment-form{border-top:1px solid var(--line)}
.linkish{border:0;background:transparent;padding:0;color:var(--accent);font-size:16px;text-align:left}
.comment-form textarea{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--bg);font-size:16px;resize:none;min-height:42px;outline:0}
.comment-form textarea:focus{border-color:var(--accent)}
.att{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line);width:100%;border-left:0;border-right:0;border-bottom:0;background:transparent;text-align:left}
.att:first-of-type{border-top:0}
.att .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att .sz{color:var(--muted);font-size:13px}
.att.uploading{color:var(--muted)}
.att .icon-btn{margin:-10px -10px -10px -4px}
.att.add-att{color:var(--accent);font-weight:600;cursor:pointer}
.att.add-att:focus-within{outline:2.5px solid var(--accent);outline-offset:-2px}
.danger-zone{margin-top:28px}
.picker{padding:6px 0}
.picker button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:12px 14px;text-align:left;border-top:1px solid var(--line)}
#lp-list button:first-of-type{border-top:0}
.picker input{margin:10px 14px;width:calc(100% - 28px);padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);outline:0}
.saved{font-size:13px;color:var(--muted);text-align:right;min-height:18px;margin-top:-8px;margin-bottom:6px}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:calc(var(--cap-h) + 14px);transform:translate(-50%,20px);z-index:30;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;max-width:calc(100% - 32px);box-shadow:0 8px 28px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{border:0;background:transparent;color:var(--accent-soft);font-weight:700;padding:6px 8px}
@media (prefers-color-scheme:dark){#toast button{color:var(--accent)}}
body.sheet-open #toast{bottom:calc(env(safe-area-inset-bottom) + 20px)}
</style>
</head>
<body x-data="pocket" :class="{'sheet-open': sheet.open}" @keydown.escape.window="sheet.open && closeSheet()"
      x-effect="if (screen === 'app') document.title = head.title + ' · Pocket'">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8M4 4v4h4M4 13a8 8 0 0 0 14.3 4.9L20 16M20 20v-4h-4"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
  <symbol id="i-clip" viewBox="0 0 24 24"><path d="M21 11.5l-8.6 8.6a5 5 0 0 1-7.1-7.1l8.6-8.6a3.3 3.3 0 0 1 4.7 4.7l-8.6 8.6a1.7 1.7 0 0 1-2.4-2.4l7.9-7.9"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></symbol>
  <symbol id="i-subtasks" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></symbol>
  <symbol id="i-comment" viewBox="0 0 24 24"><path d="M5 5h14a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-8l-4 4v-4H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8.5h3.2L9 6h6l1.8 2.5H20V19H4z"/><circle cx="12" cy="13.5" r="3.3"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.4-4.4"/></symbol>
</svg>

<!-- ============ LOGIN ============ -->
<section id="login" :hidden="screen !== 'login'" hidden>
  <h1>Pocket</h1>
  <p class="lead">Today's tasks and quick capture for your Vikunja.</p>
  <div id="login-err" class="err" :hidden="!login.err" x-html="login.err" hidden></div>

  <template x-if="!info && !login.err"><p class="note">Connecting…</p></template>
  <template x-if="!info && login.err"><button class="btn ghost block" type="button" @click="probe()">Try again</button></template>

  <div id="auth-step" :hidden="!info" hidden>
    <template x-if="providers.length"><div id="sso">
      <template x-for="p in providers" :key="p.key"><button type="button" class="btn block sso-btn" @click="signInWith(p)" x-text="'Sign in with ' + p.name"></button></template>
      <template x-if="login.waiting"><p class="note">Finish signing in in the other tab. Pocket continues by itself.</p></template>
      <!-- The home-screen app signs in in the same window, and the provider can only return to Vikunja's page. -->
      <template x-if="INSTALLED"><p class="note">After signing in, Vikunja's page opens. Close it to come back to Pocket.</p></template>
      <p class="or">or</p>
    </div></template>
    <div class="seg" role="group" aria-label="Sign-in method" :hidden="!passwordAllowed">
      <button type="button" data-mode="session" :aria-pressed="String(login.method === 'session')" @click="login.method = 'session'">Password</button>
      <button type="button" data-mode="token" :aria-pressed="String(login.method === 'token')" @click="login.method = 'token'">API token</button>
    </div>
    <form id="f-pass" :hidden="login.method !== 'session'" @submit.prevent="submitPassword()">
      <label class="field"><span>Username or email</span><input id="in-user" x-ref="inUser" x-model="login.user" autocomplete="username" autocapitalize="off" spellcheck="false" required></label>
      <label class="field"><span>Password</span><input id="in-pass" x-model="login.pass" type="password" autocomplete="current-password" required></label>
      <label class="field" id="totp-field" :hidden="!login.showTotp" hidden><span>Two-factor code</span><input id="in-totp" x-ref="inTotp" x-model="login.totp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*"></label>
      <button class="btn block" type="submit" :disabled="login.busy">Sign in</button>
    </form>
    <form id="f-token" :hidden="login.method !== 'token'" @submit.prevent="submitToken()" hidden>
      <label class="field"><span>API token</span><input id="in-token" x-ref="inToken" x-model="login.token" autocapitalize="off" spellcheck="false" required placeholder="tk_…"></label>
      <button class="btn block" type="submit" :disabled="login.busy">Connect</button>
      <p class="note">Create one in Vikunja under Settings → API Tokens. Pick the “Task Management” preset, then also tick “User” and “Users” under Other, and “Projectusers” under Projects.</p>
    </form>
  </div>
</section>

<!-- ============ APP ============ -->
<div id="app" :hidden="screen !== 'app'" hidden>
  <!-- Slides away as the list scrolls down, and back as soon as it scrolls up (initHeader). While searching, it holds the
       search box instead; that's always here, hidden, so the magnifier can focus it during the tap and the phone's
       keyboard opens (see openSearch). -->
  <header class="top" x-ref="header" :class="{tucked: headerTucked, searching: route.name === 'search'}">
    <form class="search" role="search" @submit.prevent="$refs.searchIn.blur()">
      <svg class="i"><use href="#i-search"/></svg>
      <input type="search" id="in-search" x-ref="searchIn" x-model="searchQ" placeholder="Search tasks" aria-label="Search tasks"
             enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button type="button" id="btn-search-cancel" class="linkish" @click="closeSearch()">Cancel</button>
    </form>
    <nav class="tabs" aria-label="Views">
      <a href="#/today" data-tab="today" :aria-current="route.name === 'today' ? 'page' : null"><svg class="i"><use href="#i-sun"/></svg>Today</a>
      <a href="#/projects" data-tab="projects" :aria-current="route.name !== 'today' ? 'page' : null"><svg class="i"><use href="#i-folder"/></svg>Projects</a>
    </nav>
    <button id="btn-search" class="icon-btn" aria-label="Search" @click="openSearch()"><svg class="i"><use href="#i-search"/></svg></button>
    <button id="btn-refresh" class="icon-btn" aria-label="Refresh" :disabled="refreshing" @click="refresh()"><svg class="i"><use href="#i-refresh"/></svg></button>
    <button id="btn-account" class="icon-btn" aria-label="Account" @click="openAccount()"><svg class="i"><use href="#i-user"/></svg></button>
  </header>

  <main id="view" aria-live="polite">
    <template x-if="route.name === 'project'"><div class="page-title">
      <button id="btn-back" class="icon-btn plain" aria-label="Back to projects" @click="go('#/projects')"><svg class="i"><use href="#i-back"/></svg></button>
      <div class="t"><template x-if="head.kicker"><div class="kicker" id="kicker" x-text="head.kicker"></div></template><h2 id="heading" x-text="head.title"></h2></div>
    </div></template>
    <template x-if="offline"><p class="offline" role="status" x-text="route.name === 'search' ? 'Offline. Searching needs a connection to Vikunja.' : 'Offline' + (view.savedAt ? ' · showing tasks from ' + new Date(view.savedAt).toLocaleString([], {weekday: 'short', hour: 'numeric', minute: '2-digit'}) : '') + '. New tasks and photos are sent when you\'re back online.'"></p></template>
    <template x-if="view.loading"><div class="loading">Loading…</div></template>

    <template x-if="!view.loading && view.error"><div>
      <div class="err" style="margin-top:16px" x-html="view.error"></div>
      <button class="btn ghost block" @click="view.bootFailed ? boot() : render()">Try again</button>
      <template x-if="view.bootFailed"><button class="btn danger block" style="margin-top:8px" @click="signOut()">Sign out</button></template>
    </div></template>

    <!-- Today and a single project share the task-list markup -->
    <template x-if="!view.loading && !view.error && route.name !== 'projects'"><div>
      <template x-for="g in listGroups.filter(g => g.tasks.length)" :key="g.key"><div>
        <div class="sec" :class="g.cls"><span x-text="g.title"></span><span class="n num" x-text="g.tasks.length"></span>
          <template x-if="g.key === 'today'"><span class="sec-date" x-text="todayDate"></span></template>
          <template x-if="g.key === 'overdue'"><button type="button" class="sec-act" id="btn-overdue-today" :disabled="movingOverdue" @click="moveOverdueToToday()" x-text="movingOverdue ? 'Moving…' : 'Move all to today'"></button></template></div>
        <div class="list">
          <template x-for="t in g.tasks" :key="t.id">
            <div class="row" :class="{done: t.done, pending: t.pending, fresh: fresh.includes(t.id)}" :data-id="t.id" :style="{'--pct': t.done ? 0 : t.percent_done || 0}">
              <button class="check" :class="'p' + (t.priority || 0) + (t.pending ? ' wait' : '')" :disabled="!!t.pending" :aria-label="(t.done ? 'Mark not done: ' : 'Mark done: ') + t.title" @click="toggleDone(t, $el.closest('.row'))"><svg class="i"><use href="#i-check"/></svg></button>
              <button class="body" @click="t.pending || openTask(t.id)">
                <div class="title"><template x-if="t.pending"><span class="sr">Not sent yet: </span></template><span x-text="t.title"></span><template x-if="!t.done && pctOf(t)"><span class="sr" x-text="', progress ' + pctOf(t) + '%'"></span></template></div>
                <div class="meta" x-show="rowMeta(t).length">
                  <template x-for="m in rowMeta(t)" :key="m.key"><span :class="m.cls" :aria-label="m.label"><template x-if="m.color"><i class="dot" :style="{background: m.color}"></i></template><template x-if="m.icon"><svg class="i"><use :href="'#i-' + m.icon"/></svg></template><template x-if="m.prio"><span class="bars" :class="'p' + m.prio"><i></i><i></i><i></i><i></i><i></i></span></template><span x-text="m.text"></span></span></template>
                </div>
              </button>
              <template x-if="t.pending"><button class="icon-btn plain" :aria-label="'Cancel ' + t.title" @click="cancelPending(t.entry, t.index)"><svg class="i"><use href="#i-close"/></svg></button></template>
            </div>
          </template>
        </div>
      </div></template>
      <template x-if="!listGroups.some(g => g.tasks.length)"><div class="empty"><b x-text="emptyText.title"></b><span x-text="emptyText.body"></span></div></template>
      <template x-if="route.name === 'project' && view.project"><a class="btn ghost toggle-done" :href="'#/project/' + view.project.id + (route.showDone ? '' : '?done=1')" x-text="route.showDone ? 'Show open tasks' : 'Show done tasks'"></a></template>
    </div></template>

    <template x-if="!view.loading && !view.error && route.name === 'projects'"><div>
      <template x-if="!projects.length"><div class="empty"><b>No projects yet.</b>Create one in Vikunja on the web.</div></template>
      <template x-if="favorites.length"><div>
        <div class="sec">Favorites</div>
        <div class="list tree"><template x-for="p in favorites" :key="p.id">
          <div class="row"><button class="body" @click="go('#/project/' + p.id)"><i class="dot" style="width:10px;height:10px;margin:0" :style="{background: colorOf(p.hex_color)}"></i><span style="flex:1" x-text="p.title"></span><svg class="i chev"><use href="#i-chev"/></svg></button></div>
        </template></div>
      </div></template>
      <template x-if="projects.length"><div>
        <div class="sec">All projects</div>
        <div class="list tree"><template x-for="r in tree" :key="r.p.id">
          <div class="row"><button class="body" :style="{paddingLeft: r.depth * 18 + 'px'}" @click="go('#/project/' + r.p.id)"><i class="dot" style="width:10px;height:10px;margin:0" :style="{background: colorOf(r.p.hex_color)}"></i><span style="flex:1" x-text="r.p.title"></span><svg class="i chev"><use href="#i-chev"/></svg></button></div>
        </template></div>
      </div></template>
    </div></template>
  </main>

  <div id="capture" x-ref="captureBar" :hidden="route.name === 'search'">
    <form id="f-capture" autocomplete="off" @submit.prevent="submitCapture()">
      <div class="cap-field">
        <div class="cap-marks" id="cap-marks" x-ref="capMarks" aria-hidden="true" x-html="capMarksHtml"></div>
        <textarea id="in-capture" x-ref="capture" x-model="capture" rows="1" :placeholder="capPhotos.length ? 'What\'s this photo for?' : 'Add a task'" aria-label="New task" enterkeyhint="send"
                  x-effect="capture; $nextTick(() => grow($el))"
                  @keydown.enter="if (!$event.shiftKey && !$event.isComposing) { $event.preventDefault(); submitCapture(); }"
                  @input="capCaret = $el.selectionStart" @click="capCaret = $el.selectionStart" @keyup="capCaret = $el.selectionStart"
                  @scroll="$refs.capMarks.scrollTop = $el.scrollTop"
                  @focus="capFocus = true" @blur="setTimeout(() => capFocus = document.activeElement === $el, 150)"></textarea>
      </div>
      <template x-if="attachmentsOn"><label class="cam" :class="{on: capPhotos.length}" title="Attach a photo to the new task">
        <svg class="i"><use href="#i-camera"/></svg>
        <input type="file" id="in-photo" class="sr" accept="image/*" multiple aria-label="Attach a photo to the new task" @change="addCapPhotos($event.target.files); $event.target.value = ''">
      </label></template>
      <button class="go" type="submit" aria-label="Add task" :disabled="!parsed.title || capBusy"><svg class="i"><use href="#i-up"/></svg></button>
    </form>
    <div class="chips" id="cap-chips" :hidden="!chips.length && !(capFocus && !capture)">
      <template x-if="capLines.length > 1"><button type="button" class="chip toggle" id="cap-nest" :aria-pressed="String(capNest)" @mousedown.prevent @click="capNest = !capNest">↳ Under first line</button></template>
      <template x-if="capFocus && !capture"><span class="hint" x-text="captureHint"></span></template>
      <template x-for="c in chips" :key="c.key"><button type="button" class="chip" :class="(c.cls || '') + (c.kind ? ' tap' : '') + (c.off ? ' off' : '')" :data-kind="c.kind || null"
        :tabindex="c.kind ? 0 : -1" :title="c.hint || (c.kind ? (c.off ? 'Tap to use this' : 'Tap to keep these words in the title') : null)"
        @mousedown.prevent @click="c.action ? c.action() : c.kind && (capIgnore = {...capIgnore, [c.kind]: !capIgnore[c.kind]})"><template x-if="c.color"><i class="dot" :style="{background: c.color}"></i></template><template x-if="c.icon"><svg class="i"><use :href="'#i-' + c.icon"/></svg></template><span x-text="c.text"></span></button></template>
    </div>
  </div>
</div>

<!-- ============ SHEET ============ -->
<div id="scrim" :hidden="!sheet.open" :class="{show: sheet.show}" @click="closeSheet()" hidden></div>
<section id="sheet" x-ref="sheet" role="dialog" aria-modal="true" :aria-label="sheet.kind === 'account' ? 'Account' : 'Task'" :hidden="!sheet.open" :class="{show: sheet.show}" hidden>
  <div class="bar">
    <div class="bar-meta"><template x-if="sheet.kind === 'task' && sheet.task"><div class="bar-meta-in">
      <!-- Priority as a level, 1 to 5 bars; the phone's own picker, laid over it, changes it -->
      <label class="prio-pick" :class="'p' + (sheet.task.priority || 0)">
        <span class="bars" :class="'p' + (sheet.task.priority || 0)" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        <span x-text="sheet.task.priority ? PRIOS[sheet.task.priority].label : 'Priority'"></span>
        <select id="d-prio" aria-label="Priority" @change="save({priority: +$event.target.value})">
          <template x-for="p in PRIOS" :key="p.n"><option :value="p.n" :selected="(sheet.task.priority || 0) === p.n" x-text="p.label"></option></template>
        </select>
      </label>
    </div></template></div>
    <div class="grab"><i></i></div>
    <template x-if="sheet.kind === 'task' && sheet.task?.identifier"><span class="num task-id" id="d-id" x-text="sheet.task.identifier"></span></template>
    <button class="icon-btn" id="btn-sheet-close" aria-label="Close" @click="closeSheet()"><svg class="i"><use href="#i-close"/></svg></button>
  </div>
  <div class="scroll" id="sheet-body">
    <template x-if="sheet.kind === 'task' && sheet.loading"><div class="loading">Loading…</div></template>
    <template x-if="sheet.kind === 'task' && sheet.error"><div class="err" x-html="sheet.error"></div></template>

    <template x-if="sheet.kind === 'task' && sheet.task"><div>
      <div class="d-head">
        <!-- Where the task lives: its project, and the task it's part of -->
        <div class="d-path" id="d-path">
          <i class="dot" :style="{background: colorOf(projById.get(sheet.task.project_id)?.hex_color)}"></i><span x-text="projById.get(sheet.task.project_id)?.title || 'Project'"></span>
          <template x-if="parentTask"><span class="d-parent"><span aria-hidden="true">›</span><button class="linkish" id="d-parent" @click="openTask(parentTask.id)" x-text="parentTask.title"></button></span></template>
        </div>
        <div class="d-title">
          <button class="check" id="d-done" :class="'p' + (sheet.task.priority || 0) + (sheet.task.done ? ' on' : '')" :aria-label="sheet.task.done ? 'Mark not done' : 'Mark done'" @click="save({done: !sheet.task.done})"><svg class="i"><use href="#i-check"/></svg></button>
          <textarea id="d-title" rows="1" aria-label="Title" enterkeyhint="done" x-model="sheet.title"
                    x-effect="sheet.title; $nextTick(() => grow($el))"
                    @keydown.enter.prevent="$el.blur()" @change="saveTitle()"></textarea>
        </div>
        <!-- Progress, as in the list: hold the bar, or around the title, then slide (initSheetProgress) -->
        <div class="d-progress" id="d-progress" role="slider" tabindex="0" aria-label="Progress" aria-valuemin="0" aria-valuemax="100"
             :aria-valuenow="sheet.pct ?? pctOf(sheet.task)" :aria-valuetext="(sheet.pct ?? pctOf(sheet.task)) + '%'" :class="{setting: sheet.pct !== null}"
             :style="{'--pct': (sheet.pct ?? pctOf(sheet.task)) / 100}"
             @keydown.right.prevent="nudgeProgress(10)" @keydown.left.prevent="nudgeProgress(-10)">
          <span class="track"><i></i></span><span class="num" x-text="(sheet.pct ?? pctOf(sheet.task)) + '%'"></span>
        </div>
      </div>
      <div class="saved" id="d-saved" x-text="sheet.savedMsg"></div>

      <div class="card">
        <div class="prop"><span class="k">Due</span><span class="v">
          <input type="datetime-local" id="d-due" aria-label="Due date" :value="toLocalInput(sheet.task.due_date)" @change="save({due_date: fromLocalInput($event.target.value)})">
          <template x-if="isSet(sheet.task.due_date)"><button class="icon-btn plain" id="d-due-clear" aria-label="Clear due date" @click="save({due_date: ZERO})"><svg class="i"><use href="#i-close"/></svg></button></template>
        </span></div>
      </div>

      <div class="h3">Notes</div>
      <div class="card" id="d-desc-card">
        <template x-if="!sheet.editingDesc"><div class="desc" id="d-desc" role="button" tabindex="0" aria-label="Edit notes" x-html="descHtml" @click="$event.target.closest('a') || editDesc()" @keydown.enter="editDesc()"></div></template>
        <template x-if="sheet.editingDesc"><div class="desc-edit">
          <textarea id="d-desc-in" aria-label="Notes" x-model="sheet.descDraft" x-init="$nextTick(() => $el.focus())"></textarea>
          <template x-if="RICH.test(sheet.task.description || '')"><p class="note" style="margin:6px 2px">These notes have formatting. Saving here keeps the text but drops links and lists.</p></template>
          <div class="row-actions"><button class="btn ghost" id="d-desc-cancel" @click="sheet.editingDesc = false">Cancel</button><button class="btn" id="d-desc-save" @click="saveDesc()">Save notes</button></div>
        </div></template>
      </div>

      <template x-if="attachmentsOn || (sheet.task.attachments || []).length"><div>
        <div class="h3">Attachments<span class="n num" x-text="(sheet.task.attachments || []).length + (waitingByTask.get(sheet.task.id) || []).length || ''"></span></div>
        <div class="card" id="d-attachments">
          <template x-for="a in sheet.task.attachments || []" :key="a.id">
            <button class="att" @click="openAttachment(a)"><svg class="i"><use href="#i-clip"/></svg><span class="nm" x-text="a.file?.name || 'file'"></span><span class="sz num" x-text="fmtSize(a.file?.size)"></span></button>
          </template>
          <!-- Added here or with the task, not in Vikunja yet: they wait on the phone while there's no connection -->
          <template x-for="f in waitingByTask.get(sheet.task.id) || []" :key="f.key">

<div id="toast" role="status" :class="{show: toast.show}"><span id="toast-msg" x-text="toast.msg"></span><button id="toast-act" :hidden="!toast.action" x-text="toast.action?.label" @click="runToastAction()" hidden></button></div>

<script>
'use strict';
/* =============== helpers =============== */
const store = {
  get(k){ try{ return localStorage.getItem('pocket.'+k) }catch{ return null } },
  set(k,v){ try{ localStorage.setItem('pocket.'+k,v) }catch{} },
  del(k){ try{ localStorage.removeItem('pocket.'+k) }catch{} },

const TZ = Intl.DateTimeFormat().resolvedOptions().timeZone;
const ZERO = '0001-01-01T00:00:00Z';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const colorOf = hex => /^#?([0-9a-f]{3,4}|[0-9a-f]{6}|[0-9a-f]{8})$/i.test(hex || '') ? '#' + hex.replace('#','') : 'var(--muted)';
const INLINE_TYPES = /^(image\/(png|jpeg|gif|webp|avif)|application\/pdf|text\/plain)$/;
const mimeOf = t => String(t || '').split(';')[0].trim().toLowerCase();
// Vikunja's upload limit as it states it in /info ("20MB"), in bytes; null if it doesn't say.
function sizeLimit(text){
  const m = String(text || '').trim().match(/^(\d+(?:\.\d+)?)\s*([KMG]?)B?$/i);
  return m ? +m[1] * {'': 1, K: 1024, M: 1048576, G: 1073741824}[m[2].toUpperCase()] : null;
}
const fmtSize = n => !n ? '' : n < 1024 ? n + ' B' : n < 1048576 ? (n/1024).toFixed(0) + ' KB' : (n/1048576).toFixed(1) + ' MB';
const PRIOS = [{n:0,label:'No priority'},{n:1,label:'Low'},{n:2,label:'Medium'},{n:3,label:'High'},{n:4,label:'Urgent'},{n:5,label:'Do now'}];
// Fit a text box to its text. A hidden box measures 0, so leave its height alone until it can be measured.
const grow = ta => { ta.style.height = 'auto'; if (ta.scrollHeight) ta.style.height = ta.scrollHeight + 'px'; };
const cache = new Map();                       // task id -> latest task from the server
const userCache = new Map();                   // lowercased username -> user
let peopleLoading = null;                      // loadPeople() while it runs
let app;                                       // the Alpine component, set in init()

/* =============== API =============== */
class ApiError extends Error { constructor(status, msg, code){ super(msg); this.status=status; this.code=code; } }
class NetError extends Error {}
// Worth trying again later: no connection, or Vikunja (or a proxy in front of it) busy or timing out. Any other
// answer is final, a 500 included, so a request Vikunja can't handle doesn't sit in the outbox for ever.
const TRANSIENT = new Set([408, 429, 502, 503, 504]);
const passing = e => e instanceof NetError || (e instanceof ApiError && TRANSIENT.has(e.status));

/* Two ways to be signed in:
   - 'session': Vikunja's own web sign-in (password or single sign-on), shared with Vikunja's web app on this device.
     The token lives where Vikunja keeps it (localStorage "token") and is renewed with Vikunja's refresh cookie.
   - 'token': an API token, kept by Pocket alone. */
const sharedToken = {
  get(){ try { return localStorage.getItem('token') || ''; } catch { return ''; } },
  set(t){ try { localStorage.setItem('token', t); } catch {} },
  del(){ try { localStorage.removeItem('token'); } catch {} },
};
// Home-screen app, as opposed to a browser tab.
const INSTALLED = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
// When this copy of Pocket was put on the server: the page's Last-Modified, which the browser gives in local time as
// "MM/DD/YYYY hh:mm:ss" (or the time now, if the server didn't say).
const LOADED = (m => m && new Date(m[3], m[1] - 1, m[2], m[4], m[5], m[6]))(document.lastModified.match(/(\d+)\/(\d+)\/(\d+) (\d+):(\d+):(\d+)/));

// Renew the shared session the way Vikunja's own tabs do. The refresh cookie works once and is replaced on every
// renewal, so renewals take Vikunja's "vikunja-token-refresh" lock, and if someone else renewed while we waited,
// their new token is used instead of spending the cookie again.
let refreshing = null;
let seenToken = '';                              // the shared session's token when Pocket last checked whose it is
let confirming = null;                           // app.confirmAccount() while it runs
let serverOffset = null;                         // Vikunja's clock minus the phone's, from its replies' Date header
// A moment on the phone's clock, on Vikunja's.
const serverTime = ms => ms + (serverOffset ?? 0);
/* The earliest a cut-off try can have created something, on Vikunja's clock: when it was sent, less 3 seconds for the
   Date header's whole seconds and the time the reply took to arrive. So something with the same name made before the
   try, on the web say, isn't taken for it. Without that time (an entry saved before it was kept), from 2 minutes
   before the capture. Vikunja has no way to tag a request, so a same-name task made elsewhere in those few seconds
   after the try could still be. */
const triedSince = (triedAt, at) => triedAt ? serverTime(triedAt) - 3000 : new Date(at).getTime() - 2 * 60000;
function refreshSession(){
  if (refreshing) return refreshing;
  const before = sharedToken.get();
  const renew = async () => {
    const now = sharedToken.get();
    if (now && now !== before) return true;
    let r, j;
    try { r = await fetch(app.server + '/api/v1/user/token/refresh', {method:'POST', credentials:'include'}); }
    catch (e) { throw new NetError(e.message); }
    // Only Vikunja turning the renewal down ends the session; a busy server or a dropped connection doesn't.
    if (TRANSIENT.has(r.status)) throw new NetError('HTTP ' + r.status);
    if (!r.ok) return false;
    try { j = await r.json(); } catch (e) { throw new NetError(e.message); }
    if (!j.token) return false;
    sharedToken.set(j.token);
    if (seenToken === before) seenToken = j.token;                           // renewed by us: still the same person
    return true;
  };
  refreshing = (async () => {
    try { return navigator.locks ? await navigator.locks.request('vikunja-token-refresh', renew) : await renew(); }
    catch (e) { if (e instanceof NetError) throw e; return false; }
    finally { refreshing = null; }
  })();
  return refreshing;
}

async function api(path, {method='GET', body, raw=false, auth=true, retry=true} = {}){
  // A change is only sent once Pocket knows the shared session is still this person's: another tab may have signed
  // someone else in. (Reading is fine.) The token is read after that, so it's the one that was checked.
  if (auth && method !== 'GET' && app?.mode === 'session' && app.signedIn && app.user && sharedToken.get() !== seenToken
    && !await app.confirmAccount()) throw new ApiError(401, 'Someone else is signed in now');
  const headers = {};
  const token = app.mode === 'session' ? sharedToken.get() : app.token;
  if (auth && token) headers.Authorization = 'Bearer ' + token;
  const form = body instanceof FormData;                                       // files: the browser sets the type
  if (body !== undefined && !form) headers['Content-Type'] = 'application/json';
  let res;
  try {
    res = await fetch(app.server + '/api/v1' + path, {
      method, headers, body: body === undefined || form ? body : JSON.stringify(body),
      credentials: app.mode === 'session' ? 'include' : 'omit',
    });
  } catch (e) { if (app) app.offline = true; throw new NetError(e.message) }
  // Reaching Vikunja again sends what's waiting. A brief drop never fires the browser's "online" event.
  if (app?.offline) { app.offline = false; setTimeout(() => app.flush()); }
  const date = Date.parse(res.headers.get('date') || '');
  if (date) serverOffset = date - Date.now();
  if (res.status === 401 && auth && retry && app.mode === 'session') {
    let renewed;
    try { renewed = await refreshSession(); } catch (e) { app.offline = true; throw e; }
    if (renewed) return api(path, {method, body, raw, auth, retry:false});
  }
  if (res.status === 401 && auth) {
    // Vikunja also answers 401 when an API token lacks a permission, so check the token before signing out.
    if (app.mode === 'token' && path !== '/user' && await tokenWorks()) throw new ApiError(403, 'Your API token doesn\'t allow this. Create one with the permissions listed on the sign-in screen.');
    app.signOut('Your session ended. Sign in again.', {tellServer: false}); throw new ApiError(401, 'Signed out');
  }
  if (!res.ok) {
    let j = {}; try { j = await res.json() } catch {}
    throw new ApiError(res.status, j.message || res.statusText || ('HTTP ' + res.status), j.code);
  }
  if (raw) return res;
  if (res.status === 204) return null;
  // A reply cut off half way is a lost connection too, not an error from Vikunja.
  let t; try { t = await res.text(); } catch (e) { app.offline = true; throw new NetError(e.message); }
  return t ? JSON.parse(t) : null;
}

async function tokenWorks(){
  try { return (await fetch(app.server + '/api/v1/user', {headers: {Authorization: 'Bearer ' + app.token}})).ok; }
  catch { return false; }
}

async function allPages(path){
  const out = [];
  for (let page = 1; page <= 40; page++) {
    const res = await api(path + (path.includes('?') ? '&' : '?') + 'page=' + page + '&per_page=50', {raw:true});
    let data; try { data = await res.json(); } catch (e) { throw new NetError(e.message); }
    if (Array.isArray(data)) out.push(...data);
    const total = parseInt(res.headers.get('x-pagination-total-pages') || '1', 10);
    if (!Array.isArray(data) || data.length === 0 || page >= total) break;
  }
  return out;
}

function netHelp(){
  return `Can't reach Vikunja at ${esc(location.origin)}. Check your connection, then try again.`;
}
function errText(e){
  if (e instanceof NetError) return netHelp();
  if (e instanceof ApiError && e.status === 429) return 'Too many attempts from here. Wait a minute, then try again.';
  return esc(e.message || String(e));
}

/* =============== dates =============== */
const isSet = d => d && !String(d).startsWith('0001');
const startOfDay = (d=new Date()) => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const fmtTime = d => d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
function dueInfo(due){
  if (!isSet(due)) return null;
  const d = new Date(due), today = startOfDay(), dd = startOfDay(d);
  const diff = Math.round((dd - today) / 864e5);
  const hasTime = !(d.getHours() === 0 && d.getMinutes() === 0) && !(d.getHours() === 12 && d.getMinutes() === 0);
  let label;
  if (diff === 0) label = 'Today';
  else if (diff === 1) label = 'Tomorrow';
  else if (diff === -1) label = 'Yesterday';
  else if (diff < -1 && diff > -7) label = diff * -1 + ' days ago';
  else if (diff > 1 && diff < 7) label = d.toLocaleDateString([], {weekday:'long'});
  else label = d.toLocaleDateString([], {day:'numeric', month:'short', year: d.getFullYear() !== today.getFullYear() ? 'numeric' : undefined});
  if (hasTime && Math.abs(diff) < 7) label += ' ' + fmtTime(d);
  return {label, cls: diff < 0 ? 'overdue' : diff === 0 ? 'today' : '', diff};
}
const toLocalInput = iso => { if (!isSet(iso)) return ''; const d = new Date(iso); const p = n => String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; };
const fromLocalInput = v => v ? new Date(v).toISOString() : ZERO;
const repeats = t => !!(t.repeat_after || t.repeat_mode === 1);

/* =============== progress =============== */
/* Vikunja keeps a task's progress in percent_done, from 0 to 1. Pocket sets it in steps of 10%, and 100% marks the
   task done. A repeating task then starts its next time at 0%. */
const pctOf = t => Math.round((t?.percent_done || 0) * 100);
const progressPatch = (t, pct) => pct >= 100 ? {done: true, percent_done: repeats(t) ? 0 : 1} : {percent_done: pct / 100};
const HOLD_MS = 450;                             // hold this long to start setting progress
let sliding = false;                             // progress is being set: the sheet doesn't swipe away meanwhile

/* =============== HTML description helpers =============== */
// Task notes and comments are HTML written by anyone who shares the project, so only a small set of
// formatting tags survives. Alpine runs directives found in x-html content, so attributes are stripped too.
const XHTML = 'http://www.w3.org/1999/xhtml';
const ALLOWED = new Set(['p','br','b','strong','i','em','u','s','del','ul','ol','li','a','code','pre','blockquote','h1','h2','h3','h4','h5','h6','span','div','mark','hr','table','thead','tbody','tr','td','th']);
const DROPPED = new Set(['script','style','iframe','frame','frameset','object','embed','template','form','input','label','textarea','select','button','noscript','link','meta','base','title']);
// Parse in an inert document: nothing loads or runs, and <frameset> can't replace the body.
function parseFragment(html){
  const root = document.implementation.createHTMLDocument('').createElement('div');
  root.innerHTML = html || '';
  return root;
}
// Only absolute http(s) and mailto links, written back in normalized form.
function safeHref(v){
  try { const u = new URL((v || '').trim()); return /^(https?|mailto):$/.test(u.protocol) ? u.href : ''; } catch { return ''; }
}
function sanitize(html){
  const root = parseFragment(html);
  (function clean(el){
    let n = el.firstChild;
    while (n) {
      if (n.nodeType === 3) { n = n.nextSibling; continue; }
      const tag = n.nodeType === 1 && n.namespaceURI === XHTML ? n.localName : '';   // SVG/MathML count as unknown
      if (!ALLOWED.has(tag)) {
        if (tag === 'img') { const t = n.ownerDocument.createTextNode('[image]'); n.replaceWith(t); n = t.nextSibling; continue; }
        if (!tag || DROPPED.has(tag)) { const next = n.nextSibling; n.remove(); n = next; continue; }
        // Unknown HTML tag: keep its contents in place and carry on from the first of them.
        const next = n.firstChild || n.nextSibling; n.replaceWith(...n.childNodes); n = next; continue;
      }
      for (const a of [...n.attributes]) {
        const keep = (tag === 'a' && a.name === 'href' && safeHref(a.value))
          || (a.name === 'data-type' && a.value === 'taskList') || (a.name === 'data-checked' && /^(true|false)$/.test(a.value));
        if (!keep) n.removeAttribute(a.name);
      }
      if (tag === 'a') {
        if (n.hasAttribute('href')) n.setAttribute('href', safeHref(n.getAttribute('href')));
        n.setAttribute('target','_blank'); n.setAttribute('rel','noopener noreferrer');
      }
      clean(n);
      n = n.nextSibling;
    }

function htmlToText(html){
  const root = parseFragment(html); let out = '';
  (function walk(el, depth){
    for (const n of el.childNodes) {
