<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket</title>
<meta name="description" content="A single-file mobile web app for Vikunja, served by Vikunja itself.">
<meta name="theme-color" content="#EEF1EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1513" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pocket">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#EEF1EF; --surface:#FFFFFF; --sunk:#E3E8E5; --ink:#17201C; --muted:#5B6863; --line:#D6DDD9;
  --accent:#1D6B52; --accent-ink:#FFFFFF; --accent-soft:#D8EBE3;
  --overdue:#A82339; --today:#9A6414; --danger:#A82339;
  --r-row:14px; --r-sheet:22px; --r-chip:999px;
  --pad:16px; --tab-h:58px; --cap-h:64px;
  --shadow:0 -1px 0 var(--line), 0 -12px 30px rgba(23,32,28,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F1513; --surface:#18201D; --sunk:#111816; --ink:#E7EDEA; --muted:#93A29C; --line:#26312D;
  --accent:#4FB08D; --accent-ink:#06120D; --accent-soft:#1B3A2F;
  --overdue:#F07A8B; --today:#E0A94A; --danger:#F07A8B;
  --shadow:0 -1px 0 var(--line), 0 -12px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- login ---------- */
#login{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:calc(env(safe-area-inset-top) + 32px) 24px calc(env(safe-area-inset-bottom) + 32px);max-width:440px;margin:0 auto}
#login h1{font-size:40px;line-height:1.05;letter-spacing:-.02em;margin:0 0 8px;font-weight:800}
#login p.lead{color:var(--muted);margin:0 0 28px}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);outline:none;font-size:17px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:650;font-size:17px}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--line)}
.btn[disabled]{opacity:.55}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;margin-bottom:16px}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:9px;font-size:15px;color:var(--muted);font-weight:600}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.note{font-size:14px;color:var(--muted);margin:10px 0 0}
.sso-btn + .sso-btn{margin-top:10px}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px;margin:20px 0 16px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.err{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger);border-radius:12px;padding:12px 14px;font-size:15px;margin:0 0 16px;white-space:pre-line}
.err code{font-size:13px;background:rgba(0,0,0,.06);padding:1px 4px;border-radius:4px;white-space:nowrap}

/* ---------- shell ---------- */
#app{min-height:100%}
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);padding:calc(env(safe-area-inset-top) + 10px) var(--pad) 10px;display:flex;align-items:flex-end;gap:10px}
header.top .t{flex:1;min-width:0}
header.top .kicker{color:var(--muted);font-size:15px;font-weight:600}
header.top h2{margin:0;font-size:32px;line-height:1.1;letter-spacing:-.02em;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:40px;height:40px;border-radius:20px;border:0;background:var(--surface);display:grid;place-items:center;color:var(--ink);flex:none}
.icon-btn.plain{background:transparent}
main{padding:4px var(--pad) calc(var(--tab-h) + var(--cap-h) + env(safe-area-inset-bottom) + 28px)}

.sec{margin:18px 0 6px;display:flex;align-items:baseline;gap:8px;font-weight:700;font-size:15px}
.sec .n{color:var(--muted);font-weight:600}
.sec.overdue{color:var(--overdue)} .sec.today{color:var(--today)}
.list{background:var(--surface);border-radius:var(--r-row);overflow:hidden}
.row{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-height:56px;position:relative}
.row:first-of-type{border-top:0}
.row .body{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:2px 0}
.row .title{font-size:16.5px;overflow-wrap:anywhere}
.row.done .title{color:var(--muted);text-decoration:line-through}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:3px;font-size:13.5px;color:var(--muted)}
.meta .due.overdue{color:var(--overdue);font-weight:600}
.meta .due.today{color:var(--today);font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px;background:var(--muted)}
.prio{font-weight:800;color:var(--overdue);letter-spacing:-.05em}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);background:transparent;flex:none;margin-top:1px;display:grid;place-items:center;padding:0;transition:background .15s,border-color .15s}
.check svg{width:15px;height:15px;stroke:var(--accent-ink);stroke-width:3;opacity:0}
.check.p3,.check.p4,.check.p5{border-color:var(--overdue)}
.row.done .check,.check.on{background:var(--accent);border-color:var(--accent)}
.row.done .check svg,.check.on svg{opacity:1}
.empty{text-align:center;color:var(--muted);padding:48px 12px}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
.offline{margin:8px 0 0;padding:9px 12px;border-radius:12px;background:var(--sunk);color:var(--muted);font-size:14px}
/* a task added offline, not sent yet */
.row.pending{background:color-mix(in srgb,var(--accent-soft) 55%,var(--surface))}
.check.wait{border-style:dashed;opacity:.8}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.tree .row{align-items:center;padding-top:14px;padding-bottom:14px}
.tree .row .body{display:flex;align-items:center;gap:10px}
.tree .chev{color:var(--muted)}
.toggle-done{margin:14px 0 0;width:100%}

/* ---------- capture bar ---------- */
#capture{position:fixed;left:0;right:0;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom));z-index:6;padding:10px var(--pad) 8px;background:var(--bg)}
#capture::before{content:"";position:absolute;left:0;right:0;top:-18px;height:18px;background:linear-gradient(to bottom,transparent,var(--bg));pointer-events:none}
#capture form{display:flex;gap:8px;align-items:flex-end;background:var(--surface);border:2px solid var(--accent);border-radius:16px;padding:4px 4px 4px 14px}
#capture textarea{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:17px;line-height:1.35;padding:10px 0;resize:none;max-height:35vh;overflow-y:auto}
#capture textarea::placeholder{color:var(--muted)}
#capture .go{width:42px;height:42px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
#capture .go[disabled]{opacity:.35}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:13.5px;padding:5px 10px;border-radius:var(--r-chip);background:var(--accent-soft);color:var(--ink);border:0;white-space:nowrap}
.chip.warn{background:color-mix(in srgb,var(--today) 20%,transparent)}
.chip:not(.tap){cursor:default}
.chip.off{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--muted);text-decoration:line-through}
.chip.create{background:transparent;box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--accent);font-weight:600}
.chip.toggle{background:var(--sunk);color:var(--muted);font-weight:600}
.chip.toggle[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.chip .x{font-weight:700;opacity:.6;margin-left:2px}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;height:calc(var(--tab-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--surface);box-shadow:var(--shadow);display:flex}
nav.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);text-decoration:none;font-size:12px;font-weight:600}
nav.tabs a[aria-current=page]{color:var(--accent)}

/* ---------- sheet ---------- */
#scrim{position:fixed;inset:0;background:rgba(10,16,13,.42);z-index:20;opacity:0;transition:opacity .2s}
#scrim.show{opacity:1}
#sheet{position:fixed;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top) + 28px);z-index:21;background:var(--bg);border-radius:var(--r-sheet) var(--r-sheet) 0 0;display:flex;flex-direction:column;transform:translateY(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-width:720px;margin:0 auto}
#sheet.show{transform:none}
@media (prefers-reduced-motion:reduce){#sheet,#scrim{transition:none}}
#sheet .bar{display:flex;align-items:center;gap:8px;padding:12px 12px 6px}
#sheet .bar .grab{flex:1;display:flex;justify-content:center}
#sheet .bar .grab i{width:40px;height:5px;border-radius:3px;background:var(--line)}
#sheet .scroll{flex:1;overflow:auto;padding:4px var(--pad) calc(env(safe-area-inset-bottom) + 32px);-webkit-overflow-scrolling:touch}
.d-title{display:flex;gap:12px;align-items:flex-start;margin:4px 0 18px}
.d-title textarea{flex:1;border:0;background:transparent;font-size:24px;font-weight:750;line-height:1.2;letter-spacing:-.01em;resize:none;outline:0;padding:0;min-height:30px}
.d-title .check{width:30px;height:30px;margin-top:0}
.card{background:var(--surface);border-radius:var(--r-row);margin-bottom:14px}
.prop{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line);min-height:52px}
.prop:first-of-type{border-top:0}
.prop .k{width:72px;flex:none;color:var(--muted);font-size:15px}
.prop .v{flex:1;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prop select,.prop input[type=datetime-local]{flex:1;min-width:0;border:0;background:transparent;font-size:16px;padding:6px 0;outline:0}
.prop.stack{flex-direction:column;align-items:stretch;gap:8px;padding-top:12px;padding-bottom:12px}
.prop.stack .k{width:auto}
.prios{display:flex;gap:4px;flex:1}
.prios button{flex:1;border:0;border-radius:8px;background:var(--sunk);padding:9px 0;font-size:14px;font-weight:650;color:var(--muted)}
.prios button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.prios button.hot[aria-pressed=true]{background:var(--overdue);color:#fff}
.assign-form{flex:1;min-width:120px;display:flex}
.assign-form input{flex:1;min-width:0;padding:6px 10px;border-radius:var(--r-chip);border:1.5px solid var(--line);background:var(--bg);font-size:15px;outline:0}
.assign-form input:focus{border-color:var(--accent)}
.label-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 6px 5px 10px;border-radius:var(--r-chip);background:var(--sunk);font-size:14px;border:0}
.label-chip .x{width:24px;height:24px;border-radius:12px;display:grid;place-items:center;color:var(--muted);border:0;background:transparent;padding:0}
.add-label{border:1.5px dashed var(--line);background:transparent;color:var(--muted);border-radius:var(--r-chip);padding:4px 12px;font-size:14px}
.desc{padding:14px;font-size:16px;line-height:1.5;overflow-wrap:anywhere}
.desc :first-child{margin-top:0} .desc :last-child{margin-bottom:0}
.desc a{color:var(--accent)}
.desc ul[data-type=taskList]{list-style:none;padding-left:4px}
.desc li[data-checked]::before{content:"○ ";color:var(--muted)}
.desc li[data-checked=true]::before{content:"● ";color:var(--accent)}
.desc li[data-checked] > div,.desc li[data-checked] p{display:inline}
.desc .ph{color:var(--muted)}
.desc-edit{padding:10px}
.desc-edit textarea{width:100%;min-height:140px;border:1.5px solid var(--accent);border-radius:10px;padding:10px;background:var(--bg);font-size:16px;line-height:1.45;outline:0;resize:vertical}
.row-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.h3{font-size:15px;font-weight:700;margin:22px 2px 8px;display:flex;align-items:baseline;gap:8px}
.h3 .n{color:var(--muted);font-weight:600}
.comment{padding:12px 14px;border-top:1px solid var(--line)}
.comment:first-of-type{border-top:0}
.comment .who{font-size:13.5px;color:var(--muted);margin-bottom:3px}
.comment .who b{color:var(--ink);font-weight:650}
.comment-form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.comment-form{border-top:0} .comment ~ .comment-form,.row ~ .comment-form{border-top:1px solid var(--line)}
.linkish{border:0;background:transparent;padding:0;color:var(--accent);font-size:16px;text-align:left}
.comment-form textarea{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--bg);font-size:16px;resize:none;min-height:42px;outline:0}
.comment-form textarea:focus{border-color:var(--accent)}
.att{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line);width:100%;border-left:0;border-right:0;border-bottom:0;background:transparent;text-align:left}
.att:first-of-type{border-top:0}
.att .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att .sz{color:var(--muted);font-size:13px}
.danger-zone{margin-top:28px}
.picker{padding:6px 0}
.picker button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:12px 14px;text-align:left;border-top:1px solid var(--line)}
#lp-list button:first-of-type{border-top:0}
.picker input{margin:10px 14px;width:calc(100% - 28px);padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);outline:0}
.saved{font-size:13px;color:var(--muted);text-align:right;min-height:18px;margin-top:-8px;margin-bottom:6px}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + var(--cap-h) + env(safe-area-inset-bottom) + 22px);transform:translate(-50%,20px);z-index:30;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;max-width:calc(100% - 32px);box-shadow:0 8px 28px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{border:0;background:transparent;color:var(--accent-soft);font-weight:700;padding:6px 8px}
@media (prefers-color-scheme:dark){#toast button{color:var(--accent)}}
body.sheet-open #toast{bottom:calc(env(safe-area-inset-bottom) + 20px)}
</style>
</head>
<body x-data="pocket" :class="{'sheet-open': sheet.open}" @keydown.escape.window="sheet.open && closeSheet()"
      x-effect="if (screen === 'app') document.title = head.title + ' · Pocket'">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8M4 4v4h4M4 13a8 8 0 0 0 14.3 4.9L20 16M20 20v-4h-4"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
  <symbol id="i-clip" viewBox="0 0 24 24"><path d="M21 11.5l-8.6 8.6a5 5 0 0 1-7.1-7.1l8.6-8.6a3.3 3.3 0 0 1 4.7 4.7l-8.6 8.6a1.7 1.7 0 0 1-2.4-2.4l7.9-7.9"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></symbol>
</svg>

<!-- ============ LOGIN ============ -->
<section id="login" :hidden="screen !== 'login'" hidden>
  <h1>Pocket</h1>
  <p class="lead">Today's tasks and quick capture for your Vikunja.</p>
  <div id="login-err" class="err" :hidden="!login.err" x-html="login.err" hidden></div>

  <template x-if="!info && !login.err"><p class="note">Connecting…</p></template>
  <template x-if="!info && login.err"><button class="btn ghost block" type="button" @click="probe()">Try again</button></template>

  <div id="auth-step" :hidden="!info" hidden>
    <template x-if="providers.length"><div id="sso">
      <template x-for="p in providers" :key="p.key"><button type="button" class="btn block sso-btn" @click="signInWith(p)" x-text="'Sign in with ' + p.name"></button></template>
      <template x-if="login.waiting"><p class="note">Finish signing in in the other tab. Pocket continues by itself.</p></template>
      <!-- The home-screen app signs in in the same window, and the provider can only return to Vikunja's page. -->
      <template x-if="INSTALLED"><p class="note">After signing in, Vikunja's page opens. Close it to come back to Pocket.</p></template>
      <p class="or">or</p>
    </div></template>
    <div class="seg" role="group" aria-label="Sign-in method" :hidden="!passwordAllowed">
      <button type="button" data-mode="session" :aria-pressed="String(login.method === 'session')" @click="login.method = 'session'">Password</button>
      <button type="button" data-mode="token" :aria-pressed="String(login.method === 'token')" @click="login.method = 'token'">API token</button>
    </div>
    <form id="f-pass" :hidden="login.method !== 'session'" @submit.prevent="submitPassword()">
      <label class="field"><span>Username or email</span><input id="in-user" x-ref="inUser" x-model="login.user" autocomplete="username" autocapitalize="off" spellcheck="false" required></label>
      <label class="field"><span>Password</span><input id="in-pass" x-model="login.pass" type="password" autocomplete="current-password" required></label>
      <label class="field" id="totp-field" :hidden="!login.showTotp" hidden><span>Two-factor code</span><input id="in-totp" x-ref="inTotp" x-model="login.totp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*"></label>
      <button class="btn block" type="submit" :disabled="login.busy">Sign in</button>
    </form>
    <form id="f-token" :hidden="login.method !== 'token'" @submit.prevent="submitToken()" hidden>
      <label class="field"><span>API token</span><input id="in-token" x-ref="inToken" x-model="login.token" autocapitalize="off" spellcheck="false" required placeholder="tk_…"></label>
      <button class="btn block" type="submit" :disabled="login.busy">Connect</button>
      <p class="note">Create one in Vikunja under Settings → API Tokens. Pick the “Task Management” preset, then also tick “User” and “Users” under Other, and “Projectusers” under Projects.</p>
    </form>
  </div>

<script>
'use strict';
/* =============== helpers =============== */
const store = {
  get(k){ try{ return localStorage.getItem('pocket.'+k) }catch{ return null } },
  set(k,v){ try{ localStorage.setItem('pocket.'+k,v) }catch{} },
  del(k){ try{ localStorage.removeItem('pocket.'+k) }catch{} },
};
const TZ = Intl.DateTimeFormat().resolvedOptions().timeZone;
const ZERO = '0001-01-01T00:00:00Z';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const colorOf = hex => /^#?([0-9a-f]{3,4}|[0-9a-f]{6}|[0-9a-f]{8})$/i.test(hex || '') ? '#' + hex.replace('#','') : 'var(--muted)';
const INLINE_TYPES = /^(image\/(png|jpeg|gif|webp|avif)|application\/pdf|text\/plain)$/;
const mimeOf = t => String(t || '').split(';')[0].trim().toLowerCase();
const fmtSize = n => !n ? '' : n < 1024 ? n + ' B' : n < 1048576 ? (n/1024).toFixed(0) + ' KB' : (n/1048576).toFixed(1) + ' MB';
const PRIOS = [{n:0,label:'None'},{n:1,label:'Low'},{n:2,label:'Med'},{n:3,label:'High'},{n:4,label:'Urgent'},{n:5,label:'Now'}];
// Fit a text box to its text. A hidden box measures 0, so leave its height alone until it can be measured.
const grow = ta => { ta.style.height = 'auto'; if (ta.scrollHeight) ta.style.height = ta.scrollHeight + 'px'; };
const cache = new Map();                       // task id -> latest task from the server
const userCache = new Map();                   // lowercased username -> user
let peopleLoading = null;                      // loadPeople() while it runs
let app;                                       // the Alpine component, set in init()

/* =============== API =============== */
class ApiError extends Error { constructor(status, msg, code){ super(msg); this.status=status; this.code=code; } }
class NetError extends Error {}

/* Two ways to be signed in:
   - 'session': Vikunja's own web sign-in (password or single sign-on), shared with Vikunja's web app on this device.
     The token lives where Vikunja keeps it (localStorage "token") and is renewed with Vikunja's refresh cookie.
   - 'token': an API token, kept by Pocket alone. */
const sharedToken = {
  get(){ try { return localStorage.getItem('token') || ''; } catch { return ''; } },
  set(t){ try { localStorage.setItem('token', t); } catch {} },
  del(){ try { localStorage.removeItem('token'); } catch {} },
};
// Home-screen app, as opposed to a browser tab.
const INSTALLED = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

// Renew the shared session the way Vikunja's own tabs do. The refresh cookie works once and is replaced on every
// renewal, so renewals take Vikunja's "vikunja-token-refresh" lock, and if someone else renewed while we waited,
// their new token is used instead of spending the cookie again.
let refreshing = null;
function refreshSession(){
  if (refreshing) return refreshing;
  const before = sharedToken.get();
  const renew = async () => {
    const now = sharedToken.get();
    if (now && now !== before) return true;
    const r = await fetch(app.server + '/api/v1/user/token/refresh', {method:'POST', credentials:'include'});
    if (!r.ok) return false;
    const j = await r.json();
    if (!j.token) return false;
    sharedToken.set(j.token);
    return true;
  };
  refreshing = (async () => {
    try { return navigator.locks ? await navigator.locks.request('vikunja-token-refresh', renew) : await renew(); }
    catch { return false; }
    finally { refreshing = null; }
  })();
  return refreshing;
}

async function api(path, {method='GET', body, raw=false, auth=true, retry=true} = {}){
  const headers = {};
  const token = app.mode === 'session' ? sharedToken.get() : app.token;
  if (auth && token) headers.Authorization = 'Bearer ' + token;
  if (body !== undefined) headers['Content-Type'] = 'application/json';
  let res;
  try {
    res = await fetch(app.server + '/api/v1' + path, {
      method, headers, body: body === undefined ? undefined : JSON.stringify(body),
      credentials: app.mode === 'session' ? 'include' : 'omit',
    });
  } catch (e) { if (app) app.offline = true; throw new NetError(e.message) }
  if (app) app.offline = false;
  if (res.status === 401 && auth && retry && app.mode === 'session') {
    if (await refreshSession()) return api(path, {method, body, raw, auth, retry:false});
  }
  if (res.status === 401 && auth) {
    // Vikunja also answers 401 when an API token lacks a permission, so check the token before signing out.
    if (app.mode === 'token' && path !== '/user' && await tokenWorks()) throw new ApiError(403, 'Your API token doesn\'t allow this. Create one with the permissions listed on the sign-in screen.');
    app.signOut('Your session ended. Sign in again.', {tellServer: false}); throw new ApiError(401, 'Signed out');
  }
  if (!res.ok) {
    let j = {}; try { j = await res.json() } catch {}
    throw new ApiError(res.status, j.message || res.statusText || ('HTTP ' + res.status), j.code);
  }
  if (raw) return res;
  if (res.status === 204) return null;
  const t = await res.text(); return t ? JSON.parse(t) : null;
}

async function tokenWorks(){
  try { return (await fetch(app.server + '/api/v1/user', {headers: {Authorization: 'Bearer ' + app.token}})).ok; }
  catch { return false; }
}

async function allPages(path){
  const out = [];
  for (let page = 1; page <= 40; page++) {
    const res = await api(path + (path.includes('?') ? '&' : '?') + 'page=' + page + '&per_page=50', {raw:true});
    const data = await res.json();
    if (Array.isArray(data)) out.push(...data);
    const total = parseInt(res.headers.get('x-pagination-total-pages') || '1', 10);
    if (!Array.isArray(data) || data.length === 0 || page >= total) break;
  }
  return out;
}

function netHelp(){
  return `Can't reach Vikunja at ${esc(location.origin)}. Check your connection, then try again.`;
}
function errText(e){
  if (e instanceof NetError) return netHelp();
  if (e instanceof ApiError && e.status === 429) return 'Too many attempts from here. Wait a minute, then try again.';
  return esc(e.message || String(e));
}

/* =============== dates =============== */
const isSet = d => d && !String(d).startsWith('0001');
const startOfDay = (d=new Date()) => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const fmtTime = d => d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
function dueInfo(due){
  if (!isSet(due)) return null;
  const d = new Date(due), today = startOfDay(), dd = startOfDay(d);
  const diff = Math.round((dd - today) / 864e5);
  const hasTime = !(d.getHours() === 0 && d.getMinutes() === 0) && !(d.getHours() === 12 && d.getMinutes() === 0);
  let label;
  if (diff === 0) label = 'Today';
  else if (diff === 1) label = 'Tomorrow';
  else if (diff === -1) label = 'Yesterday';
  else if (diff < -1 && diff > -7) label = diff * -1 + ' days ago';
  else if (diff > 1 && diff < 7) label = d.toLocaleDateString([], {weekday:'long'});
  else label = d.toLocaleDateString([], {day:'numeric', month:'short', year: d.getFullYear() !== today.getFullYear() ? 'numeric' : undefined});
  if (hasTime && Math.abs(diff) < 7) label += ' ' + fmtTime(d);
  return {label, cls: diff < 0 ? 'overdue' : diff === 0 ? 'today' : '', diff};
}
const toLocalInput = iso => { if (!isSet(iso)) return ''; const d = new Date(iso); const p = n => String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; };
const fromLocalInput = v => v ? new Date(v).toISOString() : ZERO;

/* =============== HTML description helpers =============== */
// Task notes and comments are HTML written by anyone who shares the project, so only a small set of
// formatting tags survives. Alpine runs directives found in x-html content, so attributes are stripped too.
const XHTML = 'http://www.w3.org/1999/xhtml';
const ALLOWED = new Set(['p','br','b','strong','i','em','u','s','del','ul','ol','li','a','code','pre','blockquote','h1','h2','h3','h4','h5','h6','span','div','mark','hr','table','thead','tbody','tr','td','th']);
const DROPPED = new Set(['script','style','iframe','frame','frameset','object','embed','template','form','input','label','textarea','select','button','noscript','link','meta','base','title']);
// Parse in an inert document: nothing loads or runs, and <frameset> can't replace the body.
function parseFragment(html){
  const root = document.implementation.createHTMLDocument('').createElement('div');
  root.innerHTML = html || '';
  return root;
}
// Only absolute http(s) and mailto links, written back in normalized form.
function safeHref(v){
  try { const u = new URL((v || '').trim()); return /^(https?|mailto):$/.test(u.protocol) ? u.href : ''; } catch { return ''; }
}
function sanitize(html){
  const root = parseFragment(html);
  (function clean(el){
    let n = el.firstChild;
    while (n) {
      if (n.nodeType === 3) { n = n.nextSibling; continue; }
      const tag = n.nodeType === 1 && n.namespaceURI === XHTML ? n.localName : '';   // SVG/MathML count as unknown
      if (!ALLOWED.has(tag)) {
        if (tag === 'img') { const t = n.ownerDocument.createTextNode('[image]'); n.replaceWith(t); n = t.nextSibling; continue; }
        if (!tag || DROPPED.has(tag)) { const next = n.nextSibling; n.remove(); n = next; continue; }
        // Unknown HTML tag: keep its contents in place and carry on from the first of them.
        const next = n.firstChild || n.nextSibling; n.replaceWith(...n.childNodes); n = next; continue;
      }
      for (const a of [...n.attributes]) {
        const keep = (tag === 'a' && a.name === 'href' && safeHref(a.value))
          || (a.name === 'data-type' && a.value === 'taskList') || (a.name === 'data-checked' && /^(true|false)$/.test(a.value));
        if (!keep) n.removeAttribute(a.name);
      }
      if (tag === 'a') {
        if (n.hasAttribute('href')) n.setAttribute('href', safeHref(n.getAttribute('href')));
        n.setAttribute('target','_blank'); n.setAttribute('rel','noopener noreferrer');
      }
      clean(n);
      n = n.nextSibling;
    }
  })(root);
  return root.innerHTML;
}
function htmlToText(html){
  const root = parseFragment(html); let out = '';
  (function walk(el, depth){
    for (const n of el.childNodes) {
      if (n.nodeType === 3) { out += n.nodeValue; continue; }
      if (n.nodeType !== 1) continue;
      const t = n.tagName;
      if (/^(SCRIPT|STYLE|TEMPLATE|IFRAME|OBJECT|SVG)$/.test(t)) continue;
      if (t === 'BR') { out += '\n'; continue; }
      if (t === 'LI') { out += '- ' + (n.getAttribute('data-checked') === 'true' ? '[x] ' : n.hasAttribute('data-checked') ? '[ ] ' : ''); walk(n, depth+1); out = out.replace(/\n*$/,'') + '\n'; continue; }
      walk(n, depth+1);
      if (/^(P|DIV|H[1-6]|BLOCKQUOTE|PRE|UL|OL|TR)$/.test(t)) out = out.replace(/\n*$/,'') + '\n\n';
    }
  })(root, 0);
  return out.replace(/ /g,' ').replace(/\n{3,}/g,'\n\n').trim();
}
const RICH = /<(ul|ol|a |table|pre|code|h[1-6]|blockquote|img|strong|em|b>|i>)/i;
function textToHtml(text){
  return text.trim().split(/\n{2,}/).map(p => '<p>' + esc(p).replace(/\n/g,'<br>') + '</p>').join('');
}

/* =============== routing =============== */
function currentRoute(){
  const h = location.hash.replace(/^#\/?/, '');
  const [path, q] = h.split('?');
  const parts = path.split('/').filter(Boolean);
  const params = new URLSearchParams(q || '');
  if (parts[0] === 'projects') return {name:'projects'};
  if (parts[0] === 'project' && parts[1]) return {name:'project', id: +parts[1], showDone: params.get('done') === '1'};
  if (parts[0] === 'add') return {name:'add', text: params.get('text') || params.get('title') || ''};
  return {name:'today'};
}

/* =============== quick-add magic =============== */
/* Follows Vikunja's Quick Add Magic (default mode, https://vikunja.io/help/quick-add-magic/) so the same text makes
   the same task in both apps. tests/parse.mjs holds the phrases, adapted from Vikunja's own tests; where Pocket
   deliberately differs, the test says so. */
const WEEKDAYS = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
const WEEKDAY_RE = `${WEEKDAYS.join('|')}|${WEEKDAYS.map(w => w.slice(0,3)).join('|')}`;
const weekdayIndex = w => WEEKDAYS.findIndex(d => d.startsWith(w.toLowerCase().slice(0,3)));
const NUMBER_WORDS = {one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10};
const LEAD_IN = /\b(in|by|on|before|until)\s+$/i;          // a word just before a date that goes with it
const DROP_LEAD = /(?:\b(?:in|by|on|before|until)\s+)?(?:\bthe\s+)?$/i;   // ...removed along with the date, with a "the"
const END = '(?=\\s|$|[,.!?;:])';                          // a phrase has to end at a word boundary
// Ambiguous numeric dates follow the phone's region: 10/12 is October 12 in the US and 10 December in most other places.
const DAY_FIRST = (() => { try { return new Intl.DateTimeFormat().formatToParts(new Date(2000, 11, 31)).find(p => p.type !== 'literal')?.type === 'day'; } catch { return false; } })();
const projectName = typed => typed.replace(/[_-]/g, ' ').trim();
function tokenRe(prefix, flags = 'g'){ return new RegExp(`(^|\\s)\\${prefix}(?:"([^"]+)"|'([^']+)'|(\\S+))`, flags); }
/* Take one @username out of a title, quoted or not, once that person is assigned. Vikunja's quick add does the same. */
function removeAssignee(title, prefix, name){
  const n = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return title.replace(new RegExp(`(^|\\s)\\${prefix}(?:"${n}"|'${n}'|${n})(?=\\s|$)`, 'gi'), '$1').replace(/\s{2,}/g, ' ').trim();
}
// Set a date's time from "HH:MM" (Vikunja's "default due time" setting; noon unless the user changed it).
function atTime(d, hhmm = '12:00'){ const [h, m] = String(hhmm).split(':').map(Number); d.setHours(h || 0, m || 0, 0, 0); return d; }
const dayFrom = (now, n) => { const d = new Date(now); d.setDate(d.getDate() + n); d.setHours(0, 0, 0, 0); return d; };
const laterThisWeek = now => [5, 6, 0].includes(now.getDay()) ? 0 : 2;      // Friday to Sunday: today; otherwise in two days

// Day words, with Vikunja's meanings. Longer phrases first ("later next week" before "next week").
const DAY_WORDS = [
  ['later\\s+next\\s+week', now => dayFrom(now, laterThisWeek(now) + 7)],
  ['later\\s+this\\s+week', now => dayFrom(now, laterThisWeek(now))],
  ['next\\s+week', now => dayFrom(now, 7)],
  ['this\\s+weekend', now => dayFrom(now, (6 - now.getDay()) % 6)],
  ['next\\s+month', now => new Date(now.getFullYear(), now.getMonth() + 1, 1)],
  ['(?:the\\s+)?end\\s+of\\s+(?:the\\s+)?month', now => new Date(now.getFullYear(), now.getMonth() + 1, 0)],
  ['tonight', now => dayFrom(now, 0), '21:00'],
  ['today', now => dayFrom(now, 0)],
  ['tomorrow', now => dayFrom(now, 1)],
].map(([src, day, time]) => ({re: new RegExp(`(^|\\s)(?:${src})${END}`, 'i'), day, time}));

// A time after a date at the end of the text: "meeting 9/11 at 10:00". Numeric dates and bare "17th" only count
// at the start or end, so "The 9/11 Report" and "13th floor" stay as they are.
const TIME_TAIL = '(?:\\s+at\\s+\\d{1,2}(?::\\d{2})?\\s*(?:am|pm)?)?\\s*$';

// "2021-07-06", "6/7/21", "27/1", "01.02": a date, or null. No year means the next time that date comes round.
function numericDate(token, now){
  let y, m, d, a, b, x;
  if ((x = token.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/))) [y, m, d] = [+x[1], +x[2], +x[3]];
  else if ((x = token.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2}|\d{4}))?$/))) {
    [a, b, y] = [+x[1], +x[2], x[3] && +x[3]];
    [m, d] = a > 12 ? [b, a] : b > 12 ? [a, b] : DAY_FIRST ? [b, a] : [a, b];
  } else if ((x = token.match(/^(\d{1,2})\.(\d{1,2})(?:\.(\d{2}|\d{4}))?$/))) [d, m, y] = [+x[1], +x[2], x[3] && +x[3]];
  else return null;
  if (y && y < 100) y += 2000;
  const make = yr => { const t = new Date(yr, m - 1, d); return t.getMonth() === m - 1 && t.getDate() === d ? t : null; };
  if (y) return make(y);
  const t = make(now.getFullYear());
  return t && t < dayFrom(now, 0) ? make(now.getFullYear() + 1) : t;
}
// "17th": this month if it hasn't passed, else the next month that has that day.
function ordinalDate(day, now){
  for (let i = 0; i < 13; i++) {
    const t = new Date(now.getFullYear(), now.getMonth() + i, day);
    if (t.getDate() === day && t >= dayFrom(now, 0)) return t;
  }
  return null;
}

// Prefixes for each of Vikunja's Quick Add Magic modes (the user's setting); "disabled" turns parsing off.
const QUICK_ADD_PREFIXES = {vikunja: {project: '+', label: '*', assignee: '@'}, todoist: {project: '#', label: '@', assignee: '+'}};

/* Returns {title, project, projectMiss, labels, assignees, priority, due, dueLabel, dueFromRepeat, repeat}.
   opts: mode ("vikunja", "todoist" or "disabled"), ignore (kinds the user tapped off; their words stay in the title),
   now, dueTime ("HH:MM"). */
function parseCapture(text, projects, {mode = 'vikunja', ignore = {}, now = new Date(), dueTime = '12:00'} = {}){
  const out = {title: text, project: null, projectMiss: null, labels: [], assignees: [], priority: 0, due: null, dueLabel: '', dueFromRepeat: false, repeat: null};
  const P = QUICK_ADD_PREFIXES[mode];
  if (!P) return out;
  // Wrapping the whole text in quotes turns everything off: "delete mails up to january 30th"
  const quoted = text.match(/^\s*(["'])([\s\S]*)\1\s*$/);
  if (quoted) { out.title = quoted[2].trim(); return out; }
  const cut = (start, end) => { out.title = out.title.slice(0, start) + ' ' + out.title.slice(end); };
  out.title = out.title.replace(/(^|\s)@\s+(?=\d)/g, '$1at ');                  // "@ 3pm" is a time, as in Vikunja

  // project +name: only the first one counts
  if (!ignore.project) out.title = out.title.replace(tokenRe(P.project, ''), (m, sp, a, b, c) => {
    const name = projectName(a || b || c).toLowerCase();
    const hit = projects.find(p => p.title.toLowerCase() === name) || projects.find(p => p.title.toLowerCase().startsWith(name));
    if (hit) out.project = hit; else out.projectMiss = a || b || c;
    return sp;
  });
  // labels *name
  if (!ignore.labels) out.title = out.title.replace(tokenRe(P.label), (m, sp, a, b, c) => { const l = a || b || c; if (!out.labels.includes(l)) out.labels.push(l); return sp; });
  // assignees @username stay in the title for now: createTask takes out each one that gets assigned, as Vikunja does.
  // A space is needed before the @, so email addresses are left alone.
  if (!ignore.assignees) for (const x of out.title.matchAll(tokenRe(P.assignee))) { const u = x[2] || x[3] || x[4]; if (!out.assignees.includes(u)) out.assignees.push(u); }
  // priority !1..!5: the first valid one
  if (!ignore.priority) out.title = out.title.replace(/(^|\s)!([1-5])(?=\s|$)/, (m, sp, n) => { out.priority = +n; return sp; });

  // repeat: "every day", "every 3 days", "each two weeks", "every monday", "daily", "biannually", ...
  let repeatDay = null;
  if (!ignore.repeat) {
    let m = out.title.match(new RegExp(`(^|\\s)(?:every|each)\\s+(?:(\\d+|${Object.keys(NUMBER_WORDS).join('|')})\\s+)?(hour|day|week|month|year)s?${END}`, 'i'));
    let n, unit;
    if (m) { n = NUMBER_WORDS[(m[2] || '').toLowerCase()] || +(m[2] || 1); unit = m[3].toLowerCase(); }
    else if ((m = out.title.match(new RegExp(`(^|\\s)(hourly|daily|weekly|monthly|yearly|annually|biannually|semiannually|biennially)${END}`, 'i')))) {
      [n, unit] = {hourly: [1, 'hour'], daily: [1, 'day'], weekly: [1, 'week'], monthly: [1, 'month'], yearly: [1, 'year'], annually: [1, 'year'],
        biannually: [6, 'month'], semiannually: [6, 'month'], biennially: [2, 'year']}[m[2].toLowerCase()];
    }
    if (unit) {
      // "every month" repeats on the same day each month (Vikunja's monthly mode); Vikunja's own quick add uses 30 days.
      out.repeat = unit === 'month' && n === 1 ? {after: 0, mode: 1, label: 'Every month'}
        : {after: n * {hour: 3600, day: 86400, week: 604800, month: 30 * 86400, year: 365 * 86400}[unit], mode: 0, label: n === 1 ? `Every ${unit}` : `Every ${n} ${unit}s`};
      cut(m.index + m[1].length, m.index + m[0].length);
    } else if ((m = out.title.match(new RegExp(`(^|\\s)(?:every|each)\\s+(${WEEKDAY_RE})${END}`, 'i')))) {
      repeatDay = weekdayIndex(m[2]);                                           // Pocket extra: "every monday"
      out.repeat = {after: 604800, mode: 0, label: 'Every ' + WEEKDAYS[repeatDay][0].toUpperCase() + WEEKDAYS[repeatDay].slice(1)};
      cut(m.index + m[1].length, m.index + m[0].length);
    }
  }

  // due date. The date leaves the title along with a word that introduces it: "Call Bob in May" -> "Call Bob".
  if (!ignore.due) {
    const dropDate = (start, end) => { out.title = out.title.slice(0, start).replace(DROP_LEAD, '') + ' ' + out.title.slice(end); };
    let day = null, time = null, m;                     // day: a date at midnight; time: "HH:MM" or a full date from chrono
    for (const w of DAY_WORDS) if ((m = out.title.match(w.re))) { day = w.day(now); time = w.time || null; dropDate(m.index + m[1].length, m.index + m[0].length); break; }
    if (!day && (m = out.title.match(new RegExp(`(^|\\s)(?:(?:next|this|on)\\s+)?(${WEEKDAY_RE})${END}`, 'i')))) {
      day = dayFrom(now, (weekdayIndex(m[2]) - now.getDay() + 7) % 7);           // the coming one; today counts
      dropDate(m.index + m[1].length, m.index + m[0].length);
    }
    if (!day) {                                                                 // numeric date, first or last word
      for (const re of [/^(\S+)(?=\s|$)/, new RegExp(`(^|\\s)(\\S+)(?=${TIME_TAIL})`)]) {
        if ((m = out.title.match(re))) {
          const token = m[2] ?? m[1], start = m.index + (m[2] !== undefined ? m[1].length : 0);
          const t = numericDate(token, now);
          if (t) { day = t; dropDate(start, start + token.length); break; }
        }
      }
    }
    // "17th" at the end, or "the 17th" anywhere; not "sep 17th", which is chrono's.
    const afterMonth = m => /\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+$/i.test(out.title.slice(0, m.index + m[1].length));
    if (!day && ((m = out.title.match(new RegExp(`(^|\\s)(\\d{1,2})(?:st|nd|rd|th)(?=${TIME_TAIL})`, 'i'))) && !afterMonth(m)
             || (m = out.title.match(new RegExp(`(^|\\s)(?:the|on the|on)\\s+(\\d{1,2})(?:st|nd|rd|th)${END}`, 'i'))) && !afterMonth(m))) {
      const t = ordinalDate(+m[2], now);
      if (t) { day = t; dropDate(m.index + m[1].length, m.index + m[0].length); }
    }
    if (!day && repeatDay !== null) day = dayFrom(now, (repeatDay - now.getDay() + 7) % 7);   // "every monday at 10"

    if (typeof chrono !== 'undefined') {
      // chrono-node reads the rest: "Oct 12", "21st June", "in 3 days", "in 2 hours", "at 3pm", ...
      const results = (DAY_FIRST ? chrono.GB : chrono.casual).parse(out.title, now, {forwardDate: true}).filter(r =>
        out.title[r.index - 1] !== P.assignee                                   // part of an @username
        && !/^for\b/i.test(r.text)                                              // "for 2 hours" is a duration, not a date
        && !/^now$/i.test(r.text)                                               // "Now what" isn't due this minute
        && !/^\d{1,4}[/.-]\d/.test(r.text)                                      // numeric dates are handled above, at the ends only
        // A month name on its own ("March madness") only counts after in/by/on/before/until: "call Bob in May".
        && !(/^[a-z]+\.?$/i.test(r.text) && r.start.isCertain('month') && !r.start.isCertain('day') && !LEAD_IN.test(out.title.slice(0, r.index))));
      const timeOnly = r => r.start.isCertain('hour') && !r.start.isCertain('day') && !r.start.isCertain('weekday') && !r.start.isCertain('month');
      const dated = !day && results.find(r => !timeOnly(r));
      if (dated) {
        day = dated.start.date();
        if (dated.start.isCertain('hour')) time = day;
        else day.setHours(0, 0, 0, 0);
      }
      const clock = !(time instanceof Date) && results.find(r => r !== dated && timeOnly(r));
      if (clock) {
        if (day) time = clock.start.date();
        else { day = clock.start.date(); time = day; }                          // a time on its own: the next one
      }
      // Remove what was used, the later one first so the earlier position stays valid.
      for (const r of [dated, clock].filter(Boolean).sort((a, b) => b.index - a.index)) dropDate(r.index, r.index + r.text.length);
    }
    if (day) {
      const d = new Date(day);
      if (time instanceof Date) d.setHours(time.getHours(), time.getMinutes(), 0, 0);
      else atTime(d, time || dueTime);
      out.due = d;
    }
  }
  // A repeating task needs a date to repeat from: the next default due time.
  if (out.repeat && !out.due && !ignore.due) {
    const d = atTime(dayFrom(now, 0), dueTime);
    out.due = d < now ? atTime(dayFrom(now, 1), dueTime) : d; out.dueFromRepeat = true;
  }
  if (out.due) out.dueLabel = dueInfo(out.due.toISOString()).label;
  out.title = out.title.replace(/\s{2,}/g, ' ').trim();
  return out;
}

/* Pasted lists: one task per line. Strips what email and notes apps put in front of items:
   "> " quote marks, bullets, "1." / "1)" numbering and checkboxes. A marker needs a space after it,
   so "*label" and "+project" at the start of a line still work. */
const LIST_MARKER = /^(?:>\s*)*(?:[-*•◦▪‣–—+]\s+|\d{1,3}[.)]\s+|\(\d{1,3}\)\s+)?(?:\[[ xX✓]?\]\s*|[☐☑☒✓✔]\s*)?/;
function captureLines(text){
  return String(text || '').split(/\r?\n/).map(l => l.trim().replace(LIST_MARKER, '').trim()).filter(Boolean);
}

/* Collapse a list row before it's removed, so ticked-off tasks slide away instead of vanishing. */
async function collapse(el){
  if (!el || !el.isConnected || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  el.style.overflow = 'hidden';
  await el.animate([{height: el.offsetHeight + 'px', opacity: 1}, {height: '0px', opacity: 0, paddingTop: '0px', paddingBottom: '0px'}],
    {duration: 220, easing: 'ease-in', fill: 'forwards'}).finished.catch(() => {});
}

/* =============== offline =============== */
/* Tasks added without a connection wait in an outbox on the device and are sent once Pocket is back online. Each entry
   is one capture, a task or a pasted list: {id, user, at, nest, pid, items: [{raw, p, taskId, tried, linked}]}.
   p is the line as parsed when it was typed, so "tomorrow" keeps meaning the day after it was typed. Progress is saved
   after every step, so an interrupted list carries on where it stopped. */
const outbox = {
  all(){ try { return JSON.parse(store.get('outbox') || '[]'); } catch { return []; } },
  save(list){ list.length ? store.set('outbox', JSON.stringify(list)) : store.del('outbox'); },
  get(id){ return this.all().find(e => e.id === id) || null; },
  put(entry){ const list = this.all(), i = list.findIndex(e => e.id === entry.id); if (i >= 0) list[i] = entry; else list.push(entry); this.save(list); },
  remove(id){ this.save(this.all().filter(e => e.id !== id)); },
};
// One sender at a time, even with Pocket open in two tabs.
const outboxLock = fn => navigator.locks ? navigator.locks.request('pocket-outbox', fn) : fn();
const packParsed = p => ({title: p.title, due: p.due ? p.due.toISOString() : null, priority: p.priority, repeat: p.repeat,
  labels: p.labels, assignees: p.assignees, project: p.project ? {id: p.project.id, title: p.project.title} : null});
const unpackParsed = p => ({...p, due: p.due ? new Date(p.due) : null});
const randomId = () => Array.from(crypto.getRandomValues(new Uint8Array(8)), b => b.toString(16).padStart(2, '0')).join('');

// The lists Pocket last loaded, shown when it opens without a connection. Cleared on sign-out.
const saved = {
  get(k){ try { return JSON.parse(store.get('saved.' + k)); } catch { return null; } },
  set(k, v){ store.set('saved.' + k, JSON.stringify(v)); },
  clear(){ try { for (const k of Object.keys(localStorage)) if (k.startsWith('pocket.saved.')) localStorage.removeItem(k); } catch {} },
};
const viewKey = r => r.name === 'project' ? `project.${r.id}.${r.showDone ? 'done' : 'open'}` : r.name;
// Today's groups. "Added today, no date" keeps tasks added without a date in view until midnight, so they don't vanish into a project.
const todayGroups = () => [{key:'overdue', cls:'overdue', title:'Overdue', tasks:[]}, {key:'today', cls:'today', title:'Today', tasks:[]},
  {key:'nodate', cls:'', title:'Added today, no date', tasks:[]}, {key:'week', cls:'', title:'Next 7 days', tasks:[]}];

/* =============== component =============== */
let renderSeq = 0, saveChain = Promise.resolve(), pendingSaves = 0, saveCount = 0, closeTimer, toastTimer, lastFocus;
const blankSheet = kind => ({open: false, show: false, kind, loading: false, error: '', task: null, title: '', savedMsg: '', dirty: false,
  editingDesc: false, descDraft: '', comments: null, commentsNote: '', commentDraft: '', commentBusy: false, subDraft: '', subBusy: false, assigning: false, assignName: ''});

document.addEventListener('alpine:init', () => Alpine.data('pocket', () => ({
  // session
  server: location.origin,                     // Pocket is served by Vikunja itself (the plugin), so this is the server
  mode: 'session',                             // 'session' (shared with Vikunja's web app) | 'token' (API token)
  token: '',                                   // the API token, in 'token' mode
  signedIn: false,
  ssoWindow: null,                             // the tab a single sign-on is happening in
  info: null, user: null,
  screen: '',                                  // 'login' | 'app'
  login: {method: 'token', user: '', pass: '', totp: '', token: '', showTotp: false, err: '', busy: false, waiting: false},
  // data
  projects: [], projById: new Map(),
  labels: [], labelsLoaded: false,
  // view
  route: currentRoute(),
  view: {route: null, loading: true, error: '', bootFailed: false, groups: [], project: null, savedAt: null},
  refreshing: false,
  capture: '', capFocus: false, capBusy: false, capNest: false, capIgnore: {},
  // Who can see which project, for @username in quick add: access['<project id>:<name>'] is true or false once known,
  // and userKnown[name] whether that user exists. accessBlocked: an API token without Projects → projectusers.
  access: {}, userKnown: {}, accessBlocked: false,
  capCaret: 0,                                 // the cursor in the quick add box, for suggestions
  people: null,                                // everyone you share a project with: [{user, pids}], loaded on the first @
  sheet: blankSheet(''),
  picker: {open: false, loading: false, error: '', q: ''},
  toast: {show: false, msg: '', action: null},
  offline: false,                              // the last request couldn't reach Vikunja
  creatingProject: false,
  pending: [],                                 // this user's outbox entries, for the "Waiting to send" rows
  flushing: false,

  init(){
    app = this;
    window.addEventListener('hashchange', () => { if (!this.signedIn) return; this.closeSheet(true); this.render(); });
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible') return;
      this.sessionChanged();                                                  // e.g. back from signing in
      if (this.signedIn && this.screen === 'app' && !this.sheet.open) this.render();
    });
    // Vikunja's web app (or a sign-in in another tab) changed the shared session.
    window.addEventListener('storage', e => { if (e.key === 'token' || e.key === null) this.sessionChanged(); });
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
    window.addEventListener('online', () => this.flush());
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') this.flush(); });
    setInterval(() => { if (this.pending.length && document.visibilityState === 'visible') this.flush(); }, 30000);
    this.$watch('capture', v => { if (!v.trim()) { this.capIgnore = {}; this.capNest = false; } });
    // Once typing pauses, find out whether each @username can see the task's project.
    let accessTimer;
    this.$watch('accessQuery', q => { clearTimeout(accessTimer); if (q) accessTimer = setTimeout(() => this.checkAccess(), 500); });
    // Starting an @username or *label: load what to suggest.
    this.$watch('capToken', tk => {
      if (tk?.kind === 'label') this.loadLabels().catch(() => {});
      if (tk?.kind === 'assignee') this.loadPeople().catch(() => {});
    });
    this.$nextTick(() => {
      this.initSwipe();
      // Keep the list's bottom padding in step with the capture bar as it grows.
      new ResizeObserver(() => document.documentElement.style.setProperty('--cap-h', this.$refs.captureBar.offsetHeight + 'px')).observe(this.$refs.captureBar);
    });
    if (store.get('mode') === 'token' && store.get('token')) { this.mode = 'token'; this.token = store.get('token'); }
    if (this.mode === 'token' || sharedToken.get()) this.boot();
    else { this.showLogin(''); this.probe(); }
  },

  /* ---------- auth ---------- */
  get passwordAllowed(){ const a = this.info?.auth || {}; return !!(a.local?.enabled || a.ldap?.enabled); },
  // Single sign-on providers Vikunja offers (Cloudron's login shows up here), from /info.
  get providers(){ const o = this.info?.auth?.openid_connect; return o?.enabled ? o.providers || [] : []; },
  // Follow the shared session: adopt one that appeared (a sign-in finished) and sign out when Vikunja did.
  sessionChanged(){
    if (this.mode === 'token' && this.signedIn) return;                     // an API token doesn't follow Vikunja's sign-in
    const t = sharedToken.get();
    if (t && !this.signedIn) {
      this.mode = 'session'; store.set('mode', 'session');
      try { this.ssoWindow?.close(); } catch {}
      this.ssoWindow = null; this.login.waiting = false;
      this.boot();
    } else if (!t && this.signedIn && this.mode === 'session') {
      // Vikunja can clear the token for a moment while it renews it, so only a sign-out that lasts counts.
      clearTimeout(this.signOutCheck);
      this.signOutCheck = setTimeout(() => {
        if (!sharedToken.get() && this.signedIn && this.mode === 'session') this.signOut('You signed out in Vikunja.', {tellServer: false});
      }, 2000);
    }
  },
  /* Single sign-on goes through Vikunja: the provider only returns to Vikunja's /auth/openid/<key> page, which finishes
     signing in and saves the session where Pocket reads it. This is the same request Vikunja's login page makes. */
  signInWith(p){
    const state = Array.from(crypto.getRandomValues(new Uint8Array(24)), b => b.toString(16).padStart(2, '0')).join('');
    try { localStorage.setItem('state', state); } catch {}
    const url = `${p.auth_url}?client_id=${encodeURIComponent(p.client_id)}&redirect_uri=${encodeURIComponent(`${location.origin}/auth/openid/${p.key}`)}`
      + `&response_type=code&scope=${encodeURIComponent(p.scope)}&state=${state}`;
    // A browser tab signs in in a new tab and picks the session up by itself; a home-screen app stays in one window
    // and picks it up when you come back to it.
    const w = !INSTALLED && window.open(url, '_blank');
    if (w) { this.ssoWindow = w; this.login.waiting = true; this.login.err = ''; }
    else location.href = url;
  },
  showLogin(err){
    this.screen = 'login';
    this.login.err = err || '';
  },
  // Signing out of a shared session signs this device out of Vikunja's web app too.
  signOut(msg, {tellServer = true} = {}){
    // Signing out yourself drops the saved lists and anything still waiting to be sent (after asking).
    if (!msg) {
      const waiting = this.pending.length;
      if (waiting && !confirm(`${waiting === 1 ? 'A task you added offline hasn\'t' : `${waiting} captures you added offline haven't`} been sent yet. Sign out anyway and drop ${waiting === 1 ? 'it' : 'them'}?`)) return;
      outbox.save(outbox.all().filter(e => e.user !== this.user?.id));
      this.pending = [];
    }
    saved.clear();
    if (this.mode === 'session') {
      const t = sharedToken.get();
      if (tellServer && t) fetch(this.server + '/api/v1/user/logout', {method:'POST', credentials:'include', headers: {Authorization: 'Bearer ' + t}}).catch(() => {});
      sharedToken.del();
    }
    this.token = ''; this.signedIn = false; this.user = null; this.mode = 'session';
    store.del('token'); store.del('mode'); this.closeSheet(true);
    userCache.clear(); this.access = {}; this.userKnown = {}; this.accessBlocked = false; this.people = null; this.labels = []; this.labelsLoaded = false;
    this.showLogin(msg ? esc(msg) : '');
    if (!this.info) this.probe();
  },
  async busy(fn){ this.login.busy = true; try { return await fn(); } finally { this.login.busy = false; } },
  // Ask Vikunja which sign-in methods it offers.
  async probe(){ await this.busy(async () => {
    this.login.err = '';
    try {
      this.info = await api('/info', {auth:false});
      this.login.showTotp = !!this.info.totp_enabled;
      this.login.method = this.passwordAllowed ? 'session' : 'token';
      this.$nextTick(() => (this.passwordAllowed ? this.$refs.inUser : this.$refs.inToken)?.focus());
    } catch (err) {
      this.login.err = err instanceof NetError ? netHelp() : `Vikunja didn't answer as expected (${errText(err)}).`;
    }
  }); },
  async submitPassword(){ await this.busy(async () => {
    this.mode = 'session';
    try {
      const body = {username: this.login.user.trim(), password: this.login.pass, long_token: true};
      const totp = this.login.totp.trim(); if (totp) body.totp_passcode = totp;
      const j = await api('/login', {method:'POST', body, auth:false});           // also sets Vikunja's refresh cookie
      sharedToken.set(j.token); store.set('mode', 'session'); store.del('token');
      this.login.pass = ''; this.login.totp = '';
      await this.boot();
    } catch (err) {
      if (err.code === 1017) { this.login.showTotp = true; this.$nextTick(() => this.$refs.inTotp.focus()); }
      this.login.err = err.code === 1017 ? 'Enter your two-factor code.' : errText(err);
    }
  }); },
  async submitToken(){ await this.busy(async () => {
    this.mode = 'token'; this.token = this.login.token.trim();
    try {
      await api('/user', {retry:false});
      store.set('token', this.token); store.set('mode', 'token'); this.login.token = '';
      await this.boot();
    } catch (err) {
      this.token = ''; this.mode = 'session';
      this.login.err = err instanceof NetError ? netHelp() : 'That token didn\'t work. Check it hasn\'t expired and has “User” (under Other) ticked.';
    }
  }); },

  async boot(){
    this.screen = 'app'; this.signedIn = true;
    Object.assign(this.view, {loading: true, error: '', bootFailed: false, route: null});
    try {
      const [user, info] = await Promise.all([api('/user'), this.info ? Promise.resolve(this.info) : api('/info', {auth:false}).catch(() => null)]);
      this.user = user; this.info = info;
      saved.set('user', user); if (info) saved.set('info', info);
      await this.loadProjects();
      this.refreshPending();
      await this.render();
      this.flush();
    } catch (e) {
      if (e instanceof ApiError && e.status === 401) return;
      // Offline: carry on with what was loaded last time, if anything was.
      if (e instanceof NetError && saved.get('user')) {
        this.user = saved.get('user'); this.info = this.info || saved.get('info');
        this.setProjects(saved.get('projects') || []);
        this.refreshPending();
        await this.render();
        return;
      }
      Object.assign(this.view, {loading: false, error: errText(e), bootFailed: true});
    }
  },

  /* ---------- data ---------- */
  async loadProjects(){
    const list = await allPages('/projects?is_archived=false');
    this.setProjects(list.filter(p => p.id > 0 && !p.is_archived).sort((a,b) => (a.position||0) - (b.position||0) || a.title.localeCompare(b.title)));
    saved.set('projects', this.projects);
  },
  setProjects(list){ this.projects = list; this.projById = new Map(list.map(p => [p.id, p])); },
  async loadLabels(force){
    if (this.labelsLoaded && !force) return this.labels;
    this.labels = await allPages('/labels'); this.labelsLoaded = true; return this.labels;
  },
  get tree(){
    const kids = new Map();
    for (const p of this.projects) { const k = p.parent_project_id && this.projById.has(p.parent_project_id) ? p.parent_project_id : 0; if (!kids.has(k)) kids.set(k, []); kids.get(k).push(p); }
    const out = [];
    (function walk(pid, depth){ for (const p of kids.get(pid) || []) { out.push({p, depth}); walk(p.id, depth+1); } })(0, 0);
    return out;
  },
  get favorites(){ return this.projects.filter(p => p.is_favorite); },
  defaultProjectId(){
    if (this.route.name === 'project' && this.projById.has(this.route.id)) return this.route.id;
    const d = this.user?.settings?.default_project_id;
    if (d && this.projById.has(d)) return d;
    return this.projects[0]?.id;
  },
  /* Push a saved task into every list row showing it. */
  syncTask(saved){
    for (const g of this.view.groups) for (const t of g.tasks) if (t.id === saved.id) Object.assign(t, saved);
  },
  removeRow(id){
    for (const g of this.view.groups) { const i = g.tasks.findIndex(t => t.id === id); if (i >= 0) g.tasks.splice(i, 1); }
  },
  viewWantsDone(){ return this.route.name === 'project' && !!this.route.showDone; },

  /* ---------- views ---------- */
  go(hash){ location.hash = hash; },
  get head(){
    const r = this.route, now = new Date();
    if (r.name === 'projects') return {kicker: this.user ? '@' + this.user.username : '', title: 'Projects'};
    if (r.name === 'project') {
      const p = this.view.project; if (!p) return {kicker: '', title: 'Project'};
      return {kicker: this.projById.get(p.parent_project_id)?.title || 'Project', title: p.title};
    }
    return {kicker: now.toLocaleDateString([], {month:'long', day:'numeric'}), title: now.toLocaleDateString([], {weekday:'long'})};
  },
  get emptyText(){
    if (this.route.name === 'today') return {title: 'Nothing due this week.', body: 'Add a task below — try “Call Ana tomorrow !3”.'};
    if (!this.view.project) return {title: 'Project not found.', body: 'It may be archived or you lost access.'};
    return this.route.showDone ? {title: 'Nothing done here yet.', body: ''} : {title: 'All clear.', body: 'New tasks you add now land in this project.'};
  },
  rowMeta(t){
    const out = [], due = dueInfo(t.due_date);
    if (due) out.push({key: 'due', cls: 'due num ' + due.cls, text: due.label});
    const p = this.route.name === 'today' && this.projById.get(t.project_id);
    if (p) out.push({key: 'p', color: colorOf(p.hex_color), text: p.title});
    for (const l of (t.labels || []).slice(0,3)) out.push({key: 'l' + l.id, color: colorOf(l.hex_color), text: l.title});
    for (const u of t.assignees || []) if (u.id !== this.user?.id) out.push({key: 'u' + u.id, text: '@' + u.username, label: 'Assigned to ' + (u.name || u.username)});
    if (t.repeat_after || t.repeat_mode === 1) out.push({key: 'rep', text: '↻', label: 'Repeats'});
    return out;
  },

  async render(){
    const r = currentRoute();
    if (r.name === 'add') {                      // deep link: #/add?text=Buy+milk+tomorrow
      history.replaceState(null, '', '#/today');
      await this.render();
      this.capture = r.text; this.$nextTick(() => this.$refs.capture.focus());
      return;
    }
    this.route = r;
    const seq = ++renderSeq;
    const fresh = this.view.route !== location.hash;   // new screen: show Loading; same screen: refresh in place
    if (fresh) Object.assign(this.view, {loading: true, groups: [], project: null, savedAt: null});
    this.view.route = location.hash; this.view.error = ''; this.view.bootFailed = false;
    try {
      if (r.name === 'today') await this.loadToday(seq);
      else if (r.name === 'projects') { if (!this.projects.length) await this.loadProjects(); }
      else if (r.name === 'project') await this.loadProject(seq, r);
      if (seq === renderSeq) { this.view.loading = false; this.view.savedAt = null; }   // fresh from Vikunja
    } catch (e) {
      if (seq !== renderSeq || (e instanceof ApiError && e.status === 401)) return;
      if (e instanceof NetError) {
        if (!fresh && !this.view.loading) return;                          // keep what's on screen; the banner says we're offline
        const s = saved.get(viewKey(r));
        if (s) {
          for (const g of s.groups) for (const t of g.tasks) cache.set(t.id, t);
          Object.assign(this.view, {loading: false, groups: s.groups, project: s.project || null, savedAt: s.at});
          return;
        }
      }
      if (!fresh && !this.view.loading) { this.notify('Couldn\'t refresh: ' + e.message); return; }
      Object.assign(this.view, {loading: false, error: errText(e)});
    }
  },
  async loadToday(seq){
    const end = addDays(startOfDay(), 8);
    const t0 = startOfDay(), t1 = addDays(t0, 1);
    const q = new URLSearchParams({filter: `done = false && due_date < '${end.toISOString()}'`, filter_timezone: TZ, sort_by: 'due_date', order_by: 'asc'});
    const qNew = new URLSearchParams({filter: `done = false && created >= '${t0.toISOString()}'`, filter_timezone: TZ, sort_by: 'created', order_by: 'desc'});
    const [tasks, added] = await Promise.all([allPages('/tasks?' + q), allPages('/tasks?' + qNew)]);
    if (seq !== renderSeq) return;
    for (const t of [...tasks, ...added]) cache.set(t.id, t);
    const groups = todayGroups(), [overdue, today, nodate, week] = groups;
    for (const t of tasks) {
      if (!isSet(t.due_date)) continue;
      const d = new Date(t.due_date);
      (d < t0 ? overdue : d < t1 ? today : week).tasks.push({...t});
    }
    // Yours, still without a date, and not a subtask: a pasted list shows only its first line.
    for (const t of added) if (!isSet(t.due_date) && t.created_by?.id === this.user?.id && !t.related_tasks?.parenttask?.length) nodate.tasks.push({...t});
    overdue.tasks.sort((a,b) => (b.priority||0) - (a.priority||0) || new Date(a.due_date) - new Date(b.due_date));
    this.view.groups = groups;
    saved.set('today', {groups, at: new Date().toISOString()});
  },
  async loadProject(seq, r){
    if (!this.projById.has(r.id)) await this.loadProjects();
    const p = this.projById.get(r.id);
    this.view.project = p || null;
    if (!p) { this.view.groups = []; return; }
    const q = new URLSearchParams({sort_by: 'due_date', order_by: 'asc', filter_include_nulls: 'true', filter_timezone: TZ});
    q.set('filter', r.showDone ? 'done = true' : 'done = false');
    const tasks = await allPages(`/projects/${p.id}/tasks?` + q);
    if (seq !== renderSeq) return;
    for (const t of tasks) cache.set(t.id, t);
    // dated first (soonest first), then undated newest first
    const dated = tasks.filter(t => isSet(t.due_date)).sort((a,b) => new Date(a.due_date) - new Date(b.due_date));
    const undated = tasks.filter(t => !isSet(t.due_date)).sort((a,b) => (b.priority||0) - (a.priority||0) || b.id - a.id);
    const list = r.showDone ? tasks.sort((a,b) => new Date(b.done_at) - new Date(a.done_at)) : [...dated, ...undated];
    this.view.groups = [{key: r.showDone ? 'done' : 'open', cls: '', title: r.showDone ? 'Done' : 'Open', tasks: list.map(t => ({...t}))}];
    saved.set(viewKey(r), {groups: this.view.groups, project: p, at: new Date().toISOString()});
  },
  async refresh(){
    this.refreshing = true;
    this.people = null; this.access = {}; this.userKnown = {}; this.labelsLoaded = false;   // sharing and labels may have changed too
    try { await this.loadProjects(); await this.render(); } catch (e) { this.notify(e.message); } finally { this.refreshing = false; }
  },

  async toggleDone(t, rowEl){
    const was = t.done;
    t.done = !was;
    try {
      const saved = await api('/tasks/' + t.id, {method:'POST', body: {...(cache.get(t.id) || t), done: !was}});
      cache.set(t.id, saved);
      Object.assign(t, saved);
      if (!was && !saved.done) {                 // repeating task rolled forward
        const d = dueInfo(saved.due_date);
        this.notify(d ? 'Repeats · next ' + d.label : 'Done — repeats');
        this.render(); return;
      }
      if (!was) this.notify('Done', {label: 'Undo', fn: async () => { await this.toggleDone(t, null); this.render(); }});
      setTimeout(async () => {                   // let the tick register, then slide the row away
        if (t.done === this.viewWantsDone()) return;
        await collapse(rowEl);
        if (t.done !== this.viewWantsDone()) this.removeRow(t.id);
      }, was ? 0 : 700);
    } catch (e) {
      t.done = was;
      this.notify(e instanceof NetError ? 'Offline — not saved' : 'Not saved: ' + e.message);
    }
  },

  /* ---------- quick add ---------- */
  get capLines(){ return captureLines(this.capture); },
  // The user's Vikunja settings: "default due time" and Quick Add Magic mode (vikunja, todoist or disabled).
  get dueTime(){ return this.user?.settings?.frontend_settings?.default_due_time || '12:00'; },
  get quickAddMode(){ return this.user?.settings?.frontend_settings?.quick_add_magic_mode || 'vikunja'; },
  get prefixes(){ return QUICK_ADD_PREFIXES[this.quickAddMode] || null; },
  get parseOpts(){ return {mode: this.quickAddMode, dueTime: this.dueTime}; },
  get parsed(){ return parseCapture(this.capLines[0] || '', this.projects, {...this.parseOpts, ignore: this.capIgnore}); },   // the first (or only) line
  get parsedAll(){ return parseCapture(this.capLines[0] || '', this.projects, this.parseOpts); },                            // the same, ignoring nothing
  /* A pasted list goes to one project: the first +project in it, on whichever line. A different +project on a later line
     stays in that line's text, as a second one does within a line. (Vikunja's own quick add reads each line on its own.)
     Returns {parsed: [each line], project, miss}; `first` is the first line already parsed, if there is one. */
  parseList(lines, first){
    let owner = -1;
    const parsed = lines.map((raw, i) => {
      const p = i === 0 && first ? first : parseCapture(raw, this.projects, owner >= 0 ? {...this.parseOpts, ignore: {project: true}} : this.parseOpts);
      if (owner < 0 && (p.project || p.projectMiss)) owner = i;
      return p;
    });
    const project = owner >= 0 ? parsed[owner].project : null, miss = owner >= 0 ? parsed[owner].projectMiss : null;
    return {parsed: lines.length > 1 ? parsed.map(p => ({...p, project})) : parsed, project, miss};
  },
  get captureHint(){
    const p = this.prefixes;
    return p ? `${p.project}project  ${p.label}label  ${p.assignee}user  !1–5  tomorrow · fri at 2 · Oct 12 · every week · tap a chip to undo it`
      : 'Quick add shortcuts are turned off in your Vikunja settings';
  },
  /* ---------- @username: who can see the task's project ---------- */
  // What checkAccess looks up: a single task's project and its @usernames. Empty when there's nothing to check.
  get accessQuery(){
    if (this.capLines.length !== 1 || this.accessBlocked || !this.prefixes) return '';
    const p = this.parsed;
    return p.assignees.length ? [p.project?.id || this.defaultProjectId(), ...p.assignees.map(n => n.toLowerCase())].join('|') : '';
  },
  /* From what checkAccess has found so far: {auto, warn}. auto is the one project everyone mentioned can see, when they
     can't all see the default project and no +project was typed; warn lists the chips for people the task can't reach. */
  get accessHints(){
    const out = {auto: null, warn: []};
    if (!this.accessQuery) return out;
    const p = this.parsed, target = p.project?.id || this.defaultProjectId(), at = this.prefixes.assignee;
    const sees = (pid, n) => this.access[pid + ':' + n.toLowerCase()];
    const known = p.assignees.filter(n => this.userKnown[n.toLowerCase()] !== false);
    p.assignees.filter(n => this.userKnown[n.toLowerCase()] === false).forEach(n => out.warn.push(`No user ${at}${n}`));
    const blocked = known.filter(n => sees(target, n) === false);
    if (!blocked.length) return out;
    if (!p.project) {
      const fits = [];
      for (const proj of this.projects) if (proj.id > 0 && proj.id !== target) {
        const v = known.map(n => sees(proj.id, n));
        if (v.includes(undefined)) return out;                                  // still looking
        if (v.every(Boolean)) fits.push(proj);
      }
      if (fits.length === 1) out.auto = fits[0];
    }
    if (!out.auto || this.capIgnore.autoProject) blocked.forEach(n => out.warn.push(`${at}${n} can't see ${this.projById.get(target)?.title || 'this project'}`));
    return out;
  },
  async checkAccess(){
    if (!this.accessQuery) return;
    const p = this.parsed, target = p.project?.id || this.defaultProjectId();
    try {
      let blocked = false;
      for (const n of p.assignees) if (await this.canSee(target, n) === false && await this.userExists(n)) blocked = true;
      // Someone can't see it: look through the other projects, so one everyone can see can be picked.
      if (blocked && !p.project) {
        const known = p.assignees.filter(n => this.userKnown[n.toLowerCase()] !== false);
        await Promise.all(this.projects.filter(x => x.id > 0 && x.id !== target).flatMap(x => known.map(n => this.canSee(x.id, n))));
      }
    } catch {}                                                                  // offline, say: no hints, and sending works as before
  },
  // Whether @name can see a project: true or false, or null when Pocket isn't allowed to look. Remembered until sign-out.
  async canSee(pid, name){
    const k = name.toLowerCase(), key = pid + ':' + k;
    if (key in this.access) return this.access[key];
    if (this.accessBlocked) return null;
    try {
      const u = (await api(`/projects/${pid}/projectusers?s=` + encodeURIComponent(name)) || []).find(x => x.username.toLowerCase() === k);
      if (u) { userCache.set(k, u); this.userKnown[k] = true; }
      return this.access[key] = !!u;
    } catch (e) {
      if (e instanceof NetError) throw e;
      if (e instanceof ApiError && e.status === 403) this.accessBlocked = true;  // an API token without Projects → projectusers
      return null;
    }
  },
  async userExists(name){
    const k = name.toLowerCase();
    if (!(k in this.userKnown)) this.userKnown[k] = !!(await this.findUser(name));
    return this.userKnown[k];
  },
  // The project a single task goes to: its +project, or the one picked for its @usernames, or the default.
  get capProjectId(){
    const auto = this.accessHints.auto;
    return this.parsed.project?.id || (auto && !this.capIgnore.autoProject ? auto.id : this.defaultProjectId());
  },

  /* ---------- suggestions for the @username or *label at the cursor ---------- */
  // {kind: 'assignee' | 'label', prefix, q, start, end}: the word being typed, from its prefix to the end of the word.
  get capToken(){
    const P = this.prefixes;
    if (!P || !this.capFocus) return null;
    const text = this.capture, at = Math.min(this.capCaret, text.length), tail = text.slice(at).match(/^\S*/)[0];
    for (const kind of ['assignee', 'label']) {
      const m = text.slice(0, at).match(new RegExp(`(^|\\s)\\${P[kind]}(?:"([^"]*)|([^\\s"]*))$`));
      if (m) return {kind, prefix: P[kind], q: m[2] ?? m[3] ?? '', start: m.index + m[1].length, end: at + tail.length};
    }
    return null;
  },
  /* Chips to tap instead of typing the rest: people who can see the task's project first, then others you share with.
     None once the word already names one exactly, so the usual chips show what will be saved. */
  get suggestions(){
    const tk = this.capToken;
    if (!tk) return null;
    const q = tk.q.toLowerCase();
    if (q && (tk.kind === 'label' ? this.labels.some(l => l.title.toLowerCase() === q) : (this.people || []).some(x => x.user.username.toLowerCase() === q))) return null;
    const score = (...names) => Math.min(...names.map(n => (n || '').toLowerCase()).map(n => n.startsWith(q) ? 0 : n.includes(q) ? 1 : 9));
    let out;
    if (tk.kind === 'label') {
      out = this.labels.map(l => ({l, s: score(l.title)})).filter(x => x.s < 9).sort((a, b) => a.s - b.s || a.l.title.localeCompare(b.l.title))
        .map(({l}) => ({key: 's' + l.id, kind: 'suggest', color: colorOf(l.hex_color), text: tk.prefix + l.title, hint: 'Use this label', action: () => this.useSuggestion(tk, l.title)}));
    } else {
      const pid = this.parsed.project?.id || this.defaultProjectId();
      out = (this.people || []).map(x => ({x, s: score(x.user.username, x.user.name), away: !x.pids.has(pid)})).filter(y => y.s < 9)
        .sort((a, b) => a.away - b.away || a.s - b.s || (a.x.user.name || a.x.user.username).localeCompare(b.x.user.name || b.x.user.username))
        .map(({x: {user: u}}) => ({key: 's' + u.id, kind: 'suggest', text: (u.name ? u.name + ' ' : '') + tk.prefix + u.username, hint: 'Assign ' + (u.name || u.username), action: () => this.useSuggestion(tk, u.username)}));
    }
    return out.length ? out.slice(0, 6) : null;
  },
  useSuggestion(tk, name){
    const word = tk.prefix + (/\s/.test(name) ? `"${name}"` : name) + ' ', el = this.$refs.capture;
    const text = this.capture = el.value = this.capture.slice(0, tk.start) + word + this.capture.slice(tk.end).replace(/^ /, '');
    // Set the text and cursor now, not on Alpine's next tick: a fast typist's next letters would otherwise land before the word.
    const at = this.capCaret = Math.min(tk.start + word.length, text.length);
    el.focus(); el.setSelectionRange(at, at);
  },
  /* Everyone with access to each of your projects, from Vikunja's list per project (which counts teams). Loaded once; it also
     tells checkAccess who can see what, without asking again. Skipped for an API token without Projects → projectusers. */
  async loadPeople(){
    if (this.people || this.accessBlocked) return;
    if (peopleLoading) return peopleLoading;
    peopleLoading = (async () => {
      const projs = this.projects.filter(p => p.id > 0), get = p => api(`/projects/${p.id}/projectusers`).then(r => r || []).catch(e => {
        if (e instanceof ApiError && e.status === 403) this.accessBlocked = true;
        return null;
      });
      const first = projs.length ? await get(projs[0]) : [];                    // one first, so a token that can't stops here
      if (this.accessBlocked) return;
      const lists = [first, ...await Promise.all(projs.slice(1).map(get))], byName = new Map();
      projs.forEach((p, i) => { for (const u of lists[i] || []) {
        const k = u.username.toLowerCase();
        if (!byName.has(k)) byName.set(k, {user: u, pids: new Set()});
        byName.get(k).pids.add(p.id);
      } });
      for (const [k, x] of byName) {
        userCache.set(k, x.user); this.userKnown[k] = true;
        projs.forEach((p, i) => { if (lists[i]) this.access[p.id + ':' + k] = x.pids.has(p.id); });
      }
      this.people = [...byName.values()];
    })().finally(() => { peopleLoading = null; });
    return peopleLoading;
  },

  get chips(){
    if (!this.capture.trim()) return [];
