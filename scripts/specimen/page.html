<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pocket · the task row in every state</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* The page around the rows: light and dark side by side, each a phone's width */
  body{background:#888}
  .specimen{display:flex;flex-wrap:wrap;gap:24px;padding:24px;align-items:flex-start}
  .theme{width:390px;padding:4px 16px 24px;background:var(--bg);color:var(--ink);border-radius:24px}
  .theme h1{font-size:20px;margin:16px 0 0}
  /* a row lit up stays lit, to be looked at */
  .row.fresh,.row.came-due{animation-play-state:paused}
  /* the bottom box, as it sits under a run's steps, not fixed to the page's foot */
  .spec-box{margin-top:16px}
</style>
</head>
<body x-data="specimen">

<!-- include markup/icons.html -->

<div class="specimen">
  <template x-for="theme in ['light', 'dark']" :key="theme">
    <section class="theme" :class="'theme-' + theme" inert>
      <h1 x-text="theme === 'light' ? 'Light' : 'Dark'"></h1>
      <template x-for="g in specimen" :key="g.title"><div>
        <div class="sec" x-text="g.title"></div>
        <!-- A project's Done section (screens/lists.html): its heading folded, and open -->
        <template x-if="g.fold"><div><div class="sec done-sec"><button type="button" class="sec-fold" aria-expanded="false"><span>Done (24)</span><svg class="i chev"><use href="#i-chev"/></svg></button></div>
          <div class="sec done-sec"><button type="button" class="sec-fold" aria-expanded="true"><span x-text="'Done (' + g.tasks.length + ')'"></span><svg class="i chev"><use href="#i-chev"/></svg></button></div></div></template>
        <div :class="g.sheet ? 'card' : 'list'">
          <template x-for="t in g.tasks" :key="t.id">
            <!-- include markup/task-row.html -->
          </template>
        </div>
      </div></template>
      <!-- Today's cards (today-item.html), three lines each: the heading (its title, priority bars and time); the step
           line, one line as a row on Today; and at its foot, its strip: ‹, its task's line, a segment per subtask (past
           12, ticks), the step showing marked on it and filled by its progress, ›, and its count. A task's subtask,
           paged mid-way; a run's step counting down; a run due at 6 PM, its heading as a task's, without the day it was
           started; one with one open step, with no arrows; one past 12 steps -->
      <div class="sec">Today’s cards: a task’s subtask, high priority, paged to 3 of 5 with 1 done; a run’s step, counting down, its name without its day; a run due at 6 PM, as a task’s; one step only, no arrows; one of 14, on 8, low priority</div>
      <template x-for="g in [{cards: true, line: true, depth: {}}]" :key="0"><div class="list">
        <template x-for="t in specimenCards" :key="t.id">
          <!-- include markup/today-item.html -->
        </template>
      </div></template>
      <!-- A run's step card (step-card.html), with Today's card's strip at its top: the run's line, the card's step marked
           and filled by its progress, and its place; then its title and who's on it -->
      <div class="sec">A run’s step card: on a step of yours, counting down, 5 of 11; one Priya is on, half done; one done, tapped in the list</div>
      <template x-for="runView in specimenRunCards" :key="runView.step.id"><div style="margin-bottom:12px">
        <!-- include markup/step-card.html -->
      </div></template>
      <!-- A run's screen adding steps from the bottom box (app.html, capW 'ins'): the step on its card lit, two steps
           added after it, one after the other, a third waiting to send, and the line above the box naming the last,
           with Repeat (cap-target.html) -->
      <div class="sec">A run’s screen, adding steps from the bottom box: two after the step on its card, a third waiting to send, the line naming the last</div>
      <template x-for="g in [{depth: {}, run: true, at: specimenAdding.at, locked: false}]" :key="0"><div class="list">
        <template x-for="t in specimenAdding.steps" :key="t.id">
          <!-- include markup/task-row.html -->
        </template>
      </div></template>
      <div class="addbox spec-box">
        <template x-for="target in [specimenAdding.target]" :key="0">
          <!-- include markup/cap-target.html -->
        </template>
        <form><div class="cap-field"><textarea rows="1" placeholder="Add a step, or paste a list" aria-label="New step"></textarea></div>
          <button class="go" type="button" disabled aria-label="Add step"><svg class="i"><use href="#i-up"/></svg></button></form>
      </div>
      <!-- Above quick add's box on a project's list (cap-target.html): adding subtasks to the task touched last, after its
           last subtask, and after the subtask touched; and on a run's screen, the step a step goes after, with Repeat -->
      <div class="sec">Above the add box: what it adds subtasks to; on a run, the step a step goes after, Repeat off for a step waiting to send</div>
      <template x-for="target in specimenTargets" :key="target.after">
        <!-- include markup/cap-target.html -->
      </template>
      <!-- A template's steps in its sheet (sheet/task.html, the rows under a template, at rest): numbered plainly, as the
           start sheet has them, since a square box is a step you tick, in a run; when each is due, and its notes' first
           line. A copy of that row's markup, which is part of the sheet's own. -->
      <div class="sec">A template’s steps in its sheet: plain numbers, as on the start sheet (a square box is a step you tick, in a run)</div>
      <div class="card">
        <template x-for="(st, i) in specimenTemplate" :key="i"><div class="row">
          <span class="check step-n num" aria-hidden="true" x-text="i + 1"></span>
          <button class="body"><div class="title" x-text="st.title"></div>
            <template x-if="st.text"><div class="meta"><span class="num" x-text="st.text"></span></div></template>
            <template x-if="st.note"><div class="step-note" x-text="st.note"></div></template></button>
        </div></template>
      </div>
      <div class="sec">A message in its place: under Overdue, by the add box, in a sheet, on a run's step</div>
      <template x-for="line in specimenLines" :key="line.key">
        <!-- include markup/place-line.html -->
      </template>
    </section>
  </template>
</div>

<script type="module" src="specimen.js"></script>
<script defer src="alpine.js"></script>
</body>
</html>
